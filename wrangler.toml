# Cloudflare deployment of the paid app. Deployed by .github/workflows/deploy.yml;
# the files come from: python3 dev/build.py --audio
name = "ma-quete-de-chevalier"
main = "dist/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The site's own address (domain bought by Nathan at OVH on 15/10/2026, DNS at Cloudflare).
# Cloudflare creates the DNS records and the certificate itself. The workers.dev address stays on.
routes = [
  { pattern = "maquetelegendaire.fr", custom_domain = true },
  { pattern = "www.maquetelegendaire.fr", custom_domain = true },
]

# The site (page, voice, fonts, legal pages). Requests for a file are served directly;
# everything else (the /api/ routes) goes to the worker.
[assets]
directory = "./site"
binding = "ASSETS"
# Pages go through the worker first, so that www and the technical workers.dev address can send
# visitors to maquetelegendaire.fr. Voice, fonts, places and images are served directly (free).
run_worker_first = ["/*", "!/audio/*", "!/fonts/*", "!/places/*", "!/*.png", "!/*.ico", "!/*.svg", "!/sw.js"]

[vars]
PRICE_CENTS = "2490"
SITE_HOST = "maquetelegendaire.fr"
# Real payments since 7 Nov 2026 (the tester mode, TESTEURS = "1", is off: /api/testeur and /api/avis answer 403).
# Nathan's private page maquetelegendaire.fr/espace (answers of the testers, counts). Login + random code
# given to Nathan on 27/10/2026; only its salted SHA-256 is here. New code: python3 dev/espace_code.py
ESPACE_ID = "nathan"
ESPACE_SALT = "758df55ecee50e7c49222472017e4e99"
ESPACE_HASH = "f8c98726a21cab7be73b12f2867cb15a5374896171c49a4bde37e0852617befb"
# The preview by e-mail (and one reminder a week later): on only once the secret BREVO_API_KEY is set
# (GitHub secret, pushed to Cloudflare by the deploy). The sender's domain must be authenticated at Brevo.
MAIL_FROM = "bonjour@maquetelegendaire.fr"
MAIL_FROM_NAME = "Ma Quête Légendaire"
MAIL_REPLY_TO = "maquetelegendaire@gmail.com"

[observability]
enabled = true

# Every day at 08:17 UTC: the e-mail reminders due (7 days after the request). Does nothing without BREVO_API_KEY.
[triggers]
crons = ["17 8 * * *"]

# Secrets, set by the deploy workflow: STRIPE_SECRET_KEY (from GitHub), QUEST_KEY (generated once).
