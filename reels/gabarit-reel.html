<!doctype html>
<!-- Gabarit du Reel « problème de parent → solution » (Ma Quête Légendaire).
     Rempli et piloté image par image par render_reel_probleme.py : window.render(t) dessine l'instant t (en s).
     Valeurs mesurées sur reference/Ma_Quete_Legendaire_Anniversaire_Petit_Prix.mp4 (1080×1920) ;
     un « top » ci-dessous = centre vertical de l'élément. -->
<html lang="fr"><head><meta charset="utf-8">
<style>
/* DejaVu Serif Bold + DejaVu Sans Bold, comme la référence ; l'italique est l'oblique synthétique de Chromium */
@font-face{font-family:"Titre";src:url("__FONTS__/DejaVuSerif-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
@font-face{font-family:"Texte";src:url("__FONTS__/DejaVuSans-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
:root{--bordeaux:#a33350;--bordeaux2:#97314c;--marine:#1f2a3d;--or:#9a6a2a;--filet:#c09e7c;--creme:#fcf6ef;--beige:#c09e7e;--barre:#bd253d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(180deg,#f6e6d9 0%,#efe6da 50%,#e5e9d8 100%);position:relative;font-family:"Texte",sans-serif;font-weight:700;-webkit-font-smoothing:antialiased}
#points{position:absolute;inset:0}
.c{position:absolute;left:540px;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;line-height:1.15}
#tete{position:absolute;inset:0}
#marque{top:148px;font-size:35px;letter-spacing:.09em;padding-left:.09em;color:var(--bordeaux);line-height:1}
#filet{top:198px;width:230px;height:3px;background:var(--filet);border-radius:2px}
#accroche{top:236px;font-family:"Titre";font-style:italic;font-size:34px;color:var(--marine)}
.scene{position:absolute;inset:0}
.sur{top:310px;font-size:31px;letter-spacing:.05em;padding-left:.05em;color:var(--or)}
.sur.fort{top:318px;font-size:48px;letter-spacing:.02em;color:var(--bordeaux)}
.badge{top:272px;font-size:34px;letter-spacing:.085em;padding:12px 30px 12px calc(30px + .085em);color:#fff;background:var(--bordeaux);border-radius:8px}
.zoom{display:inline-block;transform-origin:50% 55%;opacity:1}
.l1,.l2{font-family:"Titre";font-size:66px;line-height:1.1}
.l1{top:385px;color:var(--marine)}
.l2{top:470px;color:var(--bordeaux2);font-style:italic}
.accroche-scene .l1{top:368px;font-size:76px}
.accroche-scene .l2{top:470px;font-size:76px}
.carte{position:absolute;left:50px;top:575px;width:980px;height:760px;border-radius:24px;overflow:hidden;border:5px solid #fffaf4;box-shadow:0 26px 50px rgba(120,70,40,.20),0 4px 12px rgba(120,70,40,.10);background:#efe3d3}
.carte img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.cta .carte{top:705px;height:670px}
.sticker{position:absolute;transform:translate(-50%,-50%);background:var(--creme);border:3px solid var(--bordeaux);color:var(--bordeaux);font-size:38px;padding:10px 28px;border-radius:10px;white-space:nowrap;box-shadow:0 8px 18px rgba(80,30,30,.18)}
.barres{position:absolute;inset:0;pointer-events:none}
.barres line{stroke:var(--barre);stroke-width:10;stroke-linecap:round}
.pastille{top:1406px;font-size:27px;letter-spacing:.085em;padding:15px 36px 15px calc(36px + .085em);color:#fff;background:var(--bordeaux);border-radius:999px}
#rebours{top:1402px;font-size:37px;color:var(--marine);background:var(--creme);border:2px solid var(--beige);padding:11px 34px;border-radius:999px}
#rebours b{color:var(--bordeaux)}
#rail{top:1458px;width:520px;height:10px;background:#e6d4c1;border-radius:5px;overflow:hidden}
#rail i{display:block;height:100%;width:0;background:var(--bordeaux);border-radius:5px}
.bouton{top:558px;font-size:28px;letter-spacing:.05em;padding:15px 36px 15px calc(36px + .05em);color:#fff;background:var(--marine);border-radius:999px}
.sous{top:634px;font-size:36px;color:var(--bordeaux)}
/* CTA de rétention sur chaque slide (demande de Nathan) : pastille crème sous l'image, ou ligne sous la pastille de la solution */
.cta-pill{top:1406px;font-size:34px;color:var(--marine);background:var(--creme);border:2px solid var(--beige);padding:11px 32px;border-radius:999px}
.cta-ligne{top:1458px;font-size:30px;color:var(--bordeaux)}
.cta-pill b,.cta-ligne b{color:var(--bordeaux)}
.cta-ligne b{color:var(--marine)}
</style></head>
<body>
<svg id="points" width="1080" height="1920"></svg>
<div id="tete">
  <div id="marque" class="c" data-cle>MA QUÊTE LÉGENDAIRE</div>
  <div id="filet" class="c"></div>
  <div id="accroche" class="c" data-cle>Chasses au trésor pour enfants</div>
</div>
<div id="scenes"></div>
<div id="rebours" class="c" data-cle>⏳ La solution arrive dans <b>3 s</b></div>
<div id="rail" class="c"><i></i></div>
<script>
const DATA = __DATA__;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);          // ease-out cubique
// Minutage mesuré sur la référence : l'ancienne scène s'efface en 0,2 s autour de la frontière,
// les textes de la nouvelle montent (40 px, 0,45 s, décalés de 0,12 s), la carte suit 0,25 s plus tard.
const ZOOM_RETARD = 0.15, ZOOM_DUREE = 0.5, ZOOM_PREMIER = 0.3;   // grossissement des mots clés
const SORTIE = 0.2, TXT = 0.45, DECAL = 0.12, CARTE_RETARD = 0.25, CARTE = 0.45;

// fins points beiges épars (pseudo-aléatoire fixe : même fond à chaque rendu)
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let pts = ""; for (let i = 0; i < 70; i++) pts += `<circle cx="${(rnd()*1080).toFixed(1)}" cy="${(rnd()*1920).toFixed(1)}" r="${(1.5+rnd()*1.5).toFixed(1)}" fill="#cdb79c" opacity="${(.35+rnd()*.3).toFixed(2)}"/>`;
$("#points").innerHTML = pts;

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const gras = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");   // **mot** = mis en valeur
// Titres : **mot** = mot clé qui apparaît en grossissement (gros → taille normale, puis statique) pour accrocher l'œil
const zoom = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="zoom">$1</span>');
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// emplacements des stickers (centres), par rangées de deux comme dans la référence ; tous dans x 60→940
const SLOTS = [[240, 690], [745, 745], [255, 1095], [730, 1140], [300, 900], [700, 920]];
const ROTS = [-5, 5, 4, -5, -4, 5];
const iSolution = DATA.scenes.findIndex(x => x.type === "solution");

const scenes = DATA.scenes.map((s, i) => {
  const el = document.createElement("div");
  el.className = "scene " + s.type + (s.badge ? " accroche-scene" : "");
  let h = "";
  if (s.badge) h += `<div class="c badge" data-cle data-ligne>${zoom(s.badge)}</div>`;
  else if (s.surtitre) h += `<div class="c sur${i === iSolution ? " fort" : ""}" data-cle data-ligne>${zoom(s.surtitre)}</div>`;
  h += `<div class="c l1" data-cle data-ligne data-titre>${zoom(s.l1 || "")}</div><div class="c l2" data-cle data-ligne data-titre>${zoom(s.l2 || "")}</div>`;
  if (s.type === "cta") h += `<div class="c bouton" data-cle data-ligne>${esc(s.bouton || "CRÉER MON APERÇU GRATUIT")}</div><div class="c sous" data-cle data-ligne>${esc(s.sous_bouton || "Détails sur notre site · lien en bio")}</div>`;
  h += `<div class="carte"><img src="${s.image}"></div>`;
  (s.stickers || []).forEach((st, k) => {
    const o = typeof st === "string" ? {texte: st} : st;
    const [x, y] = o.x ? [o.x, o.y] : SLOTS[k % SLOTS.length];
    h += `<div class="sticker" data-cle data-sticker style="left:${x}px;top:${y}px" data-rot="${o.rot ?? ROTS[k % ROTS.length]}">${esc(o.texte)}</div>`;
  });
  if ((s.stickers || []).length) h += `<svg class="barres" width="1080" height="1920"></svg>`;
  if (s.pastille) h += `<div class="c pastille" data-cle>${esc(s.pastille)}</div>`;
  if (s.cta && s.type !== "cta") h += `<div class="c ${s.pastille ? "cta-ligne" : "cta-pill"}" data-cle data-ctaslide>${gras(s.cta)}</div>`;
  el.innerHTML = h;
  $("#scenes").appendChild(el);
  return {s, el, i};
});

// appelé une fois les polices chargées
window.ajuster = function () {
  // titre trop large (rare : la règle des 22 caractères suffit d'habitude) : on réduit la police
  document.querySelectorAll("[data-titre]").forEach(e => {
    const fs = parseFloat(getComputedStyle(e).fontSize);
    if (e.offsetWidth > 980) e.style.fontSize = Math.floor(fs * 980 / e.offsetWidth) + "px";
  });
  // stickers recentrés pour tenir entièrement dans x 60→940 (marge pour la rotation et le rebond)
  document.querySelectorAll("[data-sticker]").forEach(e => {
    const w = e.offsetWidth * 0.56 + 18, x = parseFloat(e.style.left);
    e.style.left = Math.min(940 - w, Math.max(60 + w, x)) + "px";
  });
  // un trait par rangée de deux stickers, d'un bord à l'autre de la carte (comme la référence)
  for (const {el} of scenes) {
    const svg = $(".barres", el); if (!svg) continue;
    const sts = [...el.querySelectorAll("[data-sticker]")].map(s => [parseFloat(s.style.left), parseFloat(s.style.top) + 14]);
    let l = "";
    for (let k = 0; k < sts.length; k += 2) {
      const a = sts[k], b = sts[k + 1];
      let x0, y0, x1, y1;
      if (b) { const m = (b[1] - a[1]) / (b[0] - a[0]); x0 = 80; x1 = 1000; y0 = a[1] + m * (x0 - a[0]); y1 = a[1] + m * (x1 - a[0]); }
      else { x0 = a[0] - 190; x1 = a[0] + 190; y0 = a[1] + 12; y1 = a[1] - 12; }
      if (y1 > 980) { const m = (y1 - y0) / (x1 - x0); y1 = y0 + m * (940 - x0); x1 = 940; }   // colonne de boutons
      const len = Math.hypot(x1 - x0, y1 - y0);
      l += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-len="${len}"/>`;
    }
    svg.innerHTML = l;
  }
};

const fin = DATA.scenes[DATA.scenes.length - 1].fin;
const debutSolution = (DATA.scenes.find(s => s.type !== "probleme") || {debut: fin}).debut;
const frontieres = DATA.scenes.slice(1).map(s => s.debut);

function monte(el, u, decal) {           // texte qui monte de 40 px
  const p = ease((u - decal) / TXT);
  el.style.opacity = p;
  el.style.transform = `translate(-50%, calc(-50% + ${(1 - p) * 40}px))`;
}
const bosse = (t, c, d) => clamp(1 - Math.abs(t - c) / d);   // triangle centré sur c

window.render = function (t) {
  for (const {s, el, i} of scenes) {
    const premier = i === 0, dernier = i === scenes.length - 1;
    const aOut = dernier ? 1 : 1 - clamp((t - (s.fin - SORTIE / 2)) / SORTIE);
    const visible = (premier || t >= s.debut) && aOut > 0;
    el.style.display = visible ? "block" : "none";
    if (!visible) continue;
    el.style.opacity = aOut;
    const u = premier ? 99 : t - s.debut;          // la première image est déjà composée (miniature)
    el.querySelectorAll("[data-ligne]").forEach((l, k) => {
      monte(l, u, k * DECAL);
      // mots clés en grossissement : arrivent 1,9× plus gros, se posent avec un léger rebond, puis restent statiques
      l.querySelectorAll(".zoom").forEach(z => {
        if (premier) {                      // 1re image déjà composée (miniature) : simple pulsation d'insistance
          const q = clamp((t - ZOOM_PREMIER) / ZOOM_DUREE);
          z.style.transform = `scale(${1 + 0.18 * Math.sin(Math.PI * q)})`; return;
        }
        const p = (u - k * DECAL - ZOOM_RETARD) / ZOOM_DUREE;
        z.style.opacity = clamp(p * 2.5);
        z.style.transform = `scale(${1.9 - 0.9 * easeBack(p)})`;
      });
    });
    const carte = $(".carte", el), pc = ease((u - CARTE_RETARD) / CARTE);
    carte.style.opacity = pc;
    carte.style.transform = `translateY(${(1 - pc) * 60}px)`;
    $("img", carte).style.transform = `scale(${1 + 0.03 * clamp((t - s.debut) / (s.fin - s.debut))})`;
    // stickers : un toutes les 0,5 s à partir de debut+0,57 s, puis barrés par rangée
    const sts = el.querySelectorAll("[data-sticker]"), n = sts.length;
    const t0 = s.debut + 0.57;
    const barre = s.barrer === false ? Infinity : (s.barrer_a ?? s.fin - 0.77);
    const pas = n > 1 ? Math.min(0.5, (barre - 0.35 - t0) / (n - 1)) : 0;
    sts.forEach((st, k) => {
      const v = (t - (t0 + k * pas)) / 0.3, rot = +st.dataset.rot;
      const sc = v <= 0 ? 0 : v < 0.6 ? ease(v / 0.6) * 1.12 : 1.12 - 0.12 * ease((v - 0.6) / 0.4);
      st.style.opacity = clamp(v * 3);
      st.style.transform = `translate(-50%,-50%) rotate(${rot * (0.4 + 0.6 * clamp(v))}deg) scale(${sc})`;
    });
    el.querySelectorAll(".barres line").forEach((ln, k) => {
      const len = +ln.dataset.len;
      ln.setAttribute("stroke-dashoffset", len * (1 - ease((t - barre - k * 0.17) / 0.15)));
    });
    const pa = $(".pastille", el);
    if (pa) { const p = ease((u - CARTE_RETARD - 0.3) / 0.4); pa.style.opacity = p; pa.style.transform = `translate(-50%,-50%) scale(${0.85 + 0.15 * p})`; }
    const cs = $("[data-ctaslide]", el);
    if (cs) { const p = ease((u - 0.9) / 0.4), b = Math.max(0, Math.sin((u - 1.6) * Math.PI * 1.2));
      cs.style.opacity = p; cs.style.transform = `translate(-50%, calc(-50% + ${(1 - p) * 20}px)) scale(${1 + 0.03 * b})`; }
    const bo = $(".bouton", el);
    if (bo) { const p = ease((u - 2 * DECAL) / TXT);
      bo.style.transform = `translate(-50%, calc(-50% + ${(1 - p) * 40}px)) scale(${1 + 0.035 * Math.max(0, Math.sin((u - 1) * Math.PI * 1.4))})`; }
  }
  // en-tête : léger creux à chaque transition, presque complet au passage à la solution (mesuré)
  let creux = 0;
  for (const f of frontieres) creux = Math.max(creux, (f === debutSolution ? 0.9 : 0.17) * bosse(t, f, 0.12));
  $("#tete").style.opacity = 1 - creux;
  $("#accroche").style.opacity = clamp((t - debutSolution) / 0.3);
  // compte à rebours (scènes problème) : décompte réel à la seconde + barre qui se remplit
  const rb = 1 - clamp((t - (debutSolution - SORTIE / 2)) / SORTIE);
  $("#rebours").style.opacity = $("#rail").style.opacity = rb;
  $("#rebours").style.display = $("#rail").style.display = rb <= 0 ? "none" : "block";
  $("#rebours b").textContent = Math.max(1, Math.ceil(debutSolution - t - 1e-6)) + " s";
  $("#rail i").style.width = (100 * clamp(t / debutSolution)) + "%";
};

// contrôle des zones protégées et des textes coupés, sur l'image courante
window.controle = function () {
  const err = [];
  document.querySelectorAll("[data-cle]").forEach(e => {
    let p = e; while (p && p !== document.body) { if (getComputedStyle(p).display === "none" || +getComputedStyle(p).opacity < 0.5) return; p = p.parentElement; }
    const r = e.getBoundingClientRect(), nom = e.textContent.trim().slice(0, 40);
    if (r.top < 125) err.push(`« ${nom} » au-dessus de y=130 (${r.top|0})`);
    if (r.bottom > 1480) err.push(`« ${nom} » sous y=1480 (${r.bottom|0})`);
    if (r.left < 40 || r.right > 1040) err.push(`« ${nom} » sort de l'écran en largeur (${r.left|0}→${r.right|0})`);
    if (r.right > 940 && r.bottom > 1000 && r.top < 1750) err.push(`« ${nom} » dans la colonne de boutons (x>940, y 1000→1750)`);
    if (e.hasAttribute("data-sticker") && (r.left < 60 || r.right > 940)) err.push(`sticker « ${nom} » hors de x 60→940 (${r.left|0}→${r.right|0})`);
    if (!e.hasAttribute("data-sticker") && e.scrollWidth > e.clientWidth + 2) err.push(`« ${nom} » coupé`);
  });
  return err;
};
</script>
</body></html>
