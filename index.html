<body>
<div class="wrap" id="app"></div>
<script>
/* ENGINE-START
   Quest generator: OpenStreetMap places around a start point -> a 4 to 6 step quest.
   Pure functions only (no DOM), so it runs in the browser and in Node for tests. */

const QuestEngine = (() => {
  const SEARCH_RADIUS = 700;     // metres around the start point
  const MAX_WALK = 1600;         // metres of walking for the whole quest
  const WALK_FACTOR = 1.3;       // straight line -> real walking distance
  const MIN_GAP = 60;            // two stops closer than this feel like one place

  function overpassQuery(lat, lon, r = SEARCH_RADIUS) {
    const a = `(around:${r},${lat.toFixed(6)},${lon.toFixed(6)})`;
    return `[out:json][timeout:25];(
nwr${a}["amenity"="place_of_worship"];
nwr${a}["amenity"~"^(fountain|townhall)$"];
nwr${a}["man_made"="water_well"];
nwr${a}["historic"~"^(city_gate|castle|tower|ruins|fort|manor|monument|memorial|archaeological_site)$"];
nwr${a}["leisure"~"^(park|playground|garden)$"];
nwr${a}["place"="square"];
nwr${a}["tourism"~"^(artwork|viewpoint)$"];
);out center tags;`;
  }

  function dist(a, b) {
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const q = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(q));
  }
  function bearing(a, b) {
    const r = x => x * Math.PI / 180;
    const y = Math.sin(r(b.lon - a.lon)) * Math.cos(r(b.lat));
    const x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lon - a.lon));
    const deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    return ["le nord", "le nord-est", "l'est", "le sud-est", "le sud", "le sud-ouest", "l'ouest", "le nord-ouest"][Math.round(deg / 45) % 8];
  }

  // ---- 1. classify OSM elements into kid-friendly categories ----
  const BASE = { gate: 9, castle: 9, ruins: 8, tower: 8, church: 8, well: 8, fountain: 7, viewpoint: 6,
    townhall: 6, square: 6, park: 6, statue: 6, memorial: 5, artwork: 5, playground: 4 };

  function classify(el) {
    const t = el.tags || {};
    if (t.access === "private" || t.access === "no") return null;
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    if (lat == null || lon == null) return null;
    let cat = null;
    if (t.historic === "city_gate") cat = "gate";
    else if (["castle", "fort", "manor"].includes(t.historic)) cat = "castle";
    else if (t.historic === "ruins" || t.historic === "archaeological_site") cat = t.name ? "ruins" : null;
    else if (t.historic === "tower" || t.man_made === "tower") cat = "tower";
    else if (t.amenity === "place_of_worship") cat = (!t.religion || t.religion === "christian") ? "church" : null;
    else if (t.man_made === "water_well") cat = "well";
    else if (t.amenity === "fountain") cat = "fountain";
    else if (t.amenity === "townhall") cat = (!t.townhall || t.townhall === "city") ? "townhall" : null;
    else if (t.historic === "memorial") {
      const m = t.memorial || "";
      if (["plaque", "stolperstein", "blue_plaque", "bench", "stone"].includes(m)) cat = null;
      else if (m === "war_memorial" || /morts|guerre/i.test(t.name || "")) cat = "memorial";
      else if (m === "statue" || m === "bust") cat = "statue";
      else cat = t.name ? "statue" : null;
    }
    else if (t.historic === "monument") cat = "statue";
    else if (t.place === "square") cat = t.name ? "square" : null;
    else if (t.leisure === "park" || t.leisure === "garden") cat = (t.access === "private" || t.garden === "private") ? null : "park";
    else if (t.leisure === "playground") cat = "playground";
    else if (t.tourism === "viewpoint") cat = "viewpoint";
    else if (t.tourism === "artwork") cat = (t.artwork_type === "statue" || t.artwork_type === "sculpture") ? "statue" : (t.name ? "artwork" : null);
    if (!cat) return null;
    let score = BASE[cat] + (t.name ? 2 : 0) + (t.historic ? 1 : 0) + (t.wikidata || t.wikipedia ? 1 : 0);
    return { id: `${el.type}/${el.id}`, cat, lat, lon, name: t.name || "", score, tags: t };
  }

  // ---- 2. merge duplicates (church as a point and as a building, etc.) ----
  function dedupe(list) {
    const out = [];
    for (const p of list.sort((a, b) => b.score - a.score)) {
      const twin = out.find(q => dist(p, q) < (q.cat === p.cat ? 70 : 25));
      if (!twin) out.push(p);
    }
    return out;
  }

  // ---- 3. choose and order the stops ----
  const LIMIT = { church: 2, park: 2, fountain: 2, statue: 2, square: 1, playground: 1, memorial: 1,
    townhall: 1, gate: 2, tower: 2, castle: 1, ruins: 1, well: 1, artwork: 1, viewpoint: 1 };

  function pathLength(start, stops) {
    let d = 0, cur = start;
    for (const s of stops) { d += dist(cur, s); cur = s; }
    return d * WALK_FACTOR;
  }

  function greedyFrom(start, cands, first, n) {
    const chosen = [first], used = { [first.cat]: 1 };
    let cur = first;
    while (chosen.length < n) {
      let best = null, bestV = -Infinity;
      for (const c of cands) {
        if (chosen.includes(c)) continue;
        if ((used[c.cat] || 0) >= (LIMIT[c.cat] || 1)) continue;
        if (chosen.some(s => dist(s, c) < MIN_GAP)) continue;
        const v = c.score - 0.03 * dist(cur, c) - 2.5 * (used[c.cat] || 0);
        if (v > bestV) { bestV = v; best = c; }
      }
      if (!best) break;
      chosen.push(best); used[best.cat] = (used[best.cat] || 0) + 1; cur = best;
    }
    return chosen;
  }

  function twoOpt(start, stops) {
    let best = stops.slice(), improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < best.length - 1; i++) {
        for (let k = i + 1; k < best.length; k++) {
          const cand = best.slice(0, i).concat(best.slice(i, k + 1).reverse(), best.slice(k + 1));
          if (pathLength(start, cand) + 1e-6 < pathLength(start, best)) { best = cand; improved = true; }
        }
      }
    }
    return best;
  }

  function choose(start, places, want = 6) {
    const cands = places.filter(p => dist(start, p) <= SEARCH_RADIUS + 50);
    let best = null, bestV = -Infinity;
    const firsts = cands.slice().sort((a, b) => (b.score - 0.02 * dist(start, b)) - (a.score - 0.02 * dist(start, a))).slice(0, 10);
    for (const f of firsts) {
      for (const n of [want, want - 1, want - 2]) {
        if (n < 4) continue;
        let stops = twoOpt(start, greedyFrom(start, cands, f, n));
        while (stops.length > 4 && pathLength(start, stops) > MAX_WALK) {
          // drop the stop whose removal saves the most walking
          let drop = 0, save = -1;
          stops.forEach((_, i) => { const s = pathLength(start, stops) - pathLength(start, stops.filter((__, j) => j !== i)); if (s > save) { save = s; drop = i; } });
          stops = twoOpt(start, stops.filter((_, j) => j !== drop));
        }
        if (stops.length < 4 || pathLength(start, stops) > MAX_WALK) continue;
        const last = stops[stops.length - 1];
        const endBonus = ["park", "square", "playground", "gate", "castle"].includes(last.cat) ? 3 : 0;
        const v = stops.reduce((s, p) => s + p.score, 0) + stops.length * 4 - 0.006 * pathLength(start, stops) + endBonus;
        if (v > bestV) { bestV = v; best = stops; }
      }
    }
    return best;
  }

  // ---- 4. words and texts ----
  const WORDS = {
    6: { word: "FIDELE", say: "FIDÈLE", hint: "un vrai [[chevalier|chevalière]] l'est toujours envers ses amis", meaning: "Un [[chevalier|chevalière]] est fidèle à ses amis et à sa parole." },
    5: { word: "BRAVE", say: "BRAVE", hint: "un [[chevalier|chevalière]] n'a pas peur : [[il|elle]] est…", meaning: "Un [[chevalier|chevalière]] est brave : [[il|elle]] avance même quand c'est difficile." },
    4: { word: "EPEE", say: "ÉPÉE", hint: "c'est l'arme du [[chevalier|chevalière]]", meaning: "L'épée du [[chevalier|chevalière]] protège les plus faibles." }
  };

  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function scramble(word, rand) {
    const idx = [...word].map((_, i) => i);
    for (let tries = 0; tries < 20; tries++) {
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      const s = idx.map(i => word[i]).join("");
      if (s !== word) return s;
    }
    return word.split("").reverse().join("");
  }

  const T = {
    church: [{
      teaser: "Une tour où dorment des cloches.",
      generic: "l'église",
      clue: "Levez les yeux : cherchez un clocher qui dépasse des toits. La prochaine lettre s'y cache.",
      story: "Bravo, {N}. Te voici devant {P}. Au Moyen Âge, les chevaliers venaient prier avant de partir en voyage. Les cloches annonçaient les fêtes, les dangers et l'heure de la journée.",
      defi: "Restez à l'extérieur. En silence, comme des chevaliers en mission, comptez les fenêtres de la façade. Chacun murmure son nombre à l'oreille du Grand Maître.",
      defiIn: "Chaque chevalier fait sonner une cloche imaginaire : « Dong ! » Le Grand Maître choisit la cloche la plus grave et la plus rigolote.",
      q: "Comment s'appelle la tour d'une église où se trouvent les cloches ?", choices: ["Le clocher", "Le donjon", "La cheminée"], answer: 0,
      fact: "Le clocher abrite les cloches qui sonnent les heures et les fêtes.",
      hints: ["Elle « cloche »… elle sonne !", "Le mot ressemble à « cloche ».", "Le clocher."],
      adult: "Restez à l'extérieur. Si une cérémonie a lieu, parlez bas et faites le défi plus loin."
    }, {
      teaser: "Un lieu de pierre où l'on chuchote.",
      generic: "la chapelle",
      clue: "Cherchez un bâtiment surmonté d'une croix. Les chevaliers y venaient avant chaque grande aventure.",
      story: "Te voici devant {P}, {N}. Avant d'être [[nommé|nommée]] chevalier, un jeune écuyer passait toute une nuit à veiller dans une église ou une chapelle, sans dormir. On appelait cela la veillée d'armes.",
      defi: "La veillée d'armes : tout le monde ferme les yeux et reste parfaitement silencieux pendant quinze secondes, comme un écuyer qui veille.",
      defiIn: "La veillée d'armes : tout le monde ferme les yeux et reste parfaitement silencieux pendant quinze secondes, comme un écuyer qui veille.",
      timer: 15,
      q: "Comment s'appelait le jeune garçon qui aidait un chevalier avant d'en devenir un ?", choices: ["Un écuyer", "Un pompier", "Un pirate"], answer: 0,
      fact: "L'écuyer portait le bouclier du chevalier et s'occupait de son cheval.",
      hints: ["Il portait l'écu, c'est-à-dire le bouclier.", "Écu… écu…", "Un écuyer."],
      adult: "Restez à l'extérieur, à voix basse."
    }],
    gate: [{
      teaser: "Une porte qui gardait la ville.",
      generic: "la porte de la ville",
      clue: "Au Moyen Âge, les villes avaient des portes dans leurs murailles. Cherchez une tour sous laquelle on peut passer.",
      story: "Voici {P}. Ces portes étaient les gardiennes de la ville. Le soir, on les fermait, et des gardes surveillaient qui voulait entrer. Le Templier, lui, connaissait le mot de passe…",
      defi: "Devenez les gardes de la porte : tout le monde se tient droit comme une lance, sans bouger ni rire, pendant vingt secondes.",
      defiIn: "Devenez les gardes du château : tout le monde se tient droit comme une lance, sans bouger ni rire, pendant vingt secondes.",
      timer: 20,
      q: "À quoi servaient les portes d'une ville fortifiée ?", choices: ["À protéger la ville et surveiller qui entrait", "À faire joli pour les touristes", "À ranger les chevaux"], answer: 0,
      fact: "Le soir, on fermait les portes pour protéger les habitants.",
      hints: ["Pensez aux murailles autour de la ville.", "Les gardes n'étaient pas là pour décorer.", "Elles servaient à protéger."],
      adult: "Restez sur le trottoir : des voitures peuvent passer sous la porte."
    }, {
      teaser: "Une deuxième porte, gardée depuis des siècles.",
      generic: "la vieille porte",
      clue: "Une autre porte de l'ancienne muraille vous attend. Cherchez des pierres très anciennes au-dessus de la rue.",
      story: "Encore une porte, {N} ! {P} faisait partie des remparts. Les habitants payaient parfois une petite taxe pour faire entrer leurs marchandises en ville : on l'appelait l'octroi.",
      defi: "Le péage des chevaliers : pour passer, chaque chevalier doit donner au Grand Maître un mot qui commence par la première lettre de son prénom.",
      defiIn: "Le péage des chevaliers : pour passer, chaque chevalier doit donner au Grand Maître un mot qui commence par la première lettre de son prénom.",
      q: "Comment appelle-t-on le grand mur qui entourait une ville au Moyen Âge ?", choices: ["Les remparts", "La haie", "Le grillage"], answer: 0,
      fact: "Les remparts protégeaient la ville des attaques.",
      hints: ["On pouvait marcher dessus pour surveiller.", "Ça commence par « rem… ».", "Les remparts."],
      adult: "Restez sur le trottoir : des voitures peuvent passer sous la porte."
    }],
    tower: [{
      teaser: "Une tour d'où l'on voyait arriver les ennemis.",
      generic: "la tour",
      clue: "Cherchez une tour en pierre plus haute que les maisons autour. C'est un poste de guet parfait.",
      story: "Voici {P}, {N}. Du haut des tours, les guetteurs surveillaient l'horizon. S'ils voyaient arriver des ennemis, ils donnaient l'alerte.",
      defi: "Les guetteurs : chacun cherche autour de lui quelque chose de rouge, quelque chose de vert et un toit pointu. Le premier qui a trouvé les trois crie « Alerte ! ».",
      defiIn: "Les guetteurs : chacun cherche dans la pièce quelque chose de rouge, quelque chose de vert et un objet pointu. Le premier qui a trouvé les trois crie « Alerte ! ».",
      q: "Comment s'appelait le soldat qui surveillait l'horizon du haut d'une tour ?", choices: ["Le guetteur", "Le cuisinier", "Le jardinier"], answer: 0,
      fact: "Le guetteur faisait le guet, jour et nuit.",
      hints: ["Il faisait le « guet ».", "Ça commence par « guet… ».", "Le guetteur."],
      adult: "Restez sur le trottoir, groupe rassemblé."
    }],
    castle: [{
      teaser: "Une demeure de seigneur, solide comme un roc.",
      generic: "le château",
      clue: "Cherchez la demeure la plus fortifiée du coin : de gros murs, peut-être une tour. Un seigneur y vivait.",
      story: "Te voici devant {P}. Les seigneurs vivaient derrière d'épais murs de pierre. Les chevaliers les servaient et défendaient le château.",

  q.steps.forEach((st,i)=>{const got=S.solved.includes(i);const w=h("div",{class:"shield"+(got&&S.lastSolved===i?" pop":"")});
    w.innerHTML=`<svg viewBox="0 0 40 46"><path d="M3 3h34v16c0 13-8 20-17 24C11 39 3 32 3 19z" fill="${got?"var(--rose)":"var(--card)"}" stroke="var(--or)" stroke-width="2.5"/>`+
      (got?`<text x="20" y="27" text-anchor="middle" font-family="UnifrakturMaguntia, Georgia, serif" font-size="20" fill="#fff">${st.letter}</text>`:`<text x="20" y="27" text-anchor="middle" font-family="Alegreya Sans SC, sans-serif" font-size="13" fill="var(--muted)">${i+1}</text>`)+`</svg>`;

/* ---------- Network ---------- */
async function getJSON(url,opts,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);
  try{const r=await fetch(url,Object.assign({signal:c.signal},opts||{}));if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}finally{clearTimeout(t);}}
function townOf(a){a=a||{};return a.village||a.town||a.city||a.municipality||a.hamlet||"";}
async function searchPlaces(q){return getJSON(`${NOMINATIM}/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=fr&accept-language=fr&q=${encodeURIComponent(q)}`);}
async function reverseTown(lat,lon){try{const r=await getJSON(`${NOMINATIM}/reverse?format=jsonv2&zoom=14&accept-language=fr&lat=${lat}&lon=${lon}`,null,10000);return townOf(r.address);}catch(e){return "";}}
async function fetchPlaces(lat,lon){const r=await getJSON(OVERPASS,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(E.overpassQuery(lat,lon))},30000);return r.elements||[];}

/* ---------- Indoor quest (works anywhere, no map needed) ---------- */
function indoorQuest(){
  const cats=["church","gate","well","castle","square","park"];
  const W=E.WORDS[6];const scrambled="ELFIED";
  return {ok:true,indoorOnly:true,steps:cats.map((c,i)=>Object.assign({},E.T[c][0],{cat:c,letter:scrambled[i],P:E.T[c][0].generic,legM:0,dir:"",lat:null,lon:null})),
    word:W.word,say:W.say,hint:W.hint,meaning:W.meaning,scrambled,walkM:0,minutes:60};
}

async function startFrom(lat,lon,town){
  if(!S.name){note.textContent="Indiquez d'abord le prénom de l'enfant.";document.getElementById("hero-name")?.focus();return;}
  go({screen:"loading",start:{lat,lon},town:town||""});
  try{
    const els=await fetchPlaces(lat,lon);
    const q=E.build(els,{lat,lon});
    if(!q.ok){go({screen:"few",found:q.found});return;}
    go({quest:q,screen:"preview",indoor:false,unlocked:false,solved:[],step:0,phase:"travel"});
  }catch(e){go({screen:"neterr"});}
}

function routeLinks(st){
  if(st.lat==null)return null;
  const gm=`https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lon}&travelmode=walking`;
  const osm=`https://www.openstreetmap.org/?mlat=${st.lat}&mlon=${st.lon}#map=18/${st.lat}/${st.lon}`;
  return h("div",{class:"row"},h("a",{class:"btn ghost",href:gm,target:"_blank",rel:"noopener"},"Itinéraire à pied"),h("a",{class:"btn ghost",href:osm,target:"_blank",rel:"noopener"},"Voir la carte"));
}
function checkArrival(st,out){
  if(st.lat==null||!("geolocation" in navigator)){out.textContent="Position indisponible : validez avec « Nous y sommes ».";return;}
  out.textContent="Recherche de votre position…";
  navigator.geolocation.getCurrentPosition(p=>{
    const d=E.dist({lat:p.coords.latitude,lon:p.coords.longitude},st);
    if(d<=50){go({phase:"arrived",hint:0});}
    else out.textContent=`Encore environ ${Math.round(d/10)*10} m. Vous pouvez aussi valider avec « Nous y sommes ».`;
  },()=>{out.textContent="Position refusée ou indisponible : validez avec « Nous y sommes ».";},{enableHighAccuracy:true,timeout:9000,maximumAge:10000});
}
function timerBlock(sec){
  const disp=h("div",{class:"timer",text:String(sec)});let t=null;
  const b=h("button",{class:"btn gold",type:"button",onclick:()=>{if(t)return;let n=sec;disp.textContent=String(n);
    t=setInterval(()=>{n--;disp.textContent=String(Math.max(n,0));if(n<=0){clearInterval(t);t=null;disp.textContent="Bravo, chevaliers !";}},1000);}},"Lancer le compte à rebours");
  return h("div",{style:"display:flex;flex-direction:column;gap:8px"},disp,b);
}
function stepScreen(){
  const q=S.quest,i=S.step,st=q.steps[i],n=q.steps.length,P={P:st.P};
  const title=(S.indoor||S.phase!=="travel")?fill("{P}",P):"Où aller ?";
  const head=[shieldRow(),h("div",null,h("p",{class:"eyebrow",text:`étape ${i+1} sur ${n}`}),h("h2",{text:title}))];
  if(S.phase==="travel"){
    const out=h("p",{class:"note",role:"status"});
    return [...head,voiceCard(`Écoute bien, {N}. ${st.clue}`,"L'indice pour les enfants"),note,
      h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),
        h("p",null,h("b",{text:fill("{P}",P)})),
        st.legM?h("p",{class:"note",text:`Environ ${st.legM} m à pied, vers ${st.dir}.`}):null,
        h("p",{class:"note",text:st.adult}),routeLinks(st)),
      h("div",{class:"row"},
        h("button",{class:"btn ghost",type:"button",onclick:()=>checkArrival(st,out)},"Vérifier ma position"),
        h("button",{class:"btn",type:"button",onclick:()=>go({phase:"arrived",hint:0})},"Nous y sommes")),
      out,
      h("button",{class:"linkish",type:"button",onclick:()=>solve(i)},"Lieu fermé ou inaccessible ? Passer cette étape")];
  }
  if(S.phase==="arrived"){
    return [...head,voiceCard(st.story,null,P),note,
      h("div",{class:"card"},h("h3",{text:"Le défi des chevaliers"}),h("p",{text:fill(S.indoor?st.defiIn:st.defi,P)}),st.timer?timerBlock(st.timer):null),
      !S.indoor&&h("p",{class:"note",text:"Pour l'adulte : "+st.adult}),
      h("button",{class:"btn",type:"button",onclick:()=>go({phase:"question"})},"Défi réussi : à l'énigme !")];
  }
  if(S.phase==="question"){
    const fb=h("p",{role:"status"});const box=h("div",{class:"choices"});
    st.choices.forEach((c,ci)=>{const b=h("button",{class:"choice",type:"button",text:c});
      b.addEventListener("click",()=>{if(ci===st.answer){b.classList.add("right");fb.className="ok";fb.textContent="Bonne réponse ! "+st.fact;box.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(()=>solve(i),1400);}
        else{b.classList.add("wrong");fb.className="hint";fb.textContent="Pas tout à fait… essayez encore, ou demandez un indice.";}});
      box.append(b);});
    return [...head,h("div",{class:"card"},h("h3",{text:"L'énigme"}),h("p",null,h("b",{text:st.q})),box,fb,
      h("p",{class:"hint",text:S.hint>0?st.hints.slice(0,S.hint).map((x,k)=>`Indice ${k+1} : ${x}`).join("\n"):""}),
      S.hint<3&&h("button",{class:"btn ghost",type:"button",onclick:()=>go({hint:S.hint+1})},`Demander un indice (${S.hint+1}/3)`))];
  }
  if(S.phase==="letter"){
    const last=i===n-1;
    return [...head,h("div",{class:"card",style:"text-align:center"},h("h3",{text:"Lettre gagnée"}),h("div",{class:"letter pop",text:st.letter}),
        h("p",{class:"note",text:"Le gardien de cette lettre la répète trois fois à voix haute. Ensuite, il doit s'en souvenir jusqu'à la fin de la quête."}),
        h("p",{text:`Lettres retrouvées : ${S.solved.map(k=>q.steps[k].letter).join(" ")}`})),
      voiceCard(last
        ?`Voici la dernière lettre : ${st.letter}. Choisissez son gardien. Tu as maintenant toutes les lettres, {N}, mais elles sont dans le désordre… Retrouve le mot secret. Un indice : ${q.hint}.`
        :`Bien joué, {N}. Voici la lettre ${st.letter}. Choisissez un gardien de la lettre, un chevalier qui ne l'a pas encore été. Il devra s'en souvenir jusqu'à la fin de la quête.`),note,
      h("button",{class:"btn",type:"button",onclick:()=>last?go({screen:"final"}):go({step:i+1,phase:S.indoor?"arrived":"travel",hint:0})},last?"Trouver le mot secret":"Étape suivante")];
  }
  return [];
}
function solve(i){const solved=S.solved.includes(i)?S.solved:[...S.solved,i];go({solved,lastSolved:i,phase:"letter"});}

function diplomaScreen(){
  const q=S.quest;
  const end=`{N}, tu as retrouvé le mot secret : ${q.say}. ${q.meaning} Le Sceau du Temple est ouvert ! Grand Maître, remets le trésor aux chevaliers. Et toi, {N}, je te nomme [[Chevalier|Chevalière]] de l'Ordre des Gardiens du Temple. Joyeux anniversaire !`;
  const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  return [h("div",null,h("p",{class:"eyebrow",text:"quête accomplie"}),h("h2",{text:"Le trésor est à vous !"})),
    voiceCard(end,"Le dernier message du Grand Maître"),note,
    h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),h("p",{text:"C'est le moment de sortir le trésor de votre sac et de le remettre aux chevaliers."})),
    h("div",{class:"card diploma"},h("p",{class:"eyebrow",text:"ordre des gardiens du temple"}),h("p",{text:"Par ce diplôme, le Grand Maître nomme"}),
      h("div",{class:"name",text:S.name||"Jeune chevalier"}),h("p",null,h("b",{text:g("Chevalier","Chevalière")+" de l'Ordre des Gardiens du Temple"})),
      h("p",{class:"note",text:`pour avoir ouvert le Sceau du Temple${S.town&&!q.indoorOnly?" à "+S.town:""}, le ${today}, avec ${S.kids} compagnons d'armes.`})),
    h("p",{class:"note",text:"Faites une capture d'écran du diplôme pour le garder en souvenir."}),
    h("button",{class:"btn ghost",type:"button",onclick:()=>go(Object.assign({},defaults,{name:S.name,hero:S.hero,kids:S.kids,voice:S.voice}))},"Créer une nouvelle quête")];
}

function topbar(){
  if(["setup","loading","few","neterr","preview"].includes(S.screen))return null;
  return h("div",{class:"topbar"},h("span",{class:"eyebrow",text:"la quête des templiers"}),
    h("button",{class:"linkish",type:"button",onclick:()=>go({screen:"preview"})},"Aperçu"));
}
function render(){
  note.textContent="";stopVoice();app.replaceChildren();
  let screen=S.screen;
  if(!S.quest&&!["setup","loading","few","neterr"].includes(screen))screen="setup";
  if(S.quest&&!S.unlocked&&!["setup","preview","loading","few","neterr"].includes(screen))screen="preview";
  const map={setup:setupScreen,loading:loadingScreen,few:fewScreen,neterr:netErrScreen,preview:previewScreen,guide:guideScreen,intro:introScreen,step:stepScreen,final:finalScreen,diploma:diplomaScreen};
  const tb=topbar();if(tb)app.append(tb);
  (map[screen]||setupScreen)().forEach(n=>{if(n)app.append(n);});
}
// A reload in the middle of loading goes back to setup; everything else resumes where it was.
if(S.screen==="loading")S.screen="setup";
render();
})();
</script>
</body>
</html>
