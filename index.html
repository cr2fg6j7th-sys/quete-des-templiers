<script>
/* GEO-START
   Map helpers shared by the browser and the server: the OpenStreetMap query for places
   around a start point, and distances. The browser fetches the places itself; only the
   server chooses the stops. */

const QuestGeo = (() => {
  const SEARCH_RADIUS = 700;     // metres around the start point

  function overpassQuery(lat, lon, r = SEARCH_RADIUS) {
    const a = `(around:${r},${lat.toFixed(6)},${lon.toFixed(6)})`;
    return `[out:json][timeout:25];(
nwr${a}["amenity"="place_of_worship"];
nwr${a}["amenity"~"^(fountain|townhall)$"];
nwr${a}["man_made"="water_well"];
nwr${a}["historic"~"^(city_gate|castle|tower|ruins|fort|manor|monument|memorial|archaeological_site)$"];
nwr${a}["leisure"~"^(park|playground|garden)$"];
nwr${a}["place"="square"];
nwr${a}["tourism"~"^(artwork|viewpoint)$"];
);out center tags;`;
  }

  function dist(a, b) {
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const q = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(q));
  }

  function bearing(a, b) {
    const r = x => x * Math.PI / 180;
    const y = Math.sin(r(b.lon - a.lon)) * Math.cos(r(b.lat));
    const x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lon - a.lon));
    const deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    return ["le nord", "le nord-est", "l'est", "le sud-est", "le sud", "le sud-ouest", "l'ouest", "le nord-ouest"][Math.round(deg / 45) % 8];
  }

  // Keep only what the server needs from an Overpass answer: smaller upload, no geometry.
  function slim(elements) {
    return (elements || []).map(e => ({ type: e.type, id: e.id, lat: e.lat, lon: e.lon, center: e.center, tags: e.tags }))
      .filter(e => e.tags);
  }

  return { SEARCH_RADIUS, overpassQuery, dist, bearing, slim };
})();
if (typeof module !== "undefined") module.exports = QuestGeo;
/* GEO-END */

</script>
<script>
/* ENGINE-START
   Quest generator: OpenStreetMap places around a start point -> a 4 to 6 step quest.
   Pure functions only (no DOM): runs on the server (Cloudflare), in Node for tests,
   and in the browser for the free demo build. */

const QuestEngine = (() => {
  const G = (typeof QuestGeo !== "undefined") ? QuestGeo : require("./geo.js");
  const { SEARCH_RADIUS, overpassQuery, dist, bearing } = G;
  const MAX_WALK = 1600;         // metres of walking for the whole quest
  const WALK_FACTOR = 1.3;       // straight line -> real walking distance
  const MIN_GAP = 60;            // two stops closer than this feel like one place

  // ---- 1. classify OSM elements into kid-friendly categories ----
  const BASE = { gate: 9, castle: 9, ruins: 8, tower: 8, church: 8, well: 8, fountain: 7, viewpoint: 6,
    townhall: 6, square: 6, park: 6, statue: 6, memorial: 5, artwork: 5, playground: 4 };

  function classify(el) {
    const t = el.tags || {};
    if (t.access === "private" || t.access === "no") return null;
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    if (lat == null || lon == null) return null;
    let cat = null;
    if (t.historic === "city_gate") cat = "gate";
    else if (["castle", "fort", "manor"].includes(t.historic)) cat = "castle";
    else if (t.historic === "ruins" || t.historic === "archaeological_site") cat = t.name ? "ruins" : null;
    else if (t.historic === "tower" || t.man_made === "tower") cat = "tower";
    else if (t.amenity === "place_of_worship") cat = (!t.religion || t.religion === "christian") ? "church" : null;
    else if (t.man_made === "water_well") cat = "well";
    else if (t.amenity === "fountain") cat = "fountain";
    else if (t.amenity === "townhall") cat = (!t.townhall || t.townhall === "city") ? "townhall" : null;
    else if (t.historic === "memorial") {
      const m = t.memorial || "";
      if (["plaque", "stolperstein", "blue_plaque", "bench", "stone"].includes(m)) cat = null;
      else if (m === "war_memorial" || /morts|guerre/i.test(t.name || "")) cat = "memorial";
      else if (m === "statue" || m === "bust") cat = "statue";
      else cat = t.name ? "statue" : null;
    }
    else if (t.historic === "monument") cat = "statue";
    else if (t.place === "square") cat = t.name ? "square" : null;
    else if (t.leisure === "park" || t.leisure === "garden") cat = (t.access === "private" || t.garden === "private") ? null : "park";
    else if (t.leisure === "playground") cat = "playground";
    else if (t.tourism === "viewpoint") cat = "viewpoint";
    else if (t.tourism === "artwork") cat = (t.artwork_type === "statue" || t.artwork_type === "sculpture") ? "statue" : (t.name ? "artwork" : null);
    if (!cat) return null;
    let score = BASE[cat] + (t.name ? 2 : 0) + (t.historic ? 1 : 0) + (t.wikidata || t.wikipedia ? 1 : 0);
    return { id: `${el.type}/${el.id}`, cat, lat, lon, name: t.name || "", score, tags: t };
  }

  // ---- 2. merge duplicates (church as a point and as a building, etc.) ----
  function dedupe(list) {
    const out = [];
    for (const p of list.sort((a, b) => b.score - a.score)) {
      const twin = out.find(q => dist(p, q) < (q.cat === p.cat ? 70 : 25));
      if (!twin) out.push(p);
    }
    return out;
  }

  // ---- 3. choose and order the stops ----
  const LIMIT = { church: 2, park: 2, fountain: 2, statue: 2, square: 1, playground: 1, memorial: 1,
    townhall: 1, gate: 2, tower: 2, castle: 1, ruins: 1, well: 1, artwork: 1, viewpoint: 1 };

  function pathLength(start, stops) {
    let d = 0, cur = start;
    for (const s of stops) { d += dist(cur, s); cur = s; }
    return d * WALK_FACTOR;
  }

  function greedyFrom(start, cands, first, n) {
    const chosen = [first], used = { [first.cat]: 1 };
    let cur = first;
    while (chosen.length < n) {
      let best = null, bestV = -Infinity;
      for (const c of cands) {
        if (chosen.includes(c)) continue;
        if ((used[c.cat] || 0) >= (LIMIT[c.cat] || 1)) continue;
        if (chosen.some(s => dist(s, c) < MIN_GAP)) continue;
        const v = c.score - 0.03 * dist(cur, c) - 2.5 * (used[c.cat] || 0);
        if (v > bestV) { bestV = v; best = c; }
      }
      if (!best) break;
      chosen.push(best); used[best.cat] = (used[best.cat] || 0) + 1; cur = best;
    }
    return chosen;
  }

  function twoOpt(start, stops) {
    let best = stops.slice(), improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < best.length - 1; i++) {
        for (let k = i + 1; k < best.length; k++) {
          const cand = best.slice(0, i).concat(best.slice(i, k + 1).reverse(), best.slice(k + 1));
          if (pathLength(start, cand) + 1e-6 < pathLength(start, best)) { best = cand; improved = true; }
        }
      }
    }
    return best;
  }

  function choose(start, places, want = 6) {
    const cands = places.filter(p => dist(start, p) <= SEARCH_RADIUS + 50);
    let best = null, bestV = -Infinity;
    const firsts = cands.slice().sort((a, b) => (b.score - 0.02 * dist(start, b)) - (a.score - 0.02 * dist(start, a))).slice(0, 10);
    for (const f of firsts) {
      for (const n of [want, want - 1, want - 2]) {
        if (n < 4) continue;
        let stops = twoOpt(start, greedyFrom(start, cands, f, n));
        while (stops.length > 4 && pathLength(start, stops) > MAX_WALK) {
          // drop the stop whose removal saves the most walking
          let drop = 0, save = -1;
          stops.forEach((_, i) => { const s = pathLength(start, stops) - pathLength(start, stops.filter((__, j) => j !== i)); if (s > save) { save = s; drop = i; } });
          stops = twoOpt(start, stops.filter((_, j) => j !== drop));
        }
        if (stops.length < 4 || pathLength(start, stops) > MAX_WALK) continue;
        const last = stops[stops.length - 1];
        const endBonus = ["park", "square", "playground", "gate", "castle"].includes(last.cat) ? 3 : 0;
        const v = stops.reduce((s, p) => s + p.score, 0) + stops.length * 4 - 0.006 * pathLength(start, stops) + endBonus;
        if (v > bestV) { bestV = v; best = stops; }
      }
    }
    return best;
  }

  // ---- 4. words and texts ----
  const WORDS = {
    6: { word: "FIDELE", say: "FIDÈLE", hint: "[[un vrai chevalier|une vraie chevalière]] l'est toujours envers ses amis", meaning: "[[Un chevalier|Une chevalière]] est fidèle à ses amis et à sa parole." },
    5: { word: "BRAVE", say: "BRAVE", hint: "[[un chevalier|une chevalière]] n'a pas peur : [[il|elle]] est…", meaning: "[[Un chevalier|Une chevalière]] est brave : [[il|elle]] avance même quand c'est difficile." },
    4: { word: "EPEE", say: "ÉPÉE", hint: "c'est l'arme [[du chevalier|de la chevalière]]", meaning: "L'épée [[du chevalier|de la chevalière]] protège les plus faibles." }
  };

  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function scramble(word, rand) {
    const idx = [...word].map((_, i) => i);
    for (let tries = 0; tries < 20; tries++) {
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      const s = idx.map(i => word[i]).join("");
      if (s !== word) return s;
    }
    return word.split("").reverse().join("");
  }

  const T = {
    church: [{
      teaser: "Une tour où dorment des cloches.",
      generic: "l'église",
      clue: "Levez les yeux : cherchez un clocher qui dépasse des toits. La prochaine lettre s'y cache.",
      story: "Bravo, {N}. Te voici devant {P}. Au Moyen Âge, les chevaliers venaient prier avant de partir en voyage. Les cloches annonçaient les fêtes, les dangers et l'heure de la journée.",
      defi: "Restez à l'extérieur. En silence, comme des chevaliers en mission, comptez les fenêtres de la façade. Chacun murmure son nombre à l'oreille du Grand Maître.",
      defiIn: "Chaque chevalier fait sonner une cloche imaginaire : « Dong ! » Le Grand Maître choisit la cloche la plus grave et la plus rigolote.",
      q: "Comment s'appelle la tour d'une église où se trouvent les cloches ?", choices: ["Le clocher", "Le donjon", "La cheminée"], answer: 0,
      fact: "Le clocher abrite les cloches qui sonnent les heures et les fêtes.",
      hints: ["Elle « cloche »… elle sonne !", "Le mot ressemble à « cloche ».", "Le clocher."],
      adult: "Restez à l'extérieur. Si une cérémonie a lieu, parlez bas et faites le défi plus loin."
    }, {
      teaser: "Un lieu de pierre où l'on chuchote.",

    });
    const q = { ok: true, start: start || null, steps, word: W.word, say: W.say, hint: W.hint, meaning: W.meaning, scrambled,
      walkM: indoor ? 0 : Math.round(pathLength(start, stops) / 10) * 10,
      minutes: indoor ? 60 : 10 + steps.length * 9 };
    if (indoor) q.indoorOnly = true;
    else q.centroid = { lat: stops.reduce((a, s) => a + s.lat, 0) / stops.length, lon: stops.reduce((a, s) => a + s.lon, 0) / stops.length };
    return q;
  }

  function build(elements, start) {
    const s = select(elements, start);
    return s.ok ? assemble(start, s.stops) : s;
  }

  // What anyone sees before paying: no place, no position, no answer.
  function preview(q) {
    return { ok: true, indoorOnly: !!q.indoorOnly, count: q.steps.length, walkM: q.walkM, minutes: q.minutes, teasers: q.steps.map(s => s.teaser) };
  }

  return { overpassQuery, classify, dedupe, choose, select, assemble, indoorStops, build, preview, dist, bearing, articleize, T, HERE, WORDS, SEARCH_RADIUS, MAX_WALK };
})();
if (typeof module !== "undefined") module.exports = QuestEngine;
/* ENGINE-END */

</script>
<script>
/* VOICE-START
   The Grand Master's recorded voice: every line is generated once (Gemini TTS, voice Algenib)
   and reused for every customer. A message is a list of clip keys played in a row;
   "@name" stands for the child's first-name clip ("Léa,"), or "Jeune chevalier," when the
   name is not in the library; "@name?" plays the name only when it is recorded. Place names are never spoken: they stay on the adult's screen. */

const QuestVoice = (() => {
  // The texts come from the engine. The paid app does not ship the engine: its build injects
  // QUEST_VOICE_KEYS, the list of recorded clips, instead.
  const E = (typeof QuestEngine !== "undefined") ? QuestEngine : (typeof require === "function" ? require("./engine.js") : null);
  const STYLE = "Un très vieil homme sage, Grand Maître d'un ordre de chevaliers, qui parle à un enfant. Voix grave, chaleureuse, un peu voilée par l'âge. Il parle lentement et doucement, avec de petites pauses, comme s'il confiait un secret au coin du feu. Français de France, sans accent.";
  const VOICE = "Algenib";
  const LETTERS = ["F", "I", "D", "E", "L", "B", "R", "A", "V", "P"];

  const gender = (t, g) => t.replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g, (m, a, b) => g === "f" ? b : a);
  const cap = s => s.replace(/(^|[.!?…]\s+|«\s)([a-zàâäéèêëîïôöùûüç])/g, (m, a, b) => a + b.toUpperCase());

  const LINES = {};
  function add(key, text) {
    if (/\[\[/.test(text)) { LINES[key + "-m"] = cap(gender(text, "m")); LINES[key + "-f"] = cap(gender(text, "f")); }
    else LINES[key] = cap(text);
  }
  function key(base, g) { return KEYS.has(base) ? base : `${base}-${g === "f" ? "f" : "m"}`; }

  // Story text without the child's name (the name clip plays first) and without the place name.
  function spokenStory(t, here) {
    return t.replace(/,\s*\{N\}/g, "").replace(/\{N\},\s*/g, "").replace(/\{N\}/g, "jeune [[chevalier|chevalière]]")
      .replaceAll("{P}", here).replace(/\s+/g, " ").trim();
  }

  if (E) {
    add("vocatif", "jeune [[chevalier|chevalière]],");
    add("prologue-dehors", "approche. Je suis le Grand Maître de l'Ordre des Gardiens du Temple. Il y a bien longtemps, un chevalier du Temple passa par ici. Avant de repartir, il cacha un sceau magique et dispersa les lettres du mot secret qui permet de l'ouvrir. Aujourd'hui, c'est ton anniversaire, et j'ai besoin d'[[un chevalier courageux|une chevalière courageuse]]. Avec tes compagnons, suis les indices, relève mes défis, et rapporte-moi les lettres. Es-tu [[prêt|prête]] ?");
    add("prologue-maison", "approche. Je suis le Grand Maître de l'Ordre des Gardiens du Temple. Il y a bien longtemps, un chevalier du Temple cacha un sceau magique et dispersa les lettres du mot secret qui permet de l'ouvrir. Aujourd'hui, c'est ton anniversaire, et j'ai besoin d'[[un chevalier courageux|une chevalière courageuse]]. Je vais te raconter les lieux où il est passé, et tu relèveras mes défis sans quitter la maison. Es-tu [[prêt|prête]] ?");
    add("intro-dehors", "[[chevalier|chevalière]] de l'Ordre, la quête commence ! À chaque lieu, tu gagneras une lettre. Les lettres arrivent dans le désordre : à toi de retrouver le mot secret à la fin. Suis les indices, reste toujours près des adultes, et ouvre grand les yeux.");
    add("intro-maison", "[[chevalier|chevalière]] de l'Ordre, la quête commence ! À chaque lieu, tu gagneras une lettre. Les lettres arrivent dans le désordre : à toi de retrouver le mot secret à la fin. Aujourd'hui, nous voyageons par la pensée : écoute bien mes récits.");
    for (const [cat, list] of Object.entries(E.T)) list.forEach((t, v) => {
      add(`indice-${cat}-${v}`, "Écoute bien. " + t.clue);
      add(`recit-${cat}-${v}`, spokenStory(t.story, E.HERE[cat][v]));
    });
    for (const L of LETTERS) {
      add(`lettre-${L}`, `Bien joué ! Voici la lettre ${L}.`);
      add(`derniere-${L}`, `Et voici la dernière lettre : ${L}. Choisissez son gardien.`);
    }
    add("gardien", "Choisissez un gardien de la lettre, un chevalier qui ne l'a pas encore été. Il devra s'en souvenir jusqu'à la fin de la quête.");
    for (const W of Object.values(E.WORDS)) {
      add(`mot-${W.word}`, `Tu as maintenant toutes les lettres, mais elles sont dans le désordre. Retrouve le mot secret. Un indice : ${W.hint}${/…$/.test(W.hint) ? "" : "."}`);
      add(`fin-${W.word}`, `tu as retrouvé le mot secret : ${W.say}. ${W.meaning} Le Sceau du Temple est ouvert ! Grand Maître, remets le trésor aux chevaliers. Et toi,`);
    }
    add("nomme", "je te nomme [[Chevalier|Chevalière]] de l'Ordre des Gardiens du Temple. Joyeux anniversaire !");
  }
  const KEYS = (typeof QUEST_VOICE_KEYS !== "undefined") ? new Set(QUEST_VOICE_KEYS) : new Set(Object.keys(LINES));

  const slug = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  // Spelling variants that sound the same in French share one recording (Michael -> Mickaël, Lyna -> Lina).
  const sound = s => s.replace(/chael/g, "kael").replace(/sh/g, "ch").replace(/ck/g, "k").replace(/ph/g, "f").replace(/th/g, "t").replace(/rh/g, "r")
    .replace(/([aeiouy])h$/, "$1").replace(/(?!^)y/g, "i").replace(/([bcdfgklmnprtvz])\1/g, "$1");
  // Recorded clip for a typed first name, or null. names: the recorded slugs.
  function nameClip(name, names) {
    const s = slug(name);
    if (!s || !names) return null;
    if (names.has(s)) return s;
    if (!names._sound) { names._sound = new Map(); for (const n of names) if (!names._sound.has(sound(n))) names._sound.set(sound(n), n); }
    return names._sound.get(sound(s)) || null;
  }

  // Clip keys for one message. ctx: { g: "m"|"f", indoor, cat, v, letter, last, word }
  function message(kind, ctx) {
    const g = ctx.g, N = "@name", where = ctx.indoor ? "maison" : "dehors";
    switch (kind) {
      case "prologue": return [N, key(`prologue-${where}`, g)];
      case "intro": return ["@name?", key(`intro-${where}`, g)]; // no "Jeune chevalier, chevalier de l'Ordre"
      case "indice": return [key(`indice-${ctx.cat}-${ctx.v}`, g)];
      case "recit": return [N, key(`recit-${ctx.cat}-${ctx.v}`, g)];
      case "lettre": return ctx.last ? [key(`derniere-${ctx.letter}`, g), key(`mot-${ctx.word}`, g)] : [key(`lettre-${ctx.letter}`, g), "gardien"];
      case "fin": return [N, key(`fin-${ctx.word}`, g), N, key("nomme", g)];
    }
    return [];
  }

  return { STYLE, VOICE, LINES, message, slug, key, sound, nameClip };
})();
if (typeof module !== "undefined") module.exports = QuestVoice;
/* VOICE-END */

</script>
<script>
(function(){
"use strict";
// Paid build: the server chooses the places and unlocks the quest after payment.
// Demo build (GitHub Pages): everything runs in the phone, the unlock button is free.
const PAID=false;
const E=(typeof QuestEngine!=="undefined")?QuestEngine:null;
const G=QuestGeo;
const STORE="quete-templiers-v3";
let PRICE="24,90 €";
const OVERPASS="https://overpass-api.de/api/interpreter";
const NOMINATIM="https://nominatim.openstreetmap.org";

/* ---------- State ---------- */
// preview: what is shown before paying; token: the sealed quest (paid build); quest: the full quest once unlocked;
// paid: the Stripe session that unlocked it (also the key of the reopen link).
const defaults={ref:"",name:"",hero:"m",kids:8,indoor:false,unlocked:false,screen:"home",start:null,town:"",preview:null,token:"",quest:null,paid:"",step:0,phase:"travel",solved:[],hint:0,voice:""};
let S=Object.assign({},defaults);
try{const raw=localStorage.getItem(STORE);if(raw)S=Object.assign({},defaults,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}

function fill(t,extra){
  let s=String(t).replaceAll("{N}",S.name||"jeune chevalier").replaceAll("{V}",S.town||"la ville");
  if(extra&&extra.P!=null)s=s.replaceAll("{P}",extra.P);

  return s.replace(/(^|[.!?]\s+|«\s)([a-zàâäéèêëîïôöùûüç])/g,(m,a,b)=>a+b.toUpperCase());
}
const g=(m,f)=>S.hero==="f"?f:m;

/* ---------- Voice: old Grand Master ---------- */
let frVoices=[],frVoice=null;
const MALE=/thomas|henri|paul|r[ée]my|daniel|nicolas|jacques|gr[ée]goire|antoine|claude|denis|male|homme|frd|frb/i;
const FEMALE=/am[ée]lie|audrey|aur[ée]lie|marie|julie|c[ée]line|virginie|denise|hortense|female|femme|frc|fre/i;
function pickVoice(){try{
  frVoices=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));

  const fr=frVoices.filter(x=>/^fr(-|_)FR/i.test(x.lang));

  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel();const run=++speakRun;
    const parts=(text.match(/[^.!?…]+(?:[.!?…]+(?:\s*»)?)?\s*/g)||[text]).filter(p=>p.trim()&&p.trim()!=="»");

    next();return true;}catch(e){return false;}

/* Recorded voice (Gemini TTS, voice Algenib), served from the audio/ folder; phone voice only as a fallback. */
const V=QuestVoice;
let nameSet=null;
try{fetch("audio/noms.json").then(r=>r.ok?r.json():[]).then(a=>{nameSet=new Set(a);}).catch(()=>{nameSet=new Set();});}catch(e){nameSet=new Set();}
// "@name" = the child's name, or "Jeune chevalier," when unknown; "@name?" = the name only when it is recorded.
function clipUrl(k){
  if(k==="@name"||k==="@name?"){const c=V.nameClip(S.name,nameSet);if(c)return `audio/noms/${c}.mp3`;return k==="@name"?`audio/voix/${V.key("vocatif",S.hero)}.mp3`:null;}
  return `audio/voix/${k}.mp3`;
}
let playRun=0,curAudio=null;
function playKeys(keys,fallbackText,onEnd){
  stopVoice();const run=++playRun;
  const clips=keys.map(clipUrl).filter(Boolean).map(u=>{const a=new Audio(u);a.preload="auto";return a;});
  let i=0;
  const fail=()=>{if(run!==playRun)return;playRun++;if(onEnd)onEnd();if(!speak(fallbackText))note.textContent="La voix n'est pas disponible : lisez le message à voix haute.";};
  const next=()=>{
    if(run!==playRun)return;
    if(i>=clips.length){if(onEnd)onEnd();return;}
    const a=clips[i++];curAudio=a;
    a.onended=()=>setTimeout(next,220);a.onerror=fail;
    const p=a.play();if(p&&p.catch)p.catch(fail);

/* ---------- DOM helpers ---------- */
const app=document.getElementById("app");
function h(tag,attrs,...kids){const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){if(k==="class")el.className=v;else if(k==="text")el.textContent=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)el.setAttribute(k,v===true?"":v);}

  return el;}

function playIcon(){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("width","18");s.setAttribute("height","18");s.setAttribute("aria-hidden","true");s.innerHTML='<path fill="currentColor" d="M8 5v14l11-7z"/>';return s;}

  return h("div",{class:"card voice"},h("h3",{text:label||"Message du Grand Maître"}),h("p",{text:t}),
    h("button",{class:"btn ghost",type:"button",onclick:play},playIcon()," Écouter le Grand Maître"));

  if(!("speechSynthesis" in window)||!frVoices.length)return null;

  q.steps.forEach((st,i)=>{const got=S.solved.includes(i);const w=h("div",{class:"shield"+(got&&S.lastSolved===i?" pop":"")});
    w.innerHTML=`<svg viewBox="0 0 40 46"><path d="M3 3h34v16c0 13-8 20-17 24C11 39 3 32 3 19z" fill="${got?"var(--rose)":"var(--card)"}" stroke="var(--or)" stroke-width="2.5"/>`+
      (got?`<text x="20" y="27" text-anchor="middle" font-family="UnifrakturMaguntia, Georgia, serif" font-size="20" fill="var(--on-rose)">${st.letter}</text>`:`<text x="20" y="27" text-anchor="middle" font-family="Alegreya Sans SC, sans-serif" font-size="13" fill="var(--muted)">${i+1}</text>`)+`</svg>`;
    row.append(w);});

}
function footer(){return h("footer",null,"Lieux : © contributeurs OpenStreetMap (licence ODbL). Recherche d'adresse : Nominatim.",h("br"),
  h("a",{href:"legal/cgv.html"},"Conditions de vente")," · ",h("a",{href:"legal/mentions-legales.html"},"Mentions légales")," · ",h("a",{href:"legal/confidentialite.html"},"Confidentialité"));}

/* ---------- Network ---------- */
async function getJSON(url,opts,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);
  try{const r=await fetch(url,Object.assign({signal:c.signal},opts||{}));if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}finally{clearTimeout(t);}}
function townOf(a){a=a||{};return a.village||a.town||a.city||a.municipality||a.hamlet||"";}
async function searchPlaces(q){return getJSON(`${NOMINATIM}/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=fr&accept-language=fr&q=${encodeURIComponent(q)}`);}
async function reverseTown(lat,lon){try{const r=await getJSON(`${NOMINATIM}/reverse?format=jsonv2&zoom=14&accept-language=fr&lat=${lat}&lon=${lon}`,null,10000);return townOf(r.address);}catch(e){return "";}}
async function fetchPlaces(lat,lon){const r=await getJSON(OVERPASS,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(G.overpassQuery(lat,lon))},30000);return r.elements||[];}

async function api(path,body,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||25000);
  try{const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),signal:c.signal});
    const j=await r.json().catch(()=>null);if(!j)throw new Error("HTTP "+r.status);return j;}finally{clearTimeout(t);}}
function previewOf(q){return {ok:true,indoorOnly:!!q.indoorOnly,count:q.steps.length,walkM:q.walkM,minutes:q.minutes,teasers:q.steps.map(s=>s.teaser)};}
// Free preview of a quest. body: {start, elements} or {indoor:true}.
async function makePreview(body){
  if(!PAID){const q=body.indoor?E.assemble(null,E.indoorStops()):E.build(body.elements,body.start);
    return q.ok?{ok:true,preview:previewOf(q),quest:q,token:""}:q;}

}

const fresh={unlocked:false,paid:"",solved:[],step:0,phase:"travel",hint:0};
async function startIndoor(){
  go({screen:"loading",start:null});
  try{const p=await makePreview({indoor:true});
    if(!p.ok)throw new Error(p.reason);

/* ---------- Screens ---------- */
/* ---------- Home: what the quest is, with the Grand Master's voice as a live sample ---------- */
const SEAL=`<svg class="seal" viewBox="-30 -30 60 60" aria-hidden="true">
  <path d="M0-27c4 0 5 2 8 2s5-1 8 1 1 5 3 7 5 2 6 5-1 5-1 8 2 5 0 8-5 2-7 4-2 5-5 6-5-1-8 0-4 3-7 3-4-2-7-3-6 0-8-2-1-5-3-7-5-3-6-6 1-5 0-8-3-5-1-8 5-2 7-4 2-6 5-7 5 1 8 0 3-3 6-3z" fill="var(--rose)"/>
  <circle r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
  <path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".85"/></svg>`;
const FAQ=[
  ["Faut-il préparer quelque chose ?","Seulement un petit trésor dans votre sac : bonbons, pièces en chocolat, médailles. Rien à cacher dans la rue, rien à imprimer."],

  ["Un lieu est fermé ou en travaux ?","Un bouton permet de passer l'étape, et la lettre est gagnée quand même."],

  ["Est-ce que ça marche dans ma ville ?","Partout en France où il y a quelques lieux publics à pied : un bourg, un quartier, un centre-ville. L'aperçu gratuit vous le dit avant de payer."],
  ["Le prénom de mon enfant est rare ?","Le Grand Maître connaît plus de mille prénoms. Pour les autres, il dit « jeune chevalier » ou « jeune chevalière », et le prénom s'affiche quand même à l'écran et sur le diplôme."],
  ["Faut-il installer une application ?","Non. La quête s'ouvre dans le navigateur du téléphone. Après le paiement, un lien permet de la rouvrir sur un autre téléphone, par exemple celui d'un autre adulte."],
  ["Peut-on la préparer à l'avance ?","Oui. Créez-la quand vous voulez : le lien de quête la rouvre le jour de la fête."]

function homeScreen(){
  const start=()=>go({screen:"setup"});

    words.textContent="« "+t+" »";
    playing=true;listen.replaceChildren("Arrêter");

  });
  const seg=h("div",{class:"seg",role:"group","aria-label":"Chevalier ou chevalière"},

async function startFrom(lat,lon,town){
  if(!S.name){note.textContent="Indiquez d'abord le prénom de l'enfant.";document.getElementById("hero-name")?.focus();return;}
  go({screen:"loading",start:{lat,lon},town:town||""});
  try{
    const els=G.slim(await fetchPlaces(lat,lon));
    const p=await makePreview({start:{lat,lon},elements:els});
    if(!p.ok){if(p.reason==="few"){go({screen:"few",found:p.found});return;}throw new Error(p.reason);}
    go(Object.assign({},fresh,{preview:p.preview,quest:p.quest,token:p.token,screen:"preview",indoor:false}));
  }catch(e){go({screen:"neterr"});}
}

function routeLinks(st){

  const gm=`https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lon}&travelmode=walking`;

function checkArrival(st,out){
  if(st.lat==null||!("geolocation" in navigator)){out.textContent="Position indisponible : validez avec « Nous y sommes ».";return;}
  out.textContent="Recherche de votre position…";
  navigator.geolocation.getCurrentPosition(p=>{
    const d=G.dist({lat:p.coords.latitude,lon:p.coords.longitude},st);
    if(d<=50){go({phase:"arrived",hint:0});}
    else out.textContent=`Encore environ ${Math.round(d/10)*10} m. Vous pouvez aussi valider avec « Nous y sommes ».`;
  },()=>{out.textContent="Position refusée ou indisponible : validez avec « Nous y sommes ».";},{enableHighAccuracy:true,timeout:9000,maximumAge:10000});
}

  if(S.phase==="travel"){
    const out=h("p",{class:"note",role:"status"});
    return [...head,voiceCard(`Écoute bien, {N}. ${st.clue}`,"L'indice pour les enfants",null,V.message("indice",{g:S.hero,cat:st.cat,v:st.v||0})),note,
      h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),
        h("p",null,h("b",{text:fill("{P}",P)})),
        st.legM?h("p",{class:"note",text:`Environ ${st.legM} m à pied, vers ${st.dir}.`}):null,
        h("p",{class:"note",text:st.adult}),routeLinks(st)),
      h("div",{class:"row"},
        h("button",{class:"btn ghost",type:"button",onclick:()=>checkArrival(st,out)},"Vérifier ma position"),
        h("button",{class:"btn",type:"button",onclick:()=>go({phase:"arrived",hint:0})},"Nous y sommes")),
      out,
      h("button",{class:"linkish",type:"button",onclick:()=>solve(i)},"Lieu fermé ou inaccessible ? Passer cette étape")];
  }
  if(S.phase==="arrived"){
    return [...head,voiceCard(st.story,null,P,V.message("recit",{g:S.hero,cat:st.cat,v:st.v||0})),note,
      h("div",{class:"card"},h("h3",{text:"Le défi des chevaliers"}),h("p",{text:fill(S.indoor?st.defiIn:st.defi,P)}),st.timer?timerBlock(st.timer):null),
      !S.indoor&&h("p",{class:"note",text:"Pour l'adulte : "+st.adult}),
      h("button",{class:"btn",type:"button",onclick:()=>go({phase:"question"})},"Défi réussi : à l'énigme !")];
  }
  if(S.phase==="question"){
    const fb=h("p",{role:"status"});const box=h("div",{class:"choices"});
    st.choices.forEach((c,ci)=>{const b=h("button",{class:"choice",type:"button",text:c});
      b.addEventListener("click",()=>{if(ci===st.answer){b.classList.add("right");fb.className="ok";fb.textContent="Bonne réponse ! "+st.fact;box.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(()=>solve(i),1400);}
        else{b.classList.add("wrong");fb.className="hint";fb.textContent="Pas tout à fait… essayez encore, ou demandez un indice.";}});
      box.append(b);});
    return [...head,h("div",{class:"card"},h("h3",{text:"L'énigme"}),h("p",null,h("b",{text:st.q})),box,fb,
      h("p",{class:"hint",text:S.hint>0?st.hints.slice(0,S.hint).map((x,k)=>`Indice ${k+1} : ${x}`).join("\n"):""}),
      S.hint<3&&h("button",{class:"btn ghost",type:"button",onclick:()=>go({hint:S.hint+1})},`Demander un indice (${S.hint+1}/3)`))];
  }
  if(S.phase==="letter"){
    const last=i===n-1;
    return [...head,h("div",{class:"card",style:"text-align:center"},h("h3",{text:"Lettre gagnée"}),h("div",{class:"letter pop",text:st.letter}),
        h("p",{class:"note",text:"Le gardien de cette lettre la répète trois fois à voix haute. Ensuite, il doit s'en souvenir jusqu'à la fin de la quête."}),
        h("p",{text:`Lettres retrouvées : ${S.solved.map(k=>q.steps[k].letter).join(" ")}`})),
      voiceCard(last
        ?`Voici la dernière lettre : ${st.letter}. Choisissez son gardien. Tu as maintenant toutes les lettres, {N}, mais elles sont dans le désordre… Retrouve le mot secret. Un indice : ${q.hint}${/…$/.test(q.hint)?"":"."}`
        :`Bien joué, {N}. Voici la lettre ${st.letter}. Choisissez un gardien de la lettre, un chevalier qui ne l'a pas encore été. Il devra s'en souvenir jusqu'à la fin de la quête.`,
        null,null,V.message("lettre",{g:S.hero,letter:st.letter,last,word:q.word})),note,
      h("button",{class:"btn",type:"button",onclick:()=>last?go({screen:"final"}):go({step:i+1,phase:S.indoor?"arrived":"travel",hint:0})},last?"Trouver le mot secret":"Étape suivante")];
  }
  return [];
}
function solve(i){const solved=S.solved.includes(i)?S.solved:[...S.solved,i];go({solved,lastSolved:i,phase:"letter"});}

function finalScreen(){
  const q=S.quest;const letters=S.solved.map(k=>q.steps[k].letter).join(" ");
  const inp=h("input",{type:"text",id:"secret",autocomplete:"off",placeholder:"Le mot secret"});const fb=h("p",{role:"status",class:"hint"});
  const check=()=>{const v=inp.value.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim();
    if(v===q.word)go({screen:"diploma"});else fb.textContent=`Ce n'est pas encore ça. Il commence par ${q.word[0]}.`;};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  return [shieldRow(),h("div",null,h("p",{class:"eyebrow",text:"le sceau du temple"}),h("h2",{text:"Le mot secret"})),
    h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),
      h("p",{text:"Appelez les gardiens des lettres et alignez-les face à vous. Chacun crie sa lettre. Les chevaliers changent de place jusqu'à former le mot secret. Puis tapez le mot ci-dessous."})),
    h("div",{class:"card",style:"text-align:center"},h("p",{text:"Si un gardien a oublié sa lettre, les voici, dans le désordre :"}),h("div",{class:"letter",text:letters})),
    h("div",{class:"card"},h("label",{for:"secret"},"L'adulte tape le mot trouvé par les enfants",inp),h("button",{class:"btn",type:"button",onclick:check},"Ouvrir le Sceau"),fb)];
}
function diplomaScreen(){
  const q=S.quest;
  const end=`{N}, tu as retrouvé le mot secret : ${q.say}. ${q.meaning} Le Sceau du Temple est ouvert ! Grand Maître, remets le trésor aux chevaliers. Et toi, {N}, je te nomme [[Chevalier|Chevalière]] de l'Ordre des Gardiens du Temple. Joyeux anniversaire !`;
  const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  return [h("div",null,h("p",{class:"eyebrow",text:"quête accomplie"}),h("h2",{text:"Le trésor est à vous !"})),
    voiceCard(end,"Le dernier message du Grand Maître",null,V.message("fin",{g:S.hero,word:q.word})),note,
    h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),h("p",{text:"C'est le moment de sortir le trésor de votre sac et de le remettre aux chevaliers."})),
    h("div",{class:"card diploma"},h("p",{class:"eyebrow",text:"ordre des gardiens du temple"}),h("p",{text:"Par ce diplôme, le Grand Maître nomme"}),
      h("div",{class:"name",text:S.name||"Jeune chevalier"}),h("p",null,h("b",{text:g("Chevalier","Chevalière")+" de l'Ordre des Gardiens du Temple"})),
      h("p",{class:"note",text:`pour avoir ouvert le Sceau du Temple${S.town&&!q.indoorOnly?" à "+S.town:""}, le ${today}, avec ${S.kids} compagnons d'armes.`})),
    h("p",{class:"note",text:"Faites une capture d'écran du diplôme pour le garder en souvenir."}),
    shareCard(),
    h("button",{class:"btn ghost",type:"button",onclick:()=>go(Object.assign({},defaults,{name:S.name,hero:S.hero,kids:S.kids,voice:S.voice,town:S.town,screen:"setup"}))},"Créer une nouvelle quête")];
}

// After the party: the parents of the guests are the next customers. Shares the home page, not the paid quest.
function shareCard(){
  const url=location.origin+location.pathname+"?ref=fete";
  const out=h("p",{class:"note",role:"status"});
  const share=async()=>{
    const text="Nous avons fêté un anniversaire avec La Quête des Templiers : une quête de chevaliers dans notre ville, au prénom de l'enfant.";
    try{if(navigator.share){await navigator.share({title:"La Quête des Templiers",text,url});return;}}catch(e){if(e&&e.name==="AbortError")return;}
    try{await navigator.clipboard.writeText(url);out.textContent="Lien copié.";}catch(e){out.textContent=url;}
  };
  return h("div",{class:"card adult"},h("h3",{text:"Les compagnons ont aimé ?"}),
    h("p",{class:"note",text:"Envoyez la présentation de la quête à leurs parents, pour un prochain anniversaire."}),
    h("button",{class:"btn ghost",type:"button",onclick:share},"Partager la quête"),out);
}
function topbar(){
  if(["home","setup","loading","few","neterr","preview","unlocking","unlockerr"].includes(S.screen))return null;
  return h("div",{class:"topbar"},h("span",{class:"eyebrow",text:"la quête des templiers"}),
    h("button",{class:"linkish",type:"button",onclick:()=>go({screen:"preview"})},"Aperçu"));
}
const OPEN=["home","setup","loading","few","neterr","unlocking","unlockerr"];
function render(){
  note.textContent="";stopVoice();app.replaceChildren();
  let screen=S.screen;
  if(!S.preview&&!OPEN.includes(screen))screen="home";
  else if(!(S.unlocked&&S.quest)&&!OPEN.includes(screen)&&screen!=="preview")screen="preview";
  const map={home:homeScreen,setup:setupScreen,loading:loadingScreen,few:fewScreen,neterr:netErrScreen,preview:previewScreen,unlocking:unlockingScreen,unlockerr:unlockErrScreen,
    guide:guideScreen,intro:introScreen,step:stepScreen,final:finalScreen,diploma:diplomaScreen};
  const tb=topbar();if(tb)app.append(tb);
  (map[screen]||homeScreen)().forEach(n=>{if(n)app.append(n);});
}

/* ---------- Back from Stripe, or a reopen link ---------- */
async function unlockWith(sid){
  const was=S.screen;
  go({screen:"unlocking",pending:sid});
  let r;
  try{r=await api("api/unlock",{session:sid});}catch(e){go({screen:"unlockerr",unlockErr:"net"});return;}
  if(!r.ok){go({screen:"unlockerr",unlockErr:r.reason==="unpaid"?"unpaid":r.reason==="bad"||r.reason==="unknown"?"bad":"net"});return;}
  const same=S.paid===sid&&S.quest;  // same quest on the same phone: keep the progress
  go(Object.assign(same?{}:Object.assign({},fresh,{screen:"guide"}),{
    quest:r.quest,preview:previewOf(r.quest),token:"",unlocked:true,paid:sid,pending:"",
    name:r.name||S.name,hero:r.hero,kids:r.kids||S.kids,town:r.town,start:r.quest.start,indoor:same?S.indoor:!!r.quest.indoorOnly},
    same?{screen:OPEN.includes(was)||was==="preview"?"guide":was}:{}));
}

// A reload in the middle of loading goes back to where it was; everything else resumes.
if(S.screen==="loading"||S.screen==="unlocking")S.screen=S.preview?"preview":"home";
const qs=new URLSearchParams(location.search);
if(qs.get("ref")){S.ref=qs.get("ref").replace(/[^a-z0-9-]/gi,"").slice(0,20);save();if(!qs.get("paid")&&!qs.get("quete"))history.replaceState(null,"",location.pathname);}
const sid=qs.get("paid")||qs.get("quete");
if(PAID&&sid){history.replaceState(null,"",location.pathname);unlockWith(sid);}
else if(qs.has("annule")){history.replaceState(null,"",location.pathname);if(S.preview)S.screen="preview";render();note.textContent="Paiement annulé : rien n'a été débité.";}
else render();
})();
</script>
