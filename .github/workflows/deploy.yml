# Puts the paid app online on Cloudflare at each push to main (and after new voice clips).
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STRIPE_SECRET_KEY.
# Until they exist, the workflow stops politely without failing.
name: Mise en ligne (Cloudflare)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Voix du Grand Maître"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"   # the 2nd of each month: new OpenStreetMap places

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.148.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que les comptes sont branchés
        id: ready
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STRIPE" ] || missing="$missing STRIPE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Mise en ligne en attente : secrets manquants :$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22

      # Places of France from OpenStreetMap, extracted once a month and kept in the Actions cache.
      # If an extraction fails, last month's places are used; with none at all, the app falls back
      # to the public Overpass servers.
      - name: Mois des lieux
        id: month
        if: steps.ready.outputs.ok == 'true'
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Lieux de France (copie du mois)
        id: places
        if: steps.ready.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: places-data
          key: places-v1-${{ steps.month.outputs.m }}
          restore-keys: places-v1-

      - name: Extraire les lieux de France
        id: extract
        if: steps.ready.outputs.ok == 'true' && steps.places.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          bash dev/places/extract.sh places-data.new
          rm -rf places-data && mv places-data.new places-data
          echo "::notice::Lieux de France extraits : $(cat places-data/index.json)"

      - name: Garder les lieux du mois
        if: steps.extract.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: places-data
          key: places-v1-${{ steps.month.outputs.m }}

      - name: Construire le site et le serveur
        if: steps.ready.outputs.ok == 'true'
        run: |
          python3 dev/build.py --audio
          node dev/test.js
          if [ -f places-data/index.json ]; then cp -r places-data site/places; echo "::notice::Lieux en ligne : $(cat places-data/index.json)"; fi
          # Town pages for Google, from the same places (a failure never blocks the deploy).
          if [ -f places-data/index.json ]; then
            if node dev/villes/build.mjs places-data site "$(cat dist/site-url.txt)" > /tmp/villes.log; then echo "::notice::$(tail -1 /tmp/villes.log)"; else echo "::warning::Pages de ville non construites : $(tail -3 /tmp/villes.log | tr '\n' ' ')"; fi
          fi

      # Anonymous visit counts (Workers KV, free plan). The namespace is created once; if the
      # Cloudflare token cannot do it, the site goes online without counts and a warning says so.
      - name: Compteurs de visites
        if: steps.ready.outputs.ok == 'true'
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          title="ma-quete-de-chevalier-compteurs"
          id=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=100" | jq -r --arg t "$title" '.result[]? | select(.title==$t) | .id' | head -1)
          if [ -z "$id" ]; then
            res=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" -d "{\"title\":\"$title\"}" "$api")
            id=$(printf '%s' "$res" | jq -r '.result.id // empty')
            [ -n "$id" ] || echo "::warning::Compteurs de visites non créés : $(printf '%s' "$res" | jq -c '.errors' | head -c 300). Il faut peut-être ajouter « Workers KV Storage : Modifier » au jeton Cloudflare."
          fi
          if [ -n "$id" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "STATS"\nid = "%s"\n' "$id" >> wrangler.toml
            echo "::notice::Compteurs de visites branchés"
          fi

      - name: Envoyer sur Cloudflare
        id: deploy
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # On failure, the end of wrangler's output becomes an annotation (readable without the full log).
          set -o pipefail
          if ! npx --yes $WRANGLER deploy 2>&1 | tee /tmp/deploy.log; then
            tail -n 25 /tmp/deploy.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          url=$(grep -o 'https://[^ ]*workers\.dev' /tmp/deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Adresse du site : $url"

      - name: Clés du serveur
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -o pipefail
          report() { tail -n 15 /tmp/secret.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          printf '%s' "$STRIPE_SECRET_KEY" | npx --yes $WRANGLER secret put STRIPE_SECRET_KEY > /tmp/secret.log 2>&1 || report
          # The quest encryption key is created once and never leaves Cloudflare. It must never
          # change: paid quests are reopened with it. If the list cannot be read, the step fails.
          list=$(npx --yes $WRANGLER secret list --format json)
          if ! printf '%s' "$list" | grep -q QUEST_KEY; then
            openssl rand -base64 32 | tr -d '\n' | npx --yes $WRANGLER secret put QUEST_KEY > /tmp/secret.log 2>&1 || report
          fi

      - name: Vérifier le site en ligne
        if: steps.ready.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          sleep 10
          node dev/smoke.mjs "${{ steps.deploy.outputs.url }}"
