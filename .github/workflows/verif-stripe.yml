# Reads the state of the Stripe account with the key kept in GitHub (never printed): key mode,
# activation, missing items, public details, payment methods. Runs on a push to the verif-stripe
# branch only, so it never redeploys the site.
name: Vérification Stripe

on:
  push:
    branches: [verif-stripe]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lire le compte Stripe
        env:
          K: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          node - <<'EOF'
          const k = process.env.K || "";
          const mode = /^(sk|rk)_live_/.test(k) ? "RÉELLE" : /^(sk|rk)_test_/.test(k) ? "test" : "inconnue";
          const kind = k.startsWith("rk_") ? "limitée" : "secrète";
          const get = async p => { const r = await fetch("https://api.stripe.com/v1/" + p, { headers: { authorization: "Bearer " + k } }); return { status: r.status, j: await r.json() }; };
          const out = [`Clé dans GitHub : ${kind}, mode ${mode}`];
          const a = await get("account");
          if (a.status !== 200) out.push(`compte : HTTP ${a.status} ${a.j.error ? a.j.error.type : ""}`);
          else {
            const x = a.j, bp = x.business_profile || {}, s = x.settings || {}, rq = x.requirements || {};
            out.push(`pays ${x.country}, type ${x.business_type || "?"}`);
            out.push(`paiements ${x.charges_enabled ? "activés" : "PAS activés"}, versements ${x.payouts_enabled ? "activés" : "PAS activés"}, dossier ${x.details_submitted ? "envoyé" : "pas envoyé"}`);
            out.push(`à fournir : ${(rq.currently_due || []).join(", ") || "rien"} ; en retard : ${(rq.past_due || []).join(", ") || "rien"} ; en vérification : ${(rq.pending_verification || []).join(", ") || "rien"} ; blocage : ${rq.disabled_reason || "aucun"}`);
            out.push(`nom public « ${bp.name || ""} », site ${bp.url || "vide"}, e-mail de contact ${bp.support_email ? "renseigné" : "vide"}, téléphone ${bp.support_phone ? "renseigné" : "vide"}`);
            out.push(`libellé relevé « ${(s.payments || {}).statement_descriptor || ""} », abrégé « ${(s.card_payments || {}).statement_descriptor_prefix || ""} », nom affiché « ${(s.dashboard || {}).display_name || ""} »`);
            out.push("capacités : " + (Object.entries(x.capabilities || {}).map(([c, v]) => c + " " + v).join(", ") || "aucune"));
          }
          const pm = await get("payment_method_configurations?limit=10");
          if (pm.status === 200) {
            const list = pm.j.data || [], c = list.find(x => x.is_default) || list[0];
            const st = n => !c || !c[n] ? "absent" : `${(c[n].display_preference || {}).value || "?"}${c[n].available ? "" : " (indisponible)"}`;
            if (c) out.push(`moyens de paiement : carte ${st("card")}, Apple Pay ${st("apple_pay")}, Google Pay ${st("google_pay")}, Link ${st("link")}`);
          } else out.push(`moyens de paiement : HTTP ${pm.status}`);
          // What the site itself needs: open a payment page (then cancel it at once: nothing is charged),
          // read payment pages and refunds (Sunday report). A restricted key (rk_) must allow these.
          const post = async (p, body) => { const r = await fetch("https://api.stripe.com/v1/" + p, { method: "POST", headers: { authorization: "Bearer " + k, "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(body) }); return { status: r.status, j: await r.json() }; };
          const cs = await post("checkout/sessions", { mode: "payment", locale: "fr", "line_items[0][quantity]": "1",
            "line_items[0][price_data][currency]": "eur", "line_items[0][price_data][unit_amount]": "2490",
            "line_items[0][price_data][product_data][name]": "Vérification (jamais payée)", success_url: "https://maquetelegendaire.fr/", cancel_url: "https://maquetelegendaire.fr/" });
          if (cs.status === 200) { const ex = await post("checkout/sessions/" + cs.j.id + "/expire", {}); out.push(`page de paiement : création OK (${cs.j.livemode ? "réelle" : "test"}), annulée ${ex.status === 200 ? "OK" : "HTTP " + ex.status}`); }
          else out.push(`page de paiement : REFUSÉE HTTP ${cs.status} ${cs.j.error ? (cs.j.error.type + " " + (cs.j.error.message || "")).slice(0, 160) : ""}`);
          const rs = await get("checkout/sessions?limit=1"); out.push(`lecture des paiements : ${rs.status === 200 ? "OK" : "REFUSÉE HTTP " + rs.status}`);
          const rf = await get("refunds?limit=1"); out.push(`lecture des remboursements : ${rf.status === 200 ? "OK" : "REFUSÉE HTTP " + rf.status}`);
          // The live site itself: a preview, then its payment page (cancelled at once, never paid; counted as "smoke").
          try {
            const site = "https://maquetelegendaire.fr";
            const sp = async (p, b) => { const r = await fetch(site + p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) }); let j = null; try { j = await r.json(); } catch (e) {} return { status: r.status, j }; };
            const pv = await sp("/api/preview", { indoor: true, ref: "smoke" });
            if (!pv.j || !pv.j.ok) out.unshift(`site : aperçu HTTP ${pv.status}`);
            else {
              const co = await sp("/api/checkout", { token: pv.j.token, consent: true, name: "Test", hero: "m", kids: 8, town: "Rosheim", ref: "smoke" });
              const id = co.j && co.j.url ? (co.j.url.match(/cs_(live|test)_[A-Za-z0-9]+/) || [""])[0] : "";
              if (co.j && co.j.ok && id) { const ex = await post("checkout/sessions/" + id + "/expire", {});
                out.unshift(`site en ligne : aperçu ${pv.j.testeur ? "TESTEURS" : "payant"}, prix ${pv.j.price || "?"}, page de paiement ${id.startsWith("cs_live") ? "RÉELLE" : "test"} ouverte (${co.j.branding === "ok" ? "aux couleurs" : "sans les couleurs"}), annulée ${ex.status === 200 ? "OK" : "HTTP " + ex.status}`); }
              else out.unshift(`site en ligne : paiement REFUSÉ HTTP ${co.status} ${JSON.stringify(co.j).slice(0, 200)}`);
            }
          } catch (e) { out.unshift("site en ligne : " + String(e).slice(0, 160)); }
          out.splice(1, 0, ...out.filter(l => /^(page de paiement|lecture)/.test(l)));
          for (const l of out) console.log("::notice::" + l.replace(/\n/g, " "));
          EOF
