# Temporary probe (branch sonde-communes only): what the commune APIs answer, and their CORS headers.
name: Sonde communes
on:
  push:
    branches: [sonde-communes]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Résultats de la sonde')"
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          O="Origin: https://maquetelegendaire.fr"
          get(){ curl -s -m 20 -D "out/$1.headers" -H "$O" -o "out/$1.json" -w "$1 %{http_code} %{time_total}s %{size_download}o\n" "$2" || echo "$1 FAIL"; }
          get geo-67-mairie "https://geo.api.gouv.fr/departements/67/communes?fields=nom,code,codesPostaux,centre,mairie"
          get geo-colmar "https://geo.api.gouv.fr/communes?lat=48.08&lon=7.36&fields=codeDepartement"
          get geopf-obernai "https://data.geopf.fr/geocodage/search?q=Obernai&type=municipality&limit=1&citycode=67348"
          grep -i -h "^access-control\|^HTTP\|^location" out/*.headers | sort | uniq -c
          grep -i -h "^access-control\|^HTTP\|^location" out/*.headers > out/resume.txt || true
          git config user.name "sonde"; git config user.email "sonde@users.noreply.github.com"
          git fetch -q origin sonde-communes && git checkout -q sonde-communes
          rm -rf sonde && mv out sonde && git add sonde && git commit -q -m "Résultats de la sonde [skip ci]" && git push -q origin sonde-communes
