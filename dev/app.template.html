/* Layout: one narrow column held by the adult guide; six shields track the quest. */
:root{
  --stone:#f7f0df;--card:#fffaf0;--ink:#192342;--muted:#5b5045;--rose:#a03244;--rose-soft:#f6e1de;--or:#a87a1f;--or-text:#8a6214;--line:#dccba6;--ok:#2f7a4f;--on-rose:#fff;--garance:#b8202b;
  --navy:#192342;--on-navy:#fffaf0;--gold:#e9c46a;--pink:#f0a3ac;--rose-text:#a03244;--cta:#192342;--on-cta:#fffaf0;
  --display:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --body:"Alegreya Sans","Alegreya Sans fallback",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.4rem}h2{font-size:1.8rem}
h3{font-family:var(--label);font-size:1rem;letter-spacing:.06em;margin:0;color:var(--rose)}
p{margin:0}
a{color:var(--rose)}
.lead{color:var(--muted)}
.eyebrow{font-family:var(--label);font-size:.85rem;letter-spacing:.12em;color:var(--or-text);text-transform:lowercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.adult{border-left:4px solid var(--or)}
.voice{background:var(--rose-soft);border:none}
.voice p{font-style:italic}
label{font-family:var(--label);letter-spacing:.05em;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=email],input[type=number],input[type=search],input[type=date],input[type=time],select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--stone);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px;font:inherit;font-family:var(--label)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--stone)}
button{cursor:pointer}
.btn{font:inherit;font-family:var(--label);letter-spacing:.05em;font-size:1.05rem;padding:12px 16px;border-radius:12px;border:0;background:var(--rose);color:var(--on-rose);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--or);color:var(--on-rose)}
.btn:focus-visible,.seg button:focus-visible,.choice:focus-visible,input:focus-visible,select:focus-visible,.result:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--label);font-size:.8rem;color:var(--muted);letter-spacing:.05em}
.teasers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.teasers li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.teasers .n{font-family:var(--label);color:var(--or);min-width:1.4em}
.lock{color:var(--muted);font-size:.85rem;font-family:var(--label);letter-spacing:.05em}
.shields{display:flex;gap:6px;justify-content:space-between}
.shield{flex:1;max-width:52px}
.shield svg{width:100%;height:auto;display:block}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--stone);color:var(--ink)}
.choice.wrong{border-color:var(--rose);background:var(--rose-soft)}
.choice.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.result{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--stone);color:var(--ink)}
/* Town of the party: field with its list of communes, nearby communes as buttons */
.town{display:flex;flex-direction:column;gap:12px}
.combo{position:relative}
.combo input{font-family:var(--body);letter-spacing:0}
.listbox{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:4;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(27,37,71,.18);max-height:min(55vh,330px);overflow:auto}
.listbox li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 12px;border-radius:8px;cursor:pointer;line-height:1.3}
.listbox li[aria-selected="true"],.listbox li:hover{background:var(--rose-soft)}
.listbox .nm{min-width:0;overflow-wrap:anywhere}
.listbox .d,.chip .d{color:var(--muted);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.near{display:flex;flex-direction:column;gap:8px}
.near-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.near-lab{font-family:var(--label);font-size:.95rem;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;line-height:1.2;padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--stone);color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--stone);border-color:var(--ink)}
.chip[aria-pressed="true"] .d{color:inherit;opacity:.8}
.locate{font:inherit;font-family:var(--label);font-size:.9rem;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:40px;border-radius:999px;border:1px solid var(--rose);background:transparent;color:var(--rose)}
.locate[disabled]{opacity:.6}
.chip:focus-visible,.locate:focus-visible,.more summary:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.chosen{color:var(--ok);font-weight:700}
.more{border-top:1px solid var(--line);padding-top:10px}
.more summary{cursor:pointer;font-size:.95rem;color:var(--muted)}
.more-in{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hint{font-size:.95rem;color:var(--muted);white-space:pre-line}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.qlab{font-family:var(--label);letter-spacing:.05em;font-size:.95rem}
.dip-images{display:flex;flex-direction:column;gap:14px}
.dip-image{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--stone);border-radius:12px;padding:12px 16px;font-size:.95rem;box-shadow:0 6px 20px rgba(27,37,71,.3);text-align:center}
footer .me{color:var(--ok)}
.ok{color:var(--ok);font-weight:700}
.note{font-size:.85rem;color:var(--muted)}
.letter{font-family:var(--display);font-size:3.2rem;color:var(--rose);line-height:1;text-align:center;letter-spacing:.15em}
.diploma{border:3px double var(--or);border-radius:6px;padding:22px 18px;text-align:center;gap:10px;background:var(--card)}
.diploma .sign{font-family:var(--display);font-size:1.05rem;color:var(--or);margin-top:4px}
.diploma .gm{display:flex;flex-direction:column;align-items:center;margin-top:6px;color:var(--ink)}
.diploma .gm svg{width:150px;height:auto;display:block;margin-bottom:-6px;color:var(--garance)}
.diploma .gm span{font-family:var(--display);font-size:.95rem;border-top:1px solid var(--muted);padding:3px 18px 0}
.diploma .name{font-family:var(--display);font-size:2.4rem;color:var(--rose)}
.timer{font-size:2.2rem;font-variant-numeric:tabular-nums;text-align:center;font-weight:700}
.map{width:100%;height:auto;display:block;border-radius:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;padding:4px;align-self:flex-start}
ul.rules{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--rose);margin:0 auto}
footer{font-size:.78rem;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
/* Home */
/* Avant-première banner (until the opening of 7 Nov 2026): the same promise as the videos. */
.avant{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 64px 12px 14px;background:var(--rose);color:var(--on-rose);font:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.avant b{display:block;font-family:var(--label,inherit);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.avant span{display:block;font-weight:700;font-size:1.02rem;line-height:1.3;margin-top:2px}
.avant small{display:block;font-size:.85rem;opacity:.9;margin-top:4px}
.qmenu{position:relative;flex:none}
.qmenu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-family:var(--label);letter-spacing:.05em;font-size:.85rem;color:var(--ink);white-space:nowrap}
.qmenu summary::-webkit-details-marker{display:none}
.qmenu summary:focus-visible{outline:3px solid var(--or);outline-offset:2px}

.qlist{position:absolute;right:0;top:calc(100% + 8px);z-index:7;width:min(280px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column;gap:2px}
.qlist a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}

.qlist .qn{font-weight:700}
.qlist .qs{font-size:.82rem;color:var(--muted)}

.words:empty{display:none}
.btn.big{font-size:1.15rem;padding:15px 18px}
.center{text-align:center}
.block{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.kit{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}

.faq details{border-top:1px solid var(--line);padding:12px 0}

.kres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.kres b{font-size:1.55rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--gold)}
.kres span{font-size:.9rem;color:#d6d9e8;line-height:1.3}
.btn.gold{background:var(--gold);color:var(--ink)}
.pmore summary{cursor:pointer;font-weight:700;color:var(--on-navy);min-height:44px;display:flex;align-items:center}
.pmore summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ptable-wrap{overflow-x:auto;border-radius:16px;border:1px solid rgba(255,250,240,.25);margin-top:6px}
.ptable{width:100%;border-collapse:collapse;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.ptable thead th{background:var(--navy);color:var(--on-navy);border-top:0;font-size:.95rem}
.ptable tbody th{font-weight:800}
.ages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ages li{display:flex;flex-direction:column;gap:4px;padding:10px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.ages li.on{background:#f6e7bf;border-color:var(--gold);color:var(--ink)}
.ages li.on span{color:var(--ink)}
.ages b{font-size:1.05rem;line-height:1.2}
.ages span{color:var(--muted);line-height:1.3;font-size:.9rem}
.gcard{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.gcard .gk{display:flex;align-items:center;gap:8px;font-family:var(--label);font-weight:700;font-size:.88rem;color:var(--muted)}
.gcard .gk .ico{width:auto;height:auto;background:none;color:currentColor}
.gcard strong{font-size:1.18rem;line-height:1.25}
.gcard .gp{color:var(--muted);line-height:1.4}
.gcard .gl{position:absolute;right:14px;top:10px;font-weight:800;font-size:.95rem}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;font-size:.95rem;text-decoration:none;white-space:nowrap}
.mchip.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy);font-weight:700}
#app[data-screen=home] .faq{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#app[data-screen=home] .faq details{border-top:1px solid var(--line);padding:9px 16px}
#app[data-screen=home] .faq details:first-child{border-top:0}
#app[data-screen=home] .faq details:last-child{border-bottom:0}
#app[data-screen=home] .faq summary{color:var(--ink);min-height:28px}
#app[data-screen=home] .faq details p{color:var(--muted)}
.finale{display:flex;flex-direction:column;gap:12px;margin-top:18px;padding:18px;border-radius:20px;background:#f6e7bf}
.finale .dsay .dr{width:78px}
/* The bar at the bottom of the screen, with its close button */
.mbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 4px 8px 8px;border-radius:18px;background:var(--navy);color:var(--on-navy);box-shadow:0 8px 24px rgba(25,35,66,.3)}
.mbar .btn{flex:1;min-width:0;min-height:48px;border-radius:999px;font-family:var(--body);letter-spacing:0;font-weight:800;font-size:1.02rem;padding:0 14px;background:var(--gold);color:var(--ink)}
.mbar-x{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--on-navy);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mbar-x .ico{width:auto;height:auto;background:none;color:currentColor}
.mbar .btn:focus-visible,.mbar-x:focus-visible{outline-color:var(--gold)}
/* While the bar shows: the "device recognised" message sits above it, and a field reached with Tab stays clear of it */
body:has(.mbar:not([hidden])) .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
html:has(#app[data-screen=home]){scroll-padding-bottom:96px}
@media (prefers-reduced-motion:no-preference){.mbar:not([hidden]){animation:barin .25s ease-out both}@keyframes barin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}}
/* Narrow phones; tablets; computers: the first screen and the step side by side, reading width elsewhere */
.mm-t{display:none}
@media (max-width:520px){.keyinfo li:last-child{flex-basis:100%}.keyinfo li:last-child::before{content:none}}
@media (max-width:599px){.phonevid{width:152px;gap:8px}.pv-frame,.film-open{border-radius:28px;padding:6px}.pv-screen,.film-poster{border-radius:23px}.phonevid video{width:140px;height:303px}.film-poster{aspect-ratio:140/353}.phonevid strong{font-size:1rem}}
@media (max-width:360px){.mbrand{font-size:1.1rem}.music.inhead .mu-t{display:none}.music.inhead{padding:0}.mhero h1{font-size:1.9rem}.times b{font-size:1.08rem}}
@media (min-width:600px){.mtag{display:block}.mm-t{display:inline}.mbrand{font-size:1.45rem}.mhero h1{font-size:2.6rem}.ha-img{height:280px}.ha-phone{width:120px}.modegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){
  #app[data-screen=home]{max-width:1180px;padding-inline:32px}
  #app[data-screen=home]>*{width:100%;max-width:720px;margin-inline:auto}
  #app[data-screen=home]>:is(.mhead,.mhero,.essai){max-width:none}
  #app[data-screen=home]>.mbar{max-width:420px}
  .mnav-wide{display:flex;gap:4px;margin-right:6px}
  .mnav-wide a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;color:var(--ink);font-weight:700;text-decoration:none}
  .mnav-wide a:hover{background:var(--card)}
  .mmenu{display:none}
  .mhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:36px 24px}
  .mhero h1{font-size:3.2rem}
  .hero-link{align-self:flex-start}
  .ctabox{max-width:440px}.ctabox .micro{text-align:left}
  .hero-art{margin:60px 24px 24px 0}
  .ha-img{height:auto;aspect-ratio:5/4}
  .ha-phone{width:150px;right:-24px;bottom:-30px;padding:6px;border-radius:22px}
  .ha-phone img{border-radius:16px}
  .hero-art .ha-dr{width:96px;left:34px;top:-70px}
  .hero-text{font-size:1.22rem}
  .essai{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);column-gap:40px;row-gap:16px;align-items:start}
  .essai-head{grid-column:1/-1;max-width:720px}
  .carnet{grid-column:1;grid-row:2}
  .essai-cta{grid-column:1;grid-row:3;max-width:440px}
  .essai-side{grid-column:2;grid-row:2/span 2;position:sticky;top:20px}
  .demo-card{display:grid;grid-template-columns:300px minmax(0,1fr);column-gap:28px;row-gap:12px;align-items:start}
  .demo-card>:is(.kicker,h2,.lead){grid-column:1/-1}
  .demo-card .demo{border-top:0;padding-top:0}
}
/* ---------- Home finish (13/11/2026): one rhythm, one title size, one fold control, buttons that answer, the width used on a computer ---------- */
/* Rhythm: 36 px between sections on a phone (72 px on a computer); a kicker sits close to its title */
#app[data-screen=home]{gap:36px}
#app[data-screen=home]>.mhero{margin-top:-14px}
#app[data-screen=home]>:is(.block,.essai,.demo-card,.pricecard,.finale){margin-top:0}
#app[data-screen=home] :is(.block,.demo-card)>.kicker+h2{margin-top:-6px}
#app[data-screen=home] .demo-card .kicker{margin-bottom:0}
#app[data-screen=home] .essai-head{gap:4px}
/* Titles: the same size for every section, cards included; balanced lines, no lonely last word */
#app[data-screen=home] :is(.block,.essai-head,.demo-card,.pricecard)>h2{font-size:1.65rem}
#app[data-screen=home] :is(h2,h3,.gcard strong,.phonevid strong){text-wrap:balance}
#app[data-screen=home] p{text-wrap:pretty}
/* Pictures: a soft parchment tone holds their place until they arrive (they load lazily) */
#app[data-screen=home] :is(.ex-photo img,.ha-img,.ha-phone img,.film-poster,.phone>img){background:#ebe0c8}
#app[data-screen=home] .ex-photo img{background:linear-gradient(135deg,#efe6d3,#e2d3b3)}
/* Every fold of the page: the same chevron (pointing right, down when open), the same weight, 48 px to tap */
#app[data-screen=home] :is(.transcript,.mc-more,.faq,.pmore) summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 0;cursor:pointer;font-weight:700;line-height:1.3;border-radius:6px}
#app[data-screen=home] :is(.transcript,.mc-more,.faq,.pmore) summary::-webkit-details-marker{display:none}
#app[data-screen=home] :is(.transcript,.mc-more,.faq,.pmore) summary::before{content:"";flex:none;width:8px;height:8px;margin:0 4px 0 2px;border-right:2.5px solid var(--rose-text);border-bottom:2.5px solid var(--rose-text);transform:rotate(-45deg)}
#app[data-screen=home] :is(.transcript,.mc-more,.faq details,.pmore)[open]>summary::before{transform:rotate(45deg)}
#app[data-screen=home] :is(.transcript,.mc-more,.faq) summary:hover{color:var(--rose-text)}
#app[data-screen=home] .pmore summary::before{border-color:var(--gold)}
#app[data-screen=home] .pmore summary:hover{color:var(--gold)}
#app[data-screen=home] .faq details{padding:0 16px}
#app[data-screen=home] .faq details[open]{padding-bottom:14px}
#app[data-screen=home] :is(.faq,.transcript) details>p,#app[data-screen=home] .transcript>p{margin-top:0;padding-left:26px;max-width:66ch}
#app[data-screen=home] .transcript>p+p{margin-top:6px}
#app[data-screen=home] .mc-more>dl{padding-left:26px}
@media (prefers-reduced-motion:no-preference){#app[data-screen=home] :is(.transcript,.mc-more,.faq,.pmore) summary::before{transition:transform .2s ease}}
/* Buttons. The main one is navy on the light page and gold on navy (the price block, the bottom bar): the
   same pill, the same words, the colour turned over so it stands out from its background. */
#app[data-screen=home] :is(.btn,.kctl button,.mchip,.gcard,.choice){transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s}
#app[data-screen=home] .btn.big:not(.gold):hover,#app[data-screen=home] .btn.gm-listen:not([aria-pressed="true"]):hover,#app[data-screen=home] .mchip.dark:hover{background:#2a3866}
#app[data-screen=home] .btn.gold:hover{background:#f1d68e}
#app[data-screen=home] .btn.ghost:hover{background:var(--card)}
#app[data-screen=home] .demo .btn.listen{border-radius:999px;min-height:48px;border-width:2px;font-family:var(--body);letter-spacing:0;font-weight:800}
#app[data-screen=home] .demo .btn.listen:hover{background:var(--rose-soft)}
#app[data-screen=home] .btn:active:not([disabled]),#app[data-screen=home] .kctl button:active{transform:translateY(1px) scale(.99)}
#app[data-screen=home] .pricecard :is(.btn,.kctl button):focus-visible{outline-color:var(--gold)}
#app[data-screen=home] .kctl button:hover{background:rgba(255,250,240,.12)}
#app[data-screen=home] :is(.linkbtn,.hero-link):hover{text-decoration-color:var(--rose-text)}
#app[data-screen=home] .mchip:not(.dark):hover{border-color:var(--or)}
#app[data-screen=home] .essai .choice:not([disabled]):not(.wrong):hover{border-color:var(--or)}
#app[data-screen=home] .gcard:hover{border-color:var(--or);box-shadow:0 6px 18px rgba(25,35,66,.12)}
@media (prefers-reduced-motion:no-preference){#app[data-screen=home] .gcard:hover{transform:translateY(-2px)}}
#app[data-screen=home] input::placeholder{color:#776b5f;opacity:1}
/* Cards: 20 px for the large blocks, 18 px for cards, 14 px for small tiles */
#app[data-screen=home] .demo-card{border-radius:20px}
/* The price: on a phone, "for the whole group" goes under the figure rather than leaving a word alone */
@media (max-width:599px){#app[data-screen=home] .pricecard .price span{display:block;margin-top:6px}}
/* The phone that calls the child: the name scales with the picture, so "chevalier," never breaks mid-word */
#app[data-screen=home] .phone{container-type:inline-size}
#app[data-screen=home] :is(.callname,.approche){font-size:clamp(.8rem,7.3cqw,1.3rem)}
@media (max-width:959px){#app[data-screen=home] .demo-card .phone{max-width:220px}}
/* The row of phones: each one snaps to the left edge, the next one peeks in from the right */
#app[data-screen=home] .phones{scroll-padding-inline:16px}
#app[data-screen=home] .phonevid{scroll-snap-align:start}
/* Tablets: a wider column, the three steps side by side */
@media (min-width:700px) and (max-width:959px){
  #app[data-screen=home]{max-width:760px;padding-inline:24px}
  #app[data-screen=home] .phones{margin-inline:-24px;padding-inline:24px;scroll-padding-inline:24px}
  #app[data-screen=home] .how3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  #app[data-screen=home] .how3 li{flex-direction:column;gap:10px}
}

  #app[data-screen=home]{gap:72px}
  #app[data-screen=home]>*{max-width:none}
  #app[data-screen=home]>.mbar{max-width:420px}
  #app[data-screen=home]>.mhero{margin-top:-48px}
  #app[data-screen=home] :is(.block,.essai-head,.demo-card,.pricecard)>h2{font-size:2.1rem}

  #app[data-screen=home] .how3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:4px}
  /* the five phones in one row, nothing to scroll; the film's poster matches the height of the others */
  #app[data-screen=home] .phones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto auto;gap:14px 22px;overflow:visible;margin:0;padding:8px 0 0}
  #app[data-screen=home] .phonevid{width:auto;display:grid;grid-row:span 2;grid-template-rows:subgrid;gap:14px}
  #app[data-screen=home] .phonevid video{width:100%;height:auto;aspect-ratio:220/476}
  #app[data-screen=home] .film-card{display:flex}
  #app[data-screen=home] .film-open{display:flex;height:100%}
  #app[data-screen=home] .film-poster{flex:1;height:auto;min-height:0;aspect-ratio:auto}
  #app[data-screen=home] .modegrid{gap:24px}
  #app[data-screen=home] .modecard{padding:20px 24px}
  /* the day: the figures and the button on the left, the questions on the right */
  #app[data-screen=home] .preparer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto auto 1fr;column-gap:56px;row-gap:16px;align-items:start}
  #app[data-screen=home] .preparer>*{grid-column:1}
  #app[data-screen=home] .preparer>.faq{grid-column:2;grid-row:1/span 4}
  #app[data-screen=home] .preparer>.btn.wide{max-width:440px}
  /* the price: what it costs on the left, what it includes and the button on the right */
  #app[data-screen=home] .pricecard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;row-gap:16px;align-items:start;padding:36px 40px}
  #app[data-screen=home] .pricecard>*{grid-column:1}
  #app[data-screen=home] .pricecard>h2{grid-row:1}
  #app[data-screen=home] .pricecard>.price{grid-row:2}
  #app[data-screen=home] .pricecard>.kstep{grid-row:3}
  #app[data-screen=home] .pricecard>.kres{grid-row:4}
  #app[data-screen=home] .pricecard>.incl{grid-column:2;grid-row:1/span 4;gap:12px;margin:0}
  #app[data-screen=home] .pricecard>.btn{grid-column:2;grid-row:5}
  #app[data-screen=home] .pricecard>.trust{grid-column:2;grid-row:6}
  #app[data-screen=home] .pricecard>.pmore{grid-row:5/span 2}
  #app[data-screen=home] .pricecard>.guarantee{grid-column:1/-1;grid-row:7}
  /* the voice: the phone on the left, the title and the name to try on the right */
  #app[data-screen=home] .demo-card{grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:48px;padding:28px 32px}
  #app[data-screen=home] .demo-card>:is(.kicker,h2,.lead,.demo){grid-column:2}

  #app[data-screen=home] #guides>h2{grid-column:1/-1}
  #app[data-screen=home] .gcard{padding:18px 20px}

/* The form on one screen (12/11/2026): the place of play first, a selected state with a check, errors under the fields */
.asst{display:flex;flex-direction:column;gap:8px}
.asst .micro{text-align:left}
.asst-cards{display:flex;flex-direction:column;gap:18px}
#app[data-screen=setup] .seg.opts button{min-height:84px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left;padding:12px}
#app[data-screen=setup] .seg.opts button span{font-weight:400;font-size:.85rem;line-height:1.3;opacity:.85}
#app[data-screen=setup] .seg.opts button[aria-pressed="true"] strong::before{content:"✓ "}
.kidsnote{font-size:.95rem;color:var(--muted)}
.modes{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modes legend{padding:0;margin-bottom:8px;font-weight:800;font-size:1.1rem}
#app[data-screen=setup] label.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:400}
label.mode input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
label.mode .mode-i{width:38px;height:38px}
.mode-t{display:flex;flex-direction:column;gap:3px}
.mode-t strong{font-size:1.1rem;font-weight:800;color:var(--ink)}
.mode-t span{font-size:.9rem;line-height:1.35;color:var(--muted)}
.mode-ck{display:none;position:absolute;top:10px;right:10px;font-size:.8rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--rose-text);color:#fff}
#app[data-screen=setup] label.mode.on{border:3px solid var(--rose-text);padding:13px 11px;background:var(--rose-soft)}
label.mode.on .mode-i{background:var(--rose-text);color:#fff}
label.mode.on .mode-ck{display:block}
label.mode:has(input:focus-visible){outline:3px solid var(--or);outline-offset:2px}
.part{display:flex;flex-direction:column;gap:12px}
.fhelp{font-weight:400;font-size:.95rem;color:var(--muted);line-height:1.4}
.ferr{margin-top:-4px;color:var(--rose-text);font-weight:700;font-size:.95rem;line-height:1.4}
.ferr::before{content:"⚠ "}
#app [aria-invalid="true"]{border-color:var(--rose-text)!important}
.setuphead h2{flex:1;min-width:0}
.setuphead .dr.mini{width:46px;flex:none;animation:none}
/* The preview (12/11/2026): the child's map first, then what is free and what the full quest opens */
.treasure{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:#f6e7bf;border:1px solid var(--gold)}
.twobox{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.freebox,.fullbox{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;line-height:1.5;background:var(--card)}
.freebox{border:1px solid var(--line)}
.freebox ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.fullbox{border:1px solid var(--line);border-left:4px solid var(--or)}
#app[data-screen=preview] :is(.freebox,.fullbox) h3{font-family:var(--body);font-weight:800;font-size:1.1rem;letter-spacing:0;color:var(--ink)}
/* Setup and preview */
.setuphead{display:flex;align-items:flex-end;gap:10px}
.setuphead>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.setuphead .dr{width:64px;flex:none}

<!-- The home screen is copied here at build time (dev/home.static.html, made by dev/snapshot.py) for robots that do not run JavaScript, such as the AI assistants' crawlers; render() replaces it. -->

</script>

</script>

<script>
(function(){
"use strict";
// Paid build: the server chooses the places and unlocks the quest after payment.
// Demo build (GitHub Pages): everything runs in the phone, the unlock button is free.
const PAID=/*PAID*/false;
// Demo build: reads the copy of the places of France kept by the paid site (public map data).
const PLACES_SITE="/*PLACES_SITE*/";
const E=(typeof QuestEngine!=="undefined")?QuestEngine:null;
const G=QuestGeo;
const STORE="quete-templiers-v3";
let PRICE="24,90 €";

const NOMINATIM="https://nominatim.openstreetmap.org";
// National address base (IGN Géoplateforme): exact street numbers everywhere in France, 50 requests/s.
const GEOPF="https://data.geopf.fr/geocodage";
// Voice and page kept on the phone after the unlock (Cache Storage, read by sw.js when there is no network).
const VOICE_CACHE="quete-voix-/*VOICE_VERSION*/";
const FONTS=["UnifrakturMaguntia-Book","AlegreyaSans-Regular","AlegreyaSans-Italic","AlegreyaSans-Medium","AlegreyaSans-Bold","AlegreyaSans-ExtraBold","AlegreyaSansSC-Medium","AlegreyaSansSC-Bold"].map(f=>`fonts/${f}.woff`);
// Browsers inside an app (Instagram, TikTok, Facebook…): their storage is often wiped, and the tab hard to find again.
const INAPP=/FBAN|FBAV|Instagram|TikTok|musical_ly|Bytedance|Snapchat|Pinterest|Line\//i.test(navigator.userAgent);

// Nathan's own phones and computers: opened once with ?moi=… (?moi=0 undoes it), the browser keeps it,
// and every count and order from it goes under the ref "moi", which the Sunday report leaves out.
const ME=(()=>{try{const v=new URLSearchParams(location.search).get("moi");
  if(v!=null){if(v==="0")localStorage.removeItem("mql-moi");else localStorage.setItem("mql-moi","1");}
  return localStorage.getItem("mql-moi")==="1";}catch(e){return false;}})();
// Anonymous count of a step of the visit (no cookie, no identifier): see /api/hit in worker.js.
// The free demo counts under the ref "demo", so the tests of friends and family stay apart.
function hit(e){try{const body=JSON.stringify({e,ref:ME?"moi":PAID?S.ref:"demo"});const url=PAID?"api/hit":PLACES_SITE&&PLACES_SITE+"/api/hit";
  if(url&&navigator.sendBeacon)navigator.sendBeacon(url,body);}catch(x){}}
if("serviceWorker" in navigator)try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}

/* ---------- State ---------- */
// preview: what is shown before paying; token: the sealed quest (paid build); quest: the full quest once unlocked;
// paid: the Stripe session that unlocked it (also the key of the reopen link).
const defaults={ref:"",mode:"ville",name:"",hero:"m",kids:8,compagnons:[],indoor:false,unlocked:false,screen:"home",start:null,town:"",commune:null,preview:null,token:"",quest:null,paid:"",step:0,phase:"travel",solved:[],hint:0,voice:"",tester:false,avis:false};
let S=Object.assign({},defaults);
try{const raw=localStorage.getItem(STORE);if(raw)S=Object.assign({},defaults,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}

function fill(t,extra){
  let s=String(t).replace(/\bde \{N\}/g,()=>S.name&&deMot(S.name)||"de {N}").replaceAll("{N}",S.name||"jeune chevalier").replaceAll("{V}",S.town||"la ville");
  if(extra&&extra.P!=null)s=s.replaceAll("{P}",extra.P);
  s=s.replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g,(m,a,b)=>S.hero==="f"?b:a);
  return s.replace(/(^|[.!?]\s+|«\s)([a-zàâäéèêëîïôöùûüç])/g,(m,a,b)=>a+b.toUpperCase());
}
const g=(m,f)=>S.hero==="f"?f:m;

/* ---------- Voice: old Grand Master ---------- */
let frVoices=[],frVoice=null;
const MALE=/thomas|henri|paul|r[ée]my|daniel|nicolas|jacques|gr[ée]goire|antoine|claude|denis|male|homme|frd|frb/i;
const FEMALE=/am[ée]lie|audrey|aur[ée]lie|marie|julie|c[ée]line|virginie|denise|hortense|female|femme|frc|fre/i;
function pickVoice(){try{
  frVoices=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));
  const chosen=S.voice&&frVoices.find(x=>x.name===S.voice);
  const fr=frVoices.filter(x=>/^fr(-|_)FR/i.test(x.lang));
  frVoice=chosen||fr.find(x=>MALE.test(x.name)&&!FEMALE.test(x.name))||frVoices.find(x=>MALE.test(x.name)&&!FEMALE.test(x.name))||fr[0]||frVoices[0]||null;
}catch(e){}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
let speakRun=0;
function speak(text){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel();const run=++speakRun;
    const parts=(text.match(/[^.!?…]+(?:[.!?…]+(?:\s*»)?)?\s*/g)||[text]).filter(p=>p.trim()&&p.trim()!=="»");
    let k=0;const next=()=>{if(run!==speakRun||k>=parts.length)return;
      const u=new SpeechSynthesisUtterance(parts[k++].trim());u.lang="fr-FR";if(frVoice)u.voice=frVoice;
      u.rate=.78;u.pitch=.55;u.volume=.9;u.onend=()=>{if(k>=parts.length)talk(false);setTimeout(next,450);};speechSynthesis.speak(u);};
    talk(true);next();return true;}catch(e){return false;}
}
/* Recorded voice (Gemini TTS, voice Algenib), served from the audio/ folder; phone voice only as a fallback. */
const V=QuestVoice;
let nameSet=null;
try{fetch("audio/noms.json").then(r=>r.ok?r.json():[]).then(a=>{nameSet=new Set(a);}).catch(()=>{nameSet=new Set();});}catch(e){nameSet=new Set();}
// "@name" = the child's name, or "Jeune chevalier," when unknown; "@name?" = the name only when it is recorded.
function clipUrl(k){
  if(k.startsWith("nom:"))return `audio/noms/${k.slice(4)}.mp3`;
  if(k==="@name"||k==="@name?"){const c=V.nameClip(S.name,nameSet);if(c)return `audio/noms/${c}.mp3`;return k==="@name"?`audio/voix/${V.key("vocatif",S.hero)}.mp3`:null;}
  return `audio/voix/${k}.mp3`;
}
let playRun=0,curAudio=null;
function playKeys(keys,fallbackText,onEnd){
  stopVoice();const run=++playRun;
  const clips=keys.map(clipUrl).filter(Boolean).map(u=>{const a=new Audio(u);a.preload="auto";return a;});
  let i=0;
  const fail=()=>{if(run!==playRun)return;playRun++;talk(false);if(onEnd)onEnd();if(!speak(fallbackText))note.textContent="La voix n'est pas disponible : lisez le message à voix haute.";};
  const next=()=>{
    if(run!==playRun)return;
    if(i>=clips.length){talk(false);if(onEnd)onEnd();return;}
    const a=clips[i++];curAudio=a;
    a.onended=()=>setTimeout(next,220);a.onerror=fail;
    const p=a.play();if(p&&p.catch)p.catch(fail);
  };
  talk(true);next();
}
function stopVoice(){try{speechSynthesis.cancel();speakRun++;}catch(e){}playRun++;try{if(curAudio){curAudio.pause();curAudio=null;}}catch(e){}talk(false);}

/* ---------- Background music: a quiet knightly loop on the first screens ----------
   It starts by itself (Nathan, 12/11/2026, again after a day of « only with the switch »): browsers only let
   sound start after a touch, so it is tried at the first touch, tap, click, key, wheel or scroll, then loops
   (Web Audio, without a gap). The « Musique » switch (in the home page's header, at the top right of the other
   first screens) turns it off; that choice is kept. It goes very quiet while the Grand Master speaks, and
   stops once the quest itself begins. */
// Low on purpose (15/10/2026, Nathan): it also plays when the phone is on silent, which no website can detect.
const MUSIC_URL="audio/musique/accueil.mp3",MUSIC_VOL=.1,MUSIC_UNDER=.02;
const MUSIC_SCREENS=["home","setup","loading","preview","few","neterr"];
let mCtx=null,mGain=null,mSrc=null,mBuf=null,mLoading=false,talking=false;
const musicWanted=()=>{try{return localStorage.getItem("musique")!=="non";}catch(e){return true;}};
const musicHere=()=>MUSIC_SCREENS.includes(render.cur||S.screen)&&!document.hidden;
function talk(on){talking=on;musicLevel();}
function musicLevel(){
  if(!mGain)return;
  const v=musicWanted()&&musicHere()&&mSrc?(talking?MUSIC_UNDER:MUSIC_VOL):0;
  try{mGain.gain.cancelScheduledValues(mCtx.currentTime);mGain.gain.setTargetAtTime(v,mCtx.currentTime,v?.6:.25);}catch(e){}
}
// The MP3 encoder adds a few milliseconds of silence at both ends: cut it, so the loop has no hole.
function trimEdges(b){
  const d=b.getChannelData(0),n=d.length;let a=0,z=n-1;
  while(a<n&&Math.abs(d[a])<1e-4)a++;while(z>a&&Math.abs(d[z])<1e-4)z--;
  if(a===0&&z===n-1)return b;
  const out=mCtx.createBuffer(b.numberOfChannels,z-a+1,b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++)out.copyToChannel(b.getChannelData(c).subarray(a,z+1),c);
  return out;
}
// auto: the try at page opening. Most phones refuse sound before a first touch; then nothing is
// downloaded and the music starts at the end of the first touch.
async function musicOn(auto){
  if(!musicWanted()||!musicHere())return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  // iPhone: play like the Grand Master's voice, even with the silent switch on
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  if(!mCtx){mCtx=new AC();mGain=mCtx.createGain();mGain.gain.value=0;mGain.connect(mCtx.destination);
    mCtx.onstatechange=()=>{musicLevel();musicSwitch();};}
  // Phones only let sound start inside the touch itself: resume right away, every time it is needed.
  let resumed=Promise.resolve();
  if(mCtx.state!=="running"){try{const r=mCtx.resume();if(r&&r.then)resumed=r.catch(()=>{});}catch(e){}}
  if(auto){await Promise.race([resumed,new Promise(r=>setTimeout(r,600))]);if(mCtx.state!=="running")return;}
  if(mSrc||mLoading){musicLevel();return;}
  mLoading=true;musicSwitch();
  try{
    if(!mBuf){const r=await fetch(MUSIC_URL);if(!r.ok)throw new Error("musique");const raw=await r.arrayBuffer();
      mBuf=trimEdges(await new Promise((ok,ko)=>mCtx.decodeAudioData(raw,ok,ko)));}
    if(!mSrc&&musicWanted()&&musicHere()){mSrc=mCtx.createBufferSource();mSrc.buffer=mBuf;mSrc.loop=true;mSrc.connect(mGain);mSrc.start(0);}
  }catch(e){}
  mLoading=false;musicLevel();musicSwitch();
}
const musicPlaying=()=>!!(mSrc&&mCtx&&mCtx.state==="running");
function musicOff(){
  if(!mSrc)return;const s=mSrc;mSrc=null;musicLevel();
  setTimeout(()=>{try{s.stop();}catch(e){}},1500);
}
// Called after every screen: start, keep or stop the music.
function musicScreen(){if(musicHere()&&musicWanted()){if(mCtx&&mCtx.state==="running")musicOn();}else musicOff();musicSwitch();}
function musicSwitch(){
  let b=document.getElementById("music");
  if(!MUSIC_SCREENS.includes(render.cur||S.screen)){if(b)b.remove();return;}
  if(!b){b=h("button",{class:"music",id:"music",type:"button",onclick:()=>{
      const on=!(musicPlaying()||mLoading);try{localStorage.setItem("musique",on?"oui":"non");}catch(x){}
      if(on)musicOn();else musicOff();musicSwitch();}});}
  // in the home page's header when it has a place for it, else at the top right of the screen
  const slot=document.getElementById("music-slot");
  if(slot){if(b.parentNode!==slot)slot.append(b);b.classList.add("inhead");}
  else{if(b.parentNode!==document.body)document.body.append(b);b.classList.remove("inhead");}
  const on=musicPlaying()||mLoading;
  b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"Couper la musique d'ambiance":"Mettre la musique d'ambiance");b.title=b.getAttribute("aria-label");
  b.innerHTML=(on?'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>'
    :'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z" opacity=".55"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>')
    +'<span class="mu-t" aria-hidden="true">Musique</span>';
}
// Try at once when the page opens (a computer that already knows the site may allow it)…
window.addEventListener("load",()=>setTimeout(()=>musicOn(true),300));
// …else at the first gesture: phones allow sound at the end of a touch or a tap; a scroll or a wheel
// also tries (some browsers accept it, the others wait for the next touch).
for(const ev of ["touchstart","touchend","pointerdown","pointerup","click","keydown","wheel","scroll"])
  document.addEventListener(ev,e=>{if(!(e.target&&e.target.closest&&e.target.closest("#music")))musicOn();},{passive:true,capture:true});
document.addEventListener("visibilitychange",()=>{if(!mCtx)return;if(document.hidden){try{mCtx.suspend();}catch(e){}}else if(musicHere()&&musicWanted()){try{mCtx.resume();}catch(e){}musicLevel();}});

/* ---------- DOM helpers ---------- */

/* ---------- Network ---------- */
async function getJSON(url,opts,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);
  try{const r=await fetch(url,Object.assign({signal:c.signal},opts||{}));if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}finally{clearTimeout(t);}}
function townOf(a){a=a||{};return a.village||a.town||a.city||a.municipality||a.hamlet||"";}
// Address search, asked to both services at once: the national address base knows every street
// number, OpenStreetMap knows parks and monuments. Sure addresses first, then OpenStreetMap, then the rest.
// One search per tap on "Chercher" (no search-as-you-type: Nominatim's usage policy).
// near: the chosen commune, if any: results around it come first.
async function searchPlaces(q,near){
  const e=encodeURIComponent(q);
  const bias=near&&isFinite(near.lat)?`&lat=${r2(near.lat)}&lon=${r2(near.lon)}`:"";
  const box=near&&isFinite(near.lat)?`&viewbox=${r2(near.lon-0.08)},${r2(near.lat+0.05)},${r2(near.lon+0.08)},${r2(near.lat-0.05)}`:"";
  const [ban,osm]=await Promise.allSettled([
    getJSON(`${GEOPF}/search?q=${e}&limit=5${bias}`,null,8000),
    getJSON(`${NOMINATIM}/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=fr&accept-language=fr&q=${e}${box}`,null,10000)]);
  if(ban.status==="rejected"&&osm.status==="rejected")throw ban.reason;
  const sure=[],rest=[],out=[];
  if(ban.status==="fulfilled")for(const f of (ban.value&&ban.value.features)||[]){
    const p=f.properties||{},c=f.geometry&&f.geometry.coordinates;if(!c||!p.label)continue;
    (p.score>=0.7?sure:rest).push({label:p.label,lat:+c[1],lon:+c[0],town:p.city||""});}
  const fromOsm=osm.status==="fulfilled"&&Array.isArray(osm.value)?osm.value.map(x=>({label:x.display_name,lat:+x.lat,lon:+x.lon,town:townOf(x.address)||x.name||""})):[];
  for(const r of [...sure,...fromOsm,...rest])if(isFinite(r.lat)&&isFinite(r.lon)&&!out.some(o=>G.dist(o,r)<60))out.push(r);
  return out.slice(0,6);
}
async function reverseTown(lat,lon){
  try{const r=await getJSON(`${GEOPF}/reverse?lon=${lon}&lat=${lat}&limit=1`,null,6000);const p=r&&r.features&&r.features[0]&&r.features[0].properties;if(p&&p.city)return p.city;}catch(e){}
  try{const r=await getJSON(`${NOMINATIM}/reverse?format=jsonv2&zoom=14&accept-language=fr&lat=${lat}&lon=${lon}`,null,10000);return townOf(r.address);}catch(e){return "";}
}
/* ---------- Communes: the town of the party, suggested around the visitor ---------- */
// Search: Base Adresse Nationale (IGN Géoplateforme, the former api-adresse.data.gouv.fr), type=municipality.
// Nearby: API Géo, every commune of the visitor's département (and of a neighbour less than 15 km away),
// sorted by distance to its town hall, where the quest then starts. Both under Licence Ouverte 2.0. Without them, the field stays a plain text field.
const GEO_API="https://geo.api.gouv.fr";
const OBERNAI={lat:48.4620,lon:7.4824};
const NEAR_KM=15;
// pos: where suggestions are centred; located: the visitor's own position. Not located: the typed
// suggestions are still ranked from Obernai (no distance shown), and no commune is listed around.
const CM={pos:OBERNAI,located:false,lists:new Map(),deps:new Map(),search:new Map(),ban:new Map(),around:new Map()};
function km(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*6371.0088*Math.asin(Math.min(1,Math.sqrt(x)));}
const fold=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[-'’]/g," ").replace(/\s+/g," ").trim();
const kmText=d=>d<0.95?"< 1 km":(d<10?d.toFixed(1).replace(".",","):String(Math.round(d)))+" km";
// Positions sent to the public services are rounded to about a kilometre.
const r2=x=>Math.round(x*100)/100;
// The point d km from p, heading deg degrees from north.
function offset(p,d,deg){const r=Math.PI/180,R=6371.0088,b=deg*r,la=p.lat*r,lo=p.lon*r,a=d/R;
  const la2=Math.asin(Math.sin(la)*Math.cos(a)+Math.cos(la)*Math.sin(a)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(a)*Math.cos(la),Math.cos(a)-Math.sin(la)*Math.sin(la2));return {lat:la2/r,lon:lo2/r};}
function cacheGet(k){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function cachePut(k,v){try{sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}}
// Département of a point ("" at sea or abroad).
function depAt(p){const k=r2(p.lat)+","+r2(p.lon);
  if(!CM.deps.has(k))CM.deps.set(k,getJSON(`${GEO_API}/communes?lat=${r2(p.lat)}&lon=${r2(p.lon)}&fields=codeDepartement`,null,6000)
    .then(r=>(Array.isArray(r)&&r[0]&&r[0].codeDepartement)||"").catch(e=>{CM.deps.delete(k);throw e;}));
  return CM.deps.get(k);}
// Every commune of a département: {nom, code, cp, lat, lon, m, f (folded name)}. The position is the
// town hall's (m: true), else the middle of the commune's area, sometimes out in the fields.
function depCommunes(dep){
  if(!CM.lists.has(dep))CM.lists.set(dep,(async()=>{
    let L=cacheGet("mql-communes-"+dep);
    if(!L){const r=await getJSON(`${GEO_API}/departements/${dep}/communes?fields=nom,code,codesPostaux,centre,mairie`,null,10000);
      L=(Array.isArray(r)?r:[]).map(c=>{const pt=(c.mairie&&c.mairie.coordinates)||(c.centre&&c.centre.coordinates);
        return pt&&{nom:c.nom,code:c.code,cp:(c.codesPostaux||[])[0]||"",lon:pt[0],lat:pt[1],m:!!(c.mairie&&c.mairie.coordinates)};}).filter(Boolean);
      cachePut("mql-communes-"+dep,L);}
    return L.map(c=>Object.assign({},c,{f:fold(c.nom)}));
  })().catch(e=>{CM.lists.delete(dep);throw e;}));
  return CM.lists.get(dep);}
// The communes around p, nearest first, each with its distance d in km. The visitor's département,
// plus any département reached by one of 12 points 15 km around (a boundary less than 15 km away).
function communesAround(p){const k=r2(p.lat)+","+r2(p.lon);
  if(!CM.around.has(k))CM.around.set(k,(async()=>{
    const own=await depAt(p);if(!own)return [];
    const ring=await Promise.allSettled(Array.from({length:12},(x,i)=>depAt(offset(p,NEAR_KM,i*30))));
    const deps=new Set([own]);for(const r of ring)if(r.status==="fulfilled"&&r.value)deps.add(r.value);
    const lists=await Promise.allSettled([...deps].map(depCommunes));
    const all=[];for(const r of lists)if(r.status==="fulfilled")all.push(...r.value);
    return all.map(c=>Object.assign({},c,{d:km(p,c)})).sort((a,b)=>a.d-b.d);
  })().catch(e=>{CM.around.delete(k);throw e;}));
  return CM.around.get(k);}
// Communes whose name starts with the text (or one of its words does), from the national search
// (3 letters or more: it refuses fewer) and the communes around; the nearest first. Up to 6.
async function suggestCommunes(text){
  const f=fold(text);if(f.length<2)return [];
  const p=CM.pos,local=[];
  try{for(const c of await communesAround(p))if(c.f.startsWith(f)||c.f.includes(" "+f))local.push(Object.assign({src:"geo"},c));}catch(e){}
  let ban=[];
  if(f.length>=3){const k=f+"|"+r2(p.lat)+","+r2(p.lon);
    if(!CM.search.has(k))CM.search.set(k,getJSON(`${GEOPF}/search?q=${encodeURIComponent(text.trim())}&type=municipality&limit=6&lat=${r2(p.lat)}&lon=${r2(p.lon)}`,null,6000)
      .then(r=>((r&&r.features)||[]).map(x=>{const q=x.properties||{},c=x.geometry&&x.geometry.coordinates;
        return c&&{src:"ban",nom:q.city||q.name,code:q.citycode||"",cp:q.postcode||"",lon:+c[0],lat:+c[1]};}).filter(Boolean))
      .catch(e=>{CM.search.delete(k);return [];}));
    ban=(await CM.search.get(k)).map(c=>Object.assign(c,{f:fold(c.nom),d:km(p,c)}));}
  const out=[];
  // a commune known both ways keeps API Géo's entry: its position is the town hall
  for(const c of [...local,...ban])if(!out.some(o=>(o.code&&o.code===c.code)||(o.f===c.f&&o.cp===c.cp)))out.push(c);
  // the exact name first when it is clearly the one meant ("Metz" before "Metzeral"), not a far "Sai" before "Saint-…"
  const first=c=>c.f===f&&(f.length>=4||c.d<=30);
  return out.sort((a,b)=>first(b)-first(a)||a.d-b.d).slice(0,6);
}
// The town hall of a commune found by the national search (its own point can be a kilometre away).
function mairiePoint(c){const k=c.code||c.f;
  if(!CM.ban.has(k))CM.ban.set(k,(c.code?getJSON(`${GEO_API}/communes/${c.code}?fields=mairie,centre`,null,5000):Promise.reject())
    .then(r=>{const pt=r&&((r.mairie&&r.mairie.coordinates)||(r.centre&&r.centre.coordinates));return pt?{lat:+pt[1],lon:+pt[0]}:null;}).catch(()=>null));
  return CM.ban.get(k);}
const communeLabel=c=>c?`${c.nom}${c.cp?` (${c.cp})`:""}`:"";
// The visitor's position, asked on a tap only; Obernai when refused, unavailable or too slow.
function locateCommune(){return new Promise(res=>{
  if(!("geolocation" in navigator))return res(false);
  try{navigator.geolocation.getCurrentPosition(p=>{CM.pos={lat:p.coords.latitude,lon:p.coords.longitude};CM.located=true;res(true);},
    ()=>{CM.pos=OBERNAI;CM.located=false;res(false);},{enableHighAccuracy:false,timeout:10000,maximumAge:600000});}catch(e){res(false);}
});}

// Places around the start, from the public OpenStreetMap servers (n = how many to try).
async function fetchPlaces(lat,lon,n){
  const body="data="+encodeURIComponent(G.overpassQuery(lat,lon));let last=null;
  for(const url of G.SERVERS.slice(0,n)){
    try{const r=await getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body},20000);
      // a busy server answers 200 with no places and a "runtime error" remark: try the next one
      if(Array.isArray(r.elements)&&!(r.remark&&!r.elements.length))return r.elements;
      last=new Error(r.remark||"no elements");}
    catch(e){last=e;}
  }
  throw last||new Error("overpass");
}
// Our own server: answers JSON even for refusals (unpaid, bad request), throws only when unreachable.
async function api(path,body,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||25000);
  try{const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),signal:c.signal});
    const j=await r.json().catch(()=>null);if(!j)throw new Error("HTTP "+r.status);return j;}finally{clearTimeout(t);}}
function previewOf(q){return {ok:true,indoorOnly:!!q.indoorOnly,count:q.steps.length,walkM:q.walkM,minutes:q.minutes,teasers:q.steps.map(s=>s.teaser)};}
// Free preview of a quest. body: {start, elements} or {indoor:true}.

    return q.ok?{ok:true,preview:previewOf(q),quest:q,token:""}:q;}

}

// Demo build only: the same tiles as the server, chosen in the phone.
async function demoFromTiles(lat,lon){

  const idx=await fetch(PLACES_SITE+"/places/index.json");if(!idx.ok)return {ok:false,reason:"nodata"};
  const r=900,dLat=r/111320,dLon=r/(111320*Math.cos(lat*Math.PI/180)),keys=new Set(),places=[];
  for(const a of [lat-dLat,lat+dLat])for(const b of [lon-dLon,lon+dLon])keys.add(`${Math.floor(a/0.1)}_${Math.floor(b/0.1)}`);

function questClips(){

  for(const indoor of [false,true])keys.push(...V.message("prologue",{g:g0,indoor}),...V.message("intro",{g:g0,indoor}));
  q.steps.forEach((st,i)=>keys.push(...V.message("indice",{g:g0,cat:st.cat,v:st.v||0}),...V.message("recit",{g:g0,cat:st.cat,v:st.v||0}),
    ...(st.hideId?[...V.message("indice",{g:g0,indoor:true,cache:st.hideId}),...V.message("recit",{g:g0,indoor:true,cache:st.hideId,cat:st.cat,v:st.v||0})]:[]),
    ...V.message("lettre",{g:g0,letter:st.letter,last:i===q.steps.length-1,word:q.word})));

let offline={state:"",done:0,total:0,key:""};
function showOffline(){
  const el=document.getElementById("offline-status");if(!el)return;
  el.textContent=offline.state==="busy"?`Enregistrement de la voix du Grand Maître sur ce téléphone… ${offline.done} sur ${offline.total}`
    :offline.state==="ok"?"La voix du Grand Maître est enregistrée sur ce téléphone : la quête se joue même sans réseau."
    :offline.state?"Une partie de la voix n'a pas pu être enregistrée. Gardez du réseau pendant la quête, ou rouvrez ce guide avec une connexion.":"";
}
async function keepOffline(){
  if(!("caches" in window)||!S.quest)return;
  const key=(S.paid||"demo")+S.hero+S.name;
  if(offline.key===key&&(offline.state==="busy"||offline.state==="ok"))return;
  const urls=[...new Set([new URL("./",location.href).href,...[...FONTS,"audio/noms.json",...questClips()].map(u=>new URL(u,location.href).href)])];
  offline={state:"busy",done:0,total:urls.length,key};showOffline();
  let failed=0;
  try{
    const c=await caches.open(VOICE_CACHE);
    const one=async u=>{try{if(!(await c.match(u))){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(r.status);await c.put(u,r);}}catch(e){failed++;}offline.done++;showOffline();};
    const queue=[...urls];await Promise.all([0,1,2].map(async()=>{while(queue.length)await one(queue.shift());}));
  }catch(e){failed++;}
  if(offline.key!==key)return;
  offline.state=failed?"partial":"ok";showOffline();
  if(!failed)hit("horsligne");
}
function offlineCard(){
  if(!("caches" in window))return null;
  setTimeout(showOffline,0);
  return h("div",{class:"card adult"},h("h3",{text:"Sans réseau ?"}),
    h("p",{class:"note",id:"offline-status",role:"status"}),
    h("p",{class:"note",text:"Le jour de la fête, ouvrez la quête une fois avec du réseau avant de partir : tout sera prêt."}));
}

/* ---------- Parchments: the invitation and the diploma as images (WhatsApp, photos) ---------- */
const sealD=()=>SEAL.match(/ d="([^"]+)"/)[1];  // the wax of the seal drawn on the home page
const CROSS_D="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z";
const FACE={display:s=>`${s}px UnifrakturMaguntia, Georgia, serif`,label:s=>`500 ${s}px "Alegreya Sans SC", sans-serif`,
  body:s=>`${s}px "Alegreya Sans", sans-serif`,italic:s=>`italic ${s}px "Alegreya Sans", sans-serif`,bold:s=>`700 ${s}px "Alegreya Sans", sans-serif`};
// lines: [{t, f: display|label|body|italic|bold, s: size, c: colour, gap: space before}]
async function parchment(lines,opts){
  try{await Promise.all(Object.values(FACE).map(f=>document.fonts.load(f(40),"Aé")));}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const paper=x.createRadialGradient(W/2,H/2,150,W/2,H/2,900);paper.addColorStop(0,"#fbf6e9");paper.addColorStop(1,"#eadbb8");
  x.fillStyle=paper;x.fillRect(0,0,W,H);

// French typography on the home: a no-break space before ? ! : ; » and after «, so a sign never starts a line.
function frSpaces(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode();n;n=w.nextNode()){const t=n.nodeValue;
    if(/ [?!:;»]|« /.test(t))n.nodeValue=t.replace(/ ([?!:;»])/g,"\u00a0$1").replace(/« /g,"«\u00a0");}
}

      const r=h("input",{type:"radio",name:"mode",value:v,id:"mode-"+v});r.checked=(S.mode==="maison"?"maison":"ville")===v;

      return h("label",{class:"mode",for:"mode-"+v},r,ico(i,22,"ico mode-i"),h("span",{class:"mode-ck","aria-hidden":"true",text:"✓ Choisi"}),h("span",{class:"mode-t"},h("strong",{text:t}),h("span",{text:s})));}));

    h("div",{class:"asst"},

// The phone's position: a quick approximate fix first (Wi-Fi, mobile network: enough for a 700 m quest),
// then precise GPS only if that fails. Indoors, waiting for GPS alone often runs out of time.
function locate(){
  const once=o=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),rej,o));
  return once({enableHighAccuracy:false,timeout:8000,maximumAge:300000})
    .catch(e=>{if(e&&e.code===1)throw e;return once({enableHighAccuracy:true,timeout:15000,maximumAge:0});});
}
// town: known (address search) or null (position: looked up while the quest is prepared, 5 s at most).
async function startFrom(lat,lon,town){
  if(needName())return;
  const townP=town!=null?Promise.resolve(town):Promise.race([reverseTown(lat,lon),new Promise(r=>setTimeout(()=>r(""),5000))]);
  go({screen:"loading",start:{lat,lon},town:town||""});
  try{
    // Paid build: our server keeps a copy of the places of France and chooses the stops from it.
    // Without that copy: the phone asks OpenStreetMap, and if it is busy our server tries the mirrors.
    let p=PAID?await makePreview({start:{lat,lon}}):await demoFromTiles(lat,lon).catch(()=>({ok:false,reason:"nodata"}));
    if(!p.ok&&p.reason==="nodata"){
      let els=null;
      try{els=G.slim(await fetchPlaces(lat,lon,PAID?1:3));}catch(e){if(!PAID)throw e;}
      p=await makePreview(els?{start:{lat,lon},elements:els}:{start:{lat,lon},fetch:true});
    }
    if(!PAID)hit(p.ok?"preview":"few");
    const t=await townP;
    if(!p.ok){if(p.reason==="few"){go({screen:"few",found:p.found,town:t});return;}throw new Error(p.reason);}
    go(Object.assign({},fresh,{preview:p.preview,quest:p.quest,token:p.token,screen:"preview",indoor:false,town:t}));
  }catch(e){hit("neterr");go({screen:"neterr"});}
}

  const osm=`https://www.openstreetmap.org/?mlat=${st.lat}&mlon=${st.lon}#map=18/${st.lat}/${st.lon}`;

function checkArrival(st,out){
  if(st.lat==null||!("geolocation" in navigator)){out.textContent="Position indisponible : validez avec « Nous y sommes ».";return;}
  out.textContent="Recherche de votre position…";
  navigator.geolocation.getCurrentPosition(p=>{
    const d=G.dist({lat:p.coords.latitude,lon:p.coords.longitude},st);
    if(d<=50){go({phase:"arrived",hint:0});}
    else out.textContent=`Encore environ ${Math.round(d/10)*10} m. Vous pouvez aussi valider avec « Nous y sommes ».`;
  },()=>{out.textContent="Position refusée ou indisponible : validez avec « Nous y sommes ».";},{enableHighAccuracy:true,timeout:9000,maximumAge:10000});
}

      voiceCard(last
        ?`Voici la dernière lettre : ${st.letter}. Choisissez son gardien. Tu as maintenant toutes les lettres, {N}, mais elles sont dans le désordre… Retrouve le mot secret. Un indice : ${q.hint}${/…$/.test(q.hint)?"":"."}`
        :`Bien joué, {N}. Voici la lettre ${st.letter}. Choisissez un gardien de la lettre, un chevalier qui ne l'a pas encore été. Il devra s'en souvenir jusqu'à la fin de la quête.`,
        null,null,V.message("lettre",{g:S.hero,letter:st.letter,last,word:q.word})),note,
      h("button",{class:"btn",type:"button",onclick:()=>last?go({screen:"final"}):go({step:i+1,phase:S.indoor&&!q.steps[i+1].hideId?"arrived":"travel",hint:0})},last?"Trouver le mot secret":"Étape suivante")];
  }
  return [];
}
function solve(i){const solved=S.solved.includes(i)?S.solved:[...S.solved,i];go({solved,lastSolved:i,phase:"letter"});}

function finalScreen(){
  const q=S.quest;const letters=S.solved.map(k=>q.steps[k].letter).join(" ");
  const inp=h("input",{type:"text",id:"secret",autocomplete:"off",placeholder:"Le mot secret"});const fb=h("p",{role:"status",class:"hint"});
  const check=()=>{const v=inp.value.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim();
    if(v===q.word){hit("diploma");go({screen:"diploma"});}else fb.textContent=`Ce n'est pas encore ça. Il commence par ${q.word[0]}.`;};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  return [shieldRow(),h("div",null,h("p",{class:"eyebrow",text:"le sceau du temple"}),h("h2",{text:"Le mot secret"})),
    h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),
      h("p",{text:S.indoor&&q.steps[0].hideId?"Appelez les gardiens des lettres : chacun pose sa carte sur la table, face visible. Les chevaliers déplacent les cartes jusqu'à former le mot secret. Puis tapez le mot ci-dessous.":"Appelez les gardiens des lettres et alignez-les face à vous. Chacun crie sa lettre. Les chevaliers changent de place jusqu'à former le mot secret. Puis tapez le mot ci-dessous."})),
    h("div",{class:"card",style:"text-align:center"},h("p",{text:"Si un gardien a oublié sa lettre, les voici, dans le désordre :"}),h("div",{class:"letter",text:letters})),
    h("div",{class:"card"},h("label",{for:"secret"},"L'adulte tape le mot trouvé par les enfants",inp),h("button",{class:"btn",type:"button",onclick:check},"Ouvrir le Sceau"),fb)];
}
function diplomaScreen(){
  const q=S.quest;
  const end=`{N}, tu as retrouvé le mot secret : ${q.say}. ${q.meaning} Le Sceau du Temple est ouvert ! Grand Maître, remets le trésor aux chevaliers. Et toi, {N}, je te nomme [[Chevalier|Chevalière]] de l'Ordre des Gardiens du Temple. Joyeux anniversaire !`;
  const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  return [h("div",null,h("p",{class:"eyebrow",text:"quête accomplie"}),h("h2",{text:"Le trésor est à vous !"})),
    voiceCard(end,"Le dernier message du Grand Maître",null,V.message("fin",{g:S.hero,word:q.word})),note,
    h("div",{class:"card adult"},h("h3",{text:"Pour l'adulte"}),h("p",{text:"C'est le moment de sortir le trésor de votre sac et de le remettre aux chevaliers."})),
    h("div",{class:"card diploma"},h("p",{class:"eyebrow",text:"ordre des gardiens du temple"}),h("p",{text:"Par ce diplôme, le Grand Maître nomme"}),
      h("div",{class:"name",text:S.name||"Jeune chevalier"}),h("p",null,h("b",{text:g("Chevalier","Chevalière")+" de l'Ordre des Gardiens du Temple"})),
      h("p",{class:"note",text:`pour avoir ouvert le Sceau du Temple${S.town&&!q.indoorOnly?" à "+S.town:""}, le ${today}, avec ${S.kids} compagnons d'armes.`}),
      // A discreet signature: diploma photos shared by parents carry the name of the quest.
      (()=>{const s=h("div",{class:"gm"},h("span",{text:"Le Grand Maître"}));s.insertAdjacentHTML("afterbegin",sigSvg("","currentColor"));return s;})(),
      h("p",{class:"sign",text:"Ma Quête Légendaire"})),
    avisCard(),
    printCard(false),
    h("div",{class:"card adult"},h("h3",{text:"Le diplôme en image"}),
      h("p",{class:"note",text:"À garder dans le téléphone ou à envoyer à la famille."}),
      ...imageMaker("Créer le diplôme en image","diplome-chevalier.png",()=>[
        {t:"ordre des gardiens du temple",f:"label",s:38,c:"#a87a1f"},{t:"Par ce diplôme, le Grand Maître nomme",f:"body",s:46,gap:30},
        {t:S.name||g("Jeune chevalier","Jeune chevalière"),f:"display",s:128,c:"#b8505c",gap:20},
        {t:g("Chevalier","Chevalière")+" de l'Ordre\ndes Gardiens du Temple",f:"bold",s:50,gap:16},
        {t:`pour avoir ouvert le Sceau du Temple${S.town&&!q.indoorOnly?" à "+S.town:""}, le ${today}, avec ${S.kids} compagnons d'armes.`,f:"italic",s:42,c:"#5b6482",gap:36}],"diplome",{qr:true,sign:true})),
    shareCard(),
    h("button",{class:"btn ghost",type:"button",onclick:()=>go(Object.assign({},defaults,{name:S.name,hero:S.hero,kids:S.kids,voice:S.voice,town:S.town,screen:"setup"}))},"Créer une nouvelle quête")];
}

// After the party: the parents of the guests are the next customers. Shares the home page, not the paid quest.
function shareCard(){
  const url=location.origin+location.pathname+"?ref=fete";
  const out=h("p",{class:"note",role:"status"});
  const share=async()=>{
    const text="Nous avons fêté un anniversaire avec Ma Quête Légendaire : une chasse au trésor de chevaliers dans notre ville, au prénom de l'enfant.";
    try{if(navigator.share){await navigator.share({title:"Ma Quête Légendaire",text,url});hit("share");return;}}catch(e){if(e&&e.name==="AbortError")return;}
    try{await navigator.clipboard.writeText(url);out.textContent="Lien copié.";hit("share");}catch(e){out.textContent=url;}
  };
  return h("div",{class:"card adult"},h("h3",{text:"Les compagnons ont aimé ?"}),
    h("p",{class:"note",text:"Envoyez la présentation de la quête à leurs parents, pour un prochain anniversaire."}),
    h("button",{class:"btn ghost",type:"button",onclick:share},"Partager la quête"),out);
}
function topbar(){
  if(["home","setup","loading","few","neterr","preview","unlocking","unlockerr"].includes(S.screen))return null;
  return h("div",{class:"topbar"},h("span",{class:"eyebrow",text:"ma quête légendaire"}),
    h("button",{class:"linkish",type:"button",onclick:()=>go({screen:"preview"})},"Aperçu"));
}
const OPEN=["home","setup","loading","few","neterr","unlocking","unlockerr"];
function render(){
  note.textContent="";stopVoice();app.replaceChildren();if(homeIO){homeIO.disconnect();homeIO=null;}if(stepIO){stepIO.disconnect();stepIO=null;}if(vidIO){vidIO.disconnect();vidIO=null;}
  let screen=S.screen;
  if(!S.preview&&!OPEN.includes(screen))screen="home";
  else if(!(S.unlocked&&S.quest)&&!OPEN.includes(screen)&&screen!=="preview")screen="preview";
  render.cur=screen;app.dataset.screen=screen;
  const map={home:homeScreen,setup:setupScreen,loading:loadingScreen,few:fewScreen,neterr:netErrScreen,preview:previewScreen,unlocking:unlockingScreen,unlockerr:unlockErrScreen,
    guide:guideScreen,intro:introScreen,step:stepScreen,final:finalScreen,diploma:diplomaScreen};
  if(!render.seen){render.seen=true;if(screen==="home")hit("home");}
  if(S.unlocked&&S.quest)keepOffline();
  const tb=topbar();if(tb)app.append(tb);
  (map[screen]||homeScreen)().forEach(n=>{if(n)app.append(n);});
  musicScreen();
}

/* ---------- Back from Stripe, or a reopen link ---------- */
async function unlockWith(sid,first){
  const was=S.screen;
  go({screen:"unlocking",pending:sid,pendingFirst:!!first});
  let r;
  try{r=await api("api/unlock",first?{session:sid,first:true}:{session:sid});}catch(e){go({screen:"unlockerr",unlockErr:"net"});return;}
  if(!r.ok){go({screen:"unlockerr",unlockErr:r.reason==="unpaid"?"unpaid":r.reason==="bad"||r.reason==="unknown"?"bad":"net"});return;}
  const same=S.paid===sid&&S.quest;  // same quest on the same phone: keep the progress
  go(Object.assign(same?{}:Object.assign({},fresh,{screen:"guide"}),{
    quest:r.quest,preview:previewOf(r.quest),token:"",unlocked:true,paid:sid,pending:"",pendingFirst:false,
    name:r.name||S.name,hero:r.hero,kids:r.kids||S.kids,town:r.town,start:r.quest.start,indoor:same?S.indoor:!!r.quest.indoorOnly},
    same?{screen:OPEN.includes(was)||was==="preview"?"guide":was}:{}));
}

// A preview received from someone else (?apercu=token&n=…): the same quest, ready to pay.
async function openShared(token,p){
  if(S.unlocked&&S.quest&&S.screen!=="diploma"){render();note.textContent="Une quête est déjà ouverte sur ce téléphone : l'aperçu reçu n'a pas été ouvert.";return;}
  go({screen:"loading",start:null});
  let r=null;try{r=await api("api/preview",{token,ref:S.ref||"apercu"});}catch(e){}
  if(!r||!r.ok){go({screen:"home"});note.textContent="Cet aperçu n'a pas pu s'ouvrir : créez-en un nouveau ci-dessous.";return;}
  if(r.price)PRICE=r.price;
  go(Object.assign({},fresh,{ref:S.ref||"apercu",token:r.token,quest:null,start:null,screen:"preview",indoor:!!r.indoorOnly,
    preview:{ok:true,indoorOnly:r.indoorOnly,count:r.count,walkM:r.walkM,minutes:r.minutes,teasers:r.teasers,price:r.price,testeur:!!r.testeur},
    name:(p.get("n")||"").slice(0,24),hero:p.get("h")==="f"?"f":"m",kids:Math.max(2,Math.min(15,parseInt(p.get("k"),10)||8)),town:(p.get("v")||"").slice(0,60)}));
}

// A reload in the middle of loading goes back to where it was; everything else resumes.
if(S.screen==="loading"||S.screen==="unlocking")S.screen=S.preview?"preview":"home";
const qs=new URLSearchParams(location.search);
// the personal link: say so once, and take ?moi off the address
if(qs.has("moi")){const t=h("div",{class:"toast",role:"status",text:ME?"Appareil reconnu : tes visites ne comptent plus dans le point du dimanche.":"Cet appareil compte de nouveau comme un visiteur."});
  document.body.append(t);setTimeout(()=>t.remove(),6000);
  const u=new URL(location.href);u.searchParams.delete("moi");history.replaceState(null,"",u.pathname+u.search+u.hash);}
if(qs.get("ref")){S.ref=qs.get("ref").replace(/[^a-z0-9-]/gi,"").slice(0,20);save();if(!qs.get("paid")&&!qs.get("quete")&&!qs.get("apercu"))history.replaceState(null,"",location.pathname);}
const sid=qs.get("paid")||qs.get("quete");
// A button made for the quest at home (?mode=maison): the form opens on « À la maison ».
if(qs.get("mode")==="maison"&&!sid&&!qs.get("apercu")&&!(S.unlocked&&S.quest)){S.mode="maison";S.screen="setup";save();if(!qs.get("ref"))history.replaceState(null,"",location.pathname);}
// From a guide's "La fête a lieu à" box (?ville=…): open the form with the town already typed.
if(qs.get("ville")&&!sid&&!qs.get("apercu")){const v=qs.get("ville").replace(/[<>]/g,"").trim().slice(0,60);
  if(v&&!(S.unlocked&&S.quest)){S.villeQ=v;S.commune=null;S.mode="ville";S.screen="setup";save();}
  if(!qs.get("ref"))history.replaceState(null,"",location.pathname);}
if(PAID&&sid){history.replaceState(null,"",location.pathname);unlockWith(sid,!!qs.get("paid"));}
else if(PAID&&qs.get("apercu")){history.replaceState(null,"",location.pathname);openShared(qs.get("apercu"),qs);}
else if(qs.has("annule")){history.replaceState(null,"",location.pathname);if(S.preview)S.screen="preview";render();note.textContent="Paiement annulé : rien n'a été débité.";}
else{render();refreshQuest();}

// A quest kept on this phone before 15/10/2026 has no hiding places nor home stories: rebuild it
// (same places, same letters, progress kept).
async function refreshQuest(){
  const q=S.quest;if(!q||!q.steps||q.steps.every(st=>st.home))return;
  try{
    let nq=null;
    if(PAID&&S.paid){const r=await api("api/unlock",{session:S.paid});if(r&&r.ok)nq=r.quest;}
    else if(E)nq=q.indoorOnly?E.assemble(null,E.indoorStops()):E.assemble(q.start,q.steps.map(st=>({cat:st.cat,lat:st.lat,lon:st.lon,name:st.name,id:st.osm})));
    if(nq&&nq.steps.length===q.steps.length&&S.quest===q){S.quest=nq;save();render();}
  }catch(e){}
}
})();
</script>
