<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- One frame of a "Le Grand Maître appelle…" video (1080x1920). make.py calls frame(t) for each frame. -->
<style>
@font-face{font-family:"UnifrakturMaguntia";src:url(../../fonts/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(../../fonts/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../fonts/AlegreyaSans-Italic.woff) format("woff");font-weight:400;font-style:italic}
@font-face{font-family:"Alegreya Sans";src:url(../../fonts/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(../../fonts/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
:root{--navy:#11152a;--card:#1a2038;--ink:#ebe9f4;--muted:#a3a8c3;--rose:#e58b95;--wax:#b8505c;--or:#e0b55a;--line:#2d3452}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Alegreya Sans",sans-serif}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 90px}
#ask{justify-content:flex-start;padding-top:330px;gap:56px}
#ask h1{font-size:76px;line-height:1.15;font-weight:700;text-align:center}
.field{width:100%;height:150px;border-radius:28px;border:3px solid var(--line);background:var(--card);display:flex;align-items:center;padding:0 44px;font-size:78px}
.caret{display:inline-block;width:5px;height:84px;background:var(--rose);margin-left:6px}
.listen{width:100%;height:150px;border-radius:28px;background:var(--rose);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:24px;
  font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:58px;letter-spacing:2px}
.listen.pressed{transform:scale(.96);filter:brightness(.88)}
#speak{justify-content:flex-start;padding-top:300px;gap:70px}
.seal{width:230px;height:230px}
.name{font-family:"UnifrakturMaguntia",serif;font-size:150px;color:var(--rose);line-height:1}
.line{font-size:74px;line-height:1.3;font-style:italic;text-align:center;min-height:300px}
.speaker{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:44px;letter-spacing:3px;color:var(--or)}
#end{justify-content:center;gap:56px;text-align:center;padding-bottom:200px}
#end h2{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:150px;line-height:1.02}
#end p{font-size:62px;line-height:1.3}
#end .cta{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:56px;color:var(--or);letter-spacing:2px}
#end .url{font-weight:700;font-size:84px;color:var(--ink);margin-top:-30px;padding:18px 40px;border:3px solid var(--or);border-radius:28px}
</style>
</head>
<body>
<div class="layer" id="ask">
  <h1>Tapez le prénom de votre enfant…</h1>
  <div class="field"><span id="typed"></span><span class="caret" id="caret"></span></div>
  <div class="listen" id="listen"><svg width="54" height="54" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>Écouter le Grand Maître</div>
</div>
<div class="layer" id="speak">
  <svg class="seal" viewBox="-30 -30 60 60" aria-hidden="true">
    <path d="M25.0 -1.4Q26.0 0.0 26.8 1.6Q27.5 3.1 26.4 4.4Q25.4 5.8 24.1 6.9Q22.9 8.0 22.9 9.5Q23.0 11.1 22.9 12.7Q22.8 14.3 21.2 15.0Q19.6 15.7 18.1 16.1Q16.6 16.6 16.2 18.2Q15.7 19.7 15.1 21.3Q14.4 22.9 12.8 23.1Q11.2 23.2 9.6 23.1Q8.1 23.0 6.9 24.2Q5.8 25.4 4.5 26.5Q3.1 27.5 1.5 26.7Q0.0 25.9 -1.3 24.9Q-2.7 23.9 -4.2 24.3Q-5.6 24.7 -7.2 25.0Q-8.8 25.3 -9.9 23.9Q-10.9 22.6 -11.7 21.3Q-12.6 20.0 -14.2 19.9Q-15.9 19.9 -17.6 19.6Q-19.3 19.3 -19.8 17.7Q-20.3 16.2 -20.5 14.6Q-20.7 13.0 -22.1 12.2Q-23.5 11.3 -24.7 10.2Q-26.0 9.1 -25.5 7.4Q-25.0 5.7 -24.3 4.2Q-23.6 2.7 -24.4 1.3Q-25.2 0.0 -25.9 -1.5Q-26.5 -3.0 -25.5 -4.3Q-24.5 -5.6 -23.5 -6.7Q-22.4 -7.9 -22.8 -9.5Q-23.1 -11.1 -23.2 -12.9Q-23.3 -14.6 -21.8 -15.4Q-20.4 -16.3 -18.8 -16.8Q-17.3 -17.3 -16.7 -18.8Q-16.2 -20.3 -15.4 -21.7Q-14.5 -23.1 -12.8 -23.0Q-11.0 -22.9 -9.4 -22.6Q-7.8 -22.3 -6.7 -23.4Q-5.6 -24.5 -4.3 -25.5Q-3.0 -26.6 -1.5 -26.0Q-0.0 -25.3 1.3 -24.6Q2.7 -23.8 4.2 -24.5Q5.8 -25.2 7.4 -25.7Q9.1 -26.1 10.2 -24.8Q11.3 -23.5 12.2 -22.1Q13.0 -20.7 14.5 -20.4Q16.1 -20.1 17.6 -19.7Q19.2 -19.2 19.4 -17.5Q19.7 -15.7 19.8 -14.1Q19.9 -12.5 21.3 -11.7Q22.6 -10.9 24.0 -9.9Q25.4 -8.9 25.1 -7.3Q24.9 -5.7 24.5 -4.2Q24.1 -2.7 25.0 -1.4Z" fill="var(--wax)"/>
    <circle r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
    <path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".85"/></svg>
  <div class="speaker">Le Grand Maître</div>
  <div class="name" id="name"></div>
  <div class="line" id="line"></div>
</div>
<div class="layer" id="end">
  <h2>Ma Quête Légendaire</h2>
  <p>La chasse au trésor de chevaliers dans votre ville, au prénom de votre enfant.</p>
  <div class="cta">Aperçu gratuit sur</div>
  <div class="url">maquetelegendaire.fr</div>
</div>
<script>
let C=null;
// cfg: {name, typeStart, typeEnd, press, voice, captions:[{t0,t1,text}], endAt, total}
function setup(cfg){C=cfg;document.getElementById("name").textContent=cfg.name+",";}
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function show(id,o){const e=document.getElementById(id);e.style.opacity=o;e.style.visibility=o>0.001?"visible":"hidden";}
function frame(t){
  // 1. the parent types the name, then taps "Écouter"
  const n=C.name.length,k=Math.max(0,Math.min(n,Math.floor((t-C.typeStart)/(C.typeEnd-C.typeStart)*n+0.0001)));
  document.getElementById("typed").textContent=t<C.typeStart?"":C.name.slice(0,k);
  document.getElementById("caret").style.opacity=(t<C.press&&Math.floor(t*2)%2===0)?1:0;
  document.getElementById("listen").classList.toggle("pressed",t>=C.press&&t<C.press+0.25);
  show("ask",1-ease((t-C.press-0.2)/0.35));
  // 2. the Grand Master speaks; the sentence being said is shown
  const sp=ease((t-C.press-0.3)/0.4)*(1-ease((t-C.endAt)/0.4));
  show("speak",sp);
  const cur=C.captions.find(c=>t>=c.t0&&t<c.t1)||C.captions.filter(c=>t>=c.t1).slice(-1)[0];
  document.getElementById("line").textContent=cur?cur.text:"";
  // 3. end card
  show("end",ease((t-C.endAt-0.2)/0.5));
}
</script>
</body>
</html>
