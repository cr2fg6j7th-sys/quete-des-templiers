<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"UnifrakturMaguntia";src:url(FONTS/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";font-weight:400;src:url(FONTS/AlegreyaSans-Regular.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";font-weight:700;src:url(FONTS/AlegreyaSans-Bold.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";font-weight:500;src:url(FONTS/AlegreyaSans-Medium.woff) format("woff")}
@font-face{font-family:"Alegreya Sans SC";font-weight:700;src:url(FONTS/AlegreyaSansSC-Bold.woff) format("woff")}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0e1d}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 55% at 50% 45%,#232b55 0%,#141a35 55%,#0a0d1c 100%);font-family:"Alegreya Sans",sans-serif;color:#fffaf0}
#shake{position:absolute;inset:0}
.abs{position:absolute;left:0;right:0;text-align:center}
.top{top:300px;font-weight:700;font-size:92px;line-height:1.06;padding:0 70px;text-wrap:balance}
.top em{font-style:normal;color:#ff9aa5}
.kw{bottom:250px;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:42px;letter-spacing:3px;color:#e9c46a;padding:0 50px;white-space:nowrap}
.kw:before{content:"";display:block;width:120px;height:3px;background:#e9c46a;margin:0 auto 18px;opacity:.7}
.brand{bottom:160px;font-family:"UnifrakturMaguntia",serif;font-size:58px;color:#ff9aa5;opacity:.9}
.name{top:1010px;font-family:"UnifrakturMaguntia",serif;font-size:210px;line-height:1;color:#ff9aa5;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.name.final{color:#fffaf0}
.huge{top:760px;font-weight:700;font-size:230px;letter-spacing:6px;line-height:1}
.sub{top:1090px;font-weight:700;font-size:96px;line-height:1.08;padding:0 70px}
.sub2{top:1220px;font-weight:700;font-size:96px;line-height:1.08;padding:0 70px;color:#ff9aa5}
.label{top:250px}
.label span{display:inline-block;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:64px;letter-spacing:5px;color:#11152a;background:#e9c46a;padding:10px 34px 14px;border-radius:14px}
.big{top:840px;font-weight:700;font-size:124px;line-height:1.04;padding:0 60px;text-wrap:balance}
.big em{font-style:normal;color:#ff9aa5}
#seal{position:absolute;left:50%;width:420px;height:420px;margin-left:-210px;transform-origin:50% 50%}
#cracks{position:absolute;inset:0;width:1080px;height:1920px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#red{position:absolute;inset:0;background:#a33f4b;opacity:0}
#map{position:absolute;inset:0;width:1080px;height:1920px}
.clock{top:1440px;font-weight:700;font-size:70px;color:#e9c46a;font-variant-numeric:tabular-nums}
</style></head>
<body><div id="stage"><div id="red"></div><svg id="map"></svg><div id="shake"><svg id="cracks"></svg><div id="root"></div></div><div id="flash"></div></div>
<script>
const BORD = "BORD";
const SEAL = `<svg id="seal" viewBox="-30 -30 60 60"><path d="${BORD}" fill="#a33f4b" stroke="#7d2a35" stroke-width=".6"/><circle r="17.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/><path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".88"/></svg>`;
let C = null, shakeSeed = [];
const nb = s => s.replace(/ ([!?:;»])/g, " $1");
function rnd(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const clamp = x => Math.min(Math.max(x, 0), 1);

function setup(cfg){
  C = cfg;
  const r = document.getElementById("root");
  let h = "";
  if (cfg.top) h += `<div class="abs top" id="top">${nb(cfg.top)}</div>`;
  if (cfg.type === "roulette") h += `${SEAL}<div class="abs name" id="name"></div>`;
  if (cfg.type === "alerte") h += `${SEAL}<div class="abs huge" id="huge">${nb(cfg.huge || "ALERTE.")}</div><div class="abs sub" id="sub">${nb(cfg.sub)}</div><div class="abs sub2" id="sub2">${nb(cfg.sub2)}</div>`;
  if (cfg.type === "ans") h += `${SEAL}<div class="abs huge" id="huge">${nb(cfg.huge)}</div><div class="abs sub2" id="sub2">${nb(cfg.sub2)}</div>`;
  if (cfg.type === "defi") h += `<div class="abs label" id="label"><span>${nb(cfg.label)}</span></div>${SEAL}<div class="abs big" id="big">${nb(cfg.big)}</div><div class="abs clock" id="clock"></div>`;
  if (cfg.type === "village") h += `${SEAL}<div class="abs sub2" id="sub2">${nb(cfg.sub2)}</div>`;
  h += `<div class="abs kw" id="kw">${nb(cfg.kw)}</div><div class="abs brand">Ma Quête Légendaire</div>`;
  r.innerHTML = h;
  const seal = document.getElementById("seal");
  if (seal) seal.style.top = (cfg.sealTop ?? 520) + "px";
  // cracks: jagged lines from the seal centre, revealed at the impact
  const cx = 540, cy = (cfg.sealTop ?? 520) + 210;
  let s = "";
  for (let k = 0; k < 9; k++){
    let a = (k / 9) * Math.PI * 2 + rnd(k) * 0.5, x = cx + Math.cos(a) * 200, y = cy + Math.sin(a) * 200, d = `M${x.toFixed(0)},${y.toFixed(0)}`;
    const len = 160 + rnd(k + 20) * 260;
    for (let j = 1; j <= 5; j++){ a += (rnd(k * 7 + j) - .5) * .6; x += Math.cos(a) * len / 5; y += Math.sin(a) * len / 5; d += ` L${x.toFixed(0)},${y.toFixed(0)}`; }
    s += `<path d="${d}" fill="none" stroke="#fffaf0" stroke-width="${(3 + rnd(k + 40) * 3).toFixed(1)}" stroke-linecap="round" stroke-opacity=".55" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
  }
  document.getElementById("cracks").innerHTML = s;
  if (cfg.type === "village") drawMap();
}

function drawMap(){
  // a dark street map, invented: a few long roads, many short streets, a square around the town hall
  let s = "", k = 0;
  const line = (pts, w, o) => s += `<polyline points="${pts.map(p => p.map(v => v.toFixed(0)).join(",")).join(" ")}" fill="none" stroke="#9aa3d6" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  for (let i = 0; i < 7; i++){ const y0 = 200 + i * 240 + rnd(i) * 80; const pts = []; for (let x = -40; x <= 1120; x += 120) pts.push([x, y0 + Math.sin(x / 230 + i) * 50 + rnd(i * 13 + x) * 30]); line(pts, 16, .22); }
  for (let i = 0; i < 6; i++){ const x0 = 120 + i * 170 + rnd(i + 9) * 60; const pts = []; for (let y = -40; y <= 1960; y += 160) pts.push([x0 + Math.sin(y / 300 + i) * 60 + rnd(i * 17 + y) * 30, y]); line(pts, 12, .18); }
  for (let i = 0; i < 70; i++){ const x = rnd(i * 3 + 1) * 1080, y = rnd(i * 3 + 2) * 1920, a = rnd(i * 3 + 3) * Math.PI, l = 60 + rnd(i + 99) * 140; line([[x, y], [x + Math.cos(a) * l, y + Math.sin(a) * l]], 7, .14); }
  document.getElementById("map").innerHTML = s;
}

function impact(t, t0){
  // seal: 2.6x -> 1x in 0.15 s; flash; shake for 0.3 s; cracks drawn in 0.12 s
  const seal = document.getElementById("seal");
  const p = clamp((t - t0) / 0.15);
  if (seal){
    const sc = t < t0 ? 0 : 2.6 - 1.6 * ease(p);
    seal.style.opacity = t < t0 ? 0 : Math.min(1, (t - t0) / 0.06);
    seal.style.transform = `scale(${sc.toFixed(3)}) rotate(${(-14 + 14 * ease(p)).toFixed(1)}deg)`;
  }
  const after = t - t0 - 0.15;
  document.querySelectorAll("#cracks path").forEach(pa => pa.setAttribute("stroke-dashoffset", after < 0 ? 1 : Math.max(0, 1 - after / 0.12).toFixed(3)));
  const f = after < 0 ? 0 : Math.max(0, .55 - after * 4.5);
  return { flash: f, shake: after < 0 ? 0 : Math.max(0, 1 - after / 0.32) };
}

function frame(t){
  const c = C, st = document.getElementById("shake");
  let fx = { flash: 0, shake: 0 };
  const show = (id, on, dy = 40, at = 0) => { const e = document.getElementById(id); if (!e) return; const p = clamp((t - at) / 0.12); e.style.opacity = on ? ease(p) : 0; e.style.transform = `translateY(${((1 - ease(p)) * dy).toFixed(1)}px)`; };
  ["top","kw"].forEach(id => { const e = document.getElementById(id); if (e){ e.style.opacity = 1; e.style.transform = "none"; } });
  if (c.type === "roulette"){
    // names flicker like a slot machine, slowing down, then the final one lands with the seal
    const names = c.names, el = document.getElementById("name");
    let acc = 0, i = 0, d = 0.055;
    while (acc + d <= t && i < names.length){ acc += d; i++; d *= 1.17; }
    const landed = t >= c.land;
    if (landed){ el.textContent = nb(c.final); el.classList.add("final"); el.style.transform = `scale(${(1.25 - .25 * ease((t - c.land) / .15)).toFixed(3)})`; el.style.filter = "none"; }
    else { el.classList.remove("final"); el.textContent = names[i % names.length]; const ph = i === 0 ? 1 : clamp((t - acc) / d); el.style.transform = `translateY(${((1 - ease(ph)) * 120).toFixed(0)}px)`; el.style.filter = `blur(${((1 - ph) * 6).toFixed(1)}px)`; }
    fx = impact(t, c.land - 0.15);
  }
  if (c.type === "alerte"){
    const red = document.getElementById("red"); red.style.opacity = t < 0.12 ? .9 : Math.max(0, .9 - (t - .12) * 5);
    const h = document.getElementById("huge"); const p = clamp(t / .12); h.style.transform = `scale(${(1.22 - .22 * ease(p)).toFixed(3)})`; h.style.opacity = 1;
    show("sub", t >= c.t1, 40, c.t1); show("sub2", t >= c.t2, 40, c.t2);
    fx = impact(t, 0.02);
  }
  if (c.type === "ans"){
    const h = document.getElementById("huge"); const p = clamp(t / .14); h.style.transform = `scale(${(1.45 - .45 * ease(p)).toFixed(3)})`; h.style.opacity = 1;
    show("sub2", t >= c.t2, 0, c.t2);
    const e = document.getElementById("sub2"); if (t >= c.t2) e.style.transform = `scale(${(1.3 - .3 * ease((t - c.t2) / .12)).toFixed(3)})`;
    fx = impact(t, c.t2 - 0.15);
  }
  if (c.type === "defi"){
    const lab = document.getElementById("label"); const p = clamp(t / .12); lab.style.transform = `scale(${(1.5 - .5 * ease(p)).toFixed(3)})`;
    document.getElementById("big").style.opacity = 1;
    const b = document.getElementById("big"); b.style.transform = `scale(${(1.12 - .12 * ease(t / .2)).toFixed(3)})`;
    const ck = document.getElementById("clock"); ck.textContent = "⏱ " + (c.seconds - Math.floor(t / (c.dur / c.seconds))) ;
    fx = impact(t, 0.02);
  }
  if (c.type === "village"){
    const m = document.getElementById("map"); m.style.transform = `scale(${(2.2 - 1.2 * ease(t / c.land)).toFixed(3)})`; m.style.transformOrigin = "50% 38%";
    show("sub2", t >= c.t2, 30, c.t2);
    fx = impact(t, c.land - 0.15);
  }
  const k = fx.shake * 26;
  st.style.transform = `translate(${((rnd(Math.floor(t * 60)) - .5) * k).toFixed(1)}px,${((rnd(Math.floor(t * 60) + 5) - .5) * k).toFixed(1)}px)`;
  document.getElementById("flash").style.opacity = fx.flash.toFixed(3);
}
</script></body></html>
