<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/* Retention format (from 21 Oct 2026): the hook is on screen from the first frame, the voice starts at once,
   big word-by-word captions, constant slow motion, a progress bar, the answer last, then it loops. */
@font-face{font-family:"UnifrakturMaguntia";src:url(FONTS/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(FONTS/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
:root{--navy:#11152a;--card:#1d2443;--ink:#f4f1fa;--dim:rgba(244,241,250,.38);--rose:#ef93a0;--wax:#b8505c;--or:#f0c25e;--line:#323a5e}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Alegreya Sans",sans-serif}
#bg{position:absolute;inset:-200px;background:radial-gradient(circle at 50% 50%,#2a3366 0%,#171d3c 40%,var(--navy) 70%)}
#ring{position:absolute;left:50%;top:1060px;width:1500px;height:1500px;margin:-750px 0 0 -750px;opacity:.07}
#hook{position:absolute;top:200px;left:60px;right:60px;padding:34px 40px 40px;border-radius:34px;background:var(--card);border:3px solid var(--line);
  font-weight:700;font-size:76px;line-height:1.12;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#hook b{color:var(--or)}
#bar{position:absolute;left:96px;right:96px;bottom:16px;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--or);border-radius:5px}
#stage{position:absolute;left:0;right:0;top:700px;height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transform-origin:50% 50%}
#who{display:flex;align-items:center;gap:20px;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:42px;letter-spacing:3px;color:var(--or)}
#who svg{width:92px;height:92px}
#cap{max-width:900px;padding:0 60px;text-align:center;font-weight:700;font-size:116px;line-height:1.08;text-shadow:0 8px 28px rgba(0,0,0,.55)}
#cap span{color:var(--dim)}
#cap span.on{color:var(--ink)}
#cap span.now{color:var(--or)}
#cap.name{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:230px;color:var(--rose)}
#cap.name span,#cap.name span.on,#cap.name span.now{color:var(--rose)}
#cap.payoff span.on,#cap.payoff span.now{color:var(--rose)}
#ask{position:absolute;left:60px;right:60px;top:575px;display:flex;justify-content:center;opacity:0}
#ask div{font-weight:700;font-size:50px;line-height:1.1;padding:16px 34px;border-radius:999px;background:var(--wax);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#end{position:absolute;left:60px;right:60px;top:660px;height:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center;opacity:0}
#end .q{font-weight:700;font-size:64px;line-height:1.1;color:var(--or)}
#end .link{display:flex;align-items:center;gap:22px;padding:22px 40px 22px 26px;border-radius:26px;background:#f3ead6;color:var(--navy);box-shadow:0 16px 44px rgba(0,0,0,.5),inset 0 0 0 5px #e0c98f;transform-origin:50% 50%}
#end .link svg{width:110px;height:110px;flex:none}
#end .link b{display:block;font-size:74px;line-height:1;letter-spacing:-.5px}
#end .link small{display:block;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:34px;letter-spacing:2px;color:var(--wax);margin-top:8px;text-align:left}
#end ul b{color:var(--or)}
#end ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:18px;text-align:left;font-size:46px;line-height:1.2}
#end li{display:flex;gap:20px;align-items:baseline}
#end li i{flex:none;width:18px;height:18px;background:var(--or);transform:rotate(45deg) translateY(-4px)}
#end .deal{font-weight:700;font-size:44px;padding:14px 32px;border-radius:999px;background:var(--wax);color:#fff}
#end .deal small{font-weight:400}
#foot{position:absolute;left:60px;right:60px;top:1440px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#brand{font-family:"UnifrakturMaguntia",serif;font-size:62px;line-height:1}
#cta{font-weight:700;font-size:52px;padding:14px 38px;border:4px solid var(--or);border-radius:24px;color:var(--ink);background:rgba(17,21,42,.75)}
#cta small{display:block;font-weight:400;font-size:34px;color:var(--or)}
</style>
</head>
<body>
<div id="bg"></div>
<svg id="ring" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="27" fill="none" stroke="#fff" stroke-width=".7"/><circle r="22" fill="none" stroke="#fff" stroke-width=".35" stroke-dasharray="1.2 1.2"/><path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff"/></svg>
<div id="hook"><div id="hooktext"></div><div id="bar"><i></i></div></div>
<div id="ask"><div id="asktext"></div></div>
<div id="stage">
  <div id="who"><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="26" fill="var(--wax)"/><circle r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/><path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".85"/></svg>Le Grand Maître</div>
  <div id="cap"></div>
</div>
<div id="end">
  <div class="q" id="endq"></div>
  <div class="link"><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="26" fill="var(--wax)"/><circle r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/><path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".85"/></svg><div><b>maquetelegendaire.fr</b><small>Lien dans la bio</small></div></div>
  <ul><li><i></i><span>Une chasse au trésor de chevaliers dans <b>votre ville</b></span></li><li><i></i><span>Votre enfant appelé <b>par son prénom</b></span></li><li><i></i><span>7 à 10 ans · prête en 2 minutes · même à la maison</span></li></ul>
  <div class="deal" id="enddeal"></div>
</div>
<div id="foot"><div id="brand">Ma Quête Légendaire</div></div>
<script>
// French punctuation: a non-breaking space before ! ? : ; » and after «.
const nb=t=>t.replace(/(\d) (?=[^\s\d])/g,"$1 ").replace(/ ([!?:;»])/g," $1").replace(/« /g,"« ");
let C;
// cfg: {hook, total, words:[{w,t0,t1,chunk,name,payoff}], chunks:[t0], cta:{at, text, small}}
function setup(cfg){C=cfg;if(cfg.ask)document.getElementById("asktext").innerHTML=nb(cfg.ask);document.getElementById("hooktext").innerHTML=nb(cfg.hook);
  if(cfg.cta){document.getElementById("endq").innerHTML=nb(cfg.cta.q||"");document.getElementById("enddeal").innerHTML=nb(cfg.cta.text)+(cfg.cta.small?` <small>· ${nb(cfg.cta.small)}</small>`:"");}}
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
let lastChunk=-2;
function frame(t){
  const T=C.total;
  document.querySelector("#bar i").style.width=(100*Math.min(t/T,1)).toFixed(2)+"%";
  document.getElementById("bg").style.transform=`scale(${1+0.10*t/T}) rotate(${t*0.6}deg)`;
  document.getElementById("ring").style.transform=`rotate(${t*7}deg) scale(${1+0.05*Math.sin(t*1.3)})`;
  // current chunk = the last one started (captions lead the voice by 0.06 s)
  const tt=t+0.06;
  let k=-1;C.chunks.forEach((c0,i)=>{if(tt>=c0)k=i});
  const cap=document.getElementById("cap");
  if(k!==lastChunk){
    const ws=C.words.filter(w=>w.chunk===k);
    cap.className=ws.length&&ws[0].name?"name":ws.length&&ws[0].payoff?"payoff":"";
    cap.innerHTML=ws.map(w=>`<span>${nb(w.w)}</span>`).join(" ");
    lastChunk=k;
  }
  const spans=[...cap.querySelectorAll("span")],ws=C.words.filter(w=>w.chunk===k);
  spans.forEach((s,i)=>{const w=ws[i];s.className=tt>=w.t1?"on":tt>=w.t0?"now":"";if(i===0&&tt>=w.t0&&tt<w.t1)s.className="now"});
  // pop when a chunk appears, slow push-in of the whole stage
  const c0=k>=0?C.chunks[k]:0,p=ease((tt-c0)/0.16);
  const pop=k>=0?0.82+0.18*p+0.05*Math.sin(Math.PI*Math.min((tt-c0)/0.16,1)):1;
  document.getElementById("stage").style.transform=`scale(${(pop*(1+0.06*t/T)).toFixed(4)})`;
  const hk=document.getElementById("hook");hk.style.transform=`scale(${(1+0.012*Math.sin(t*2.2)).toFixed(4)})`;
  // the comment prompt pops at 0.7 s and pulses, so people guess before the answer
  const ak=document.getElementById("ask");
  if(C.ask&&t>=0.7&&!(C.cta&&t>=C.cta.at)){const q=ease((t-0.7)/0.22);ak.style.opacity=q;ak.style.transform=`scale(${(0.7+0.3*q+(q>=1?0.035*Math.sin(t*5):0)).toFixed(4)})`;}
  else ak.style.opacity=0;
  // the end card: the link, styled, and what the quest is; the answer stays on screen 0.9 s before it
  const end=document.getElementById("end"),st=document.getElementById("stage");
  if(C.cta&&t>=C.cta.at){
    const q=ease((t-C.cta.at)/0.25);st.style.opacity=1-q;end.style.opacity=q;
    const kids=[...end.children];kids.forEach((n,i)=>{const r=ease((t-C.cta.at-0.12*i)/0.3);n.style.opacity=r;n.style.transform=`translateY(${(1-r)*50}px)`});
    const lk=end.querySelector(".link"),r=ease((t-C.cta.at-0.12)/0.3);lk.style.transform=`translateY(${(1-r)*50}px) scale(${(0.85+0.15*r+0.025*Math.sin((t-C.cta.at)*4)).toFixed(4)})`;
    document.getElementById("brand").style.opacity=0;
  } else {st.style.opacity=1;end.style.opacity=0;document.getElementById("brand").style.opacity=1;}
}
</script>
</body>
</html>
