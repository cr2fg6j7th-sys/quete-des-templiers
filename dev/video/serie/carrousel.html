<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/* Seek-and-find carousel (4:5, 1080 x 1350): a busy birthday party at the castle, a small golden key hidden
   in the crowd, a hint, the answer, then the quest. */
@font-face{font-family:"UnifrakturMaguntia";src:url(FONTS/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(FONTS/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
:root{--navy:#11152a;--card:#1b2547;--ink:#fffaf0;--or:#f0c25e;--wax:#b8505c;--line:#323a5e;--paper:#f3ead6}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Alegreya Sans",sans-serif}
#scene{position:absolute;left:0;top:0;width:1080px;height:1440px;transform-origin:0 0}
#scene img{width:1080px;height:1440px;display:block}
#key{position:absolute;width:44px;height:44px}
#dim{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:50px;right:50px;padding:28px 36px 32px;border-radius:30px;background:var(--card);border:3px solid var(--line);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card .t{font-weight:700;font-size:70px;line-height:1.08}
.card .t b,.card .s b{color:var(--or)}
.card .s{font-size:42px;line-height:1.2;margin-top:14px;color:rgba(255,250,240,.85)}
.chip{position:absolute;left:0;right:0;display:flex;justify-content:center}
.chip div{display:flex;align-items:center;gap:16px;font-weight:700;font-size:40px;padding:14px 30px;border-radius:999px;background:var(--wax);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.chip svg{width:46px;height:46px}
.eyebrow{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:34px;letter-spacing:3px;color:var(--or);margin-bottom:10px}
.num{position:absolute;right:44px;bottom:40px;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:30px;letter-spacing:2px;padding:8px 18px;border-radius:999px;background:rgba(17,21,42,.75);color:var(--ink)}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 80px;text-align:center;background:var(--navy)}
#end .brand{font-family:"UnifrakturMaguntia",serif;font-size:62px;color:var(--or)}
#end .q{font-weight:700;font-size:74px;line-height:1.06}
#end .q b{color:var(--or)}
#end p{font-size:44px;line-height:1.25;color:rgba(255,250,240,.85)}
#end ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:14px;text-align:left;font-size:44px}
#end li{display:flex;gap:20px;align-items:baseline}
#end li i{flex:none;width:18px;height:18px;background:var(--or);transform:rotate(45deg) translateY(-4px)}
#end li b{color:var(--or)}
#end .link{padding:18px 40px;border-radius:24px;background:var(--paper);color:var(--navy);box-shadow:inset 0 0 0 5px #e0c98f}
#end .link b{display:block;font-size:66px;line-height:1}
#end .link small{display:block;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:30px;letter-spacing:2px;color:var(--wax);margin-top:6px}
#end .save{font-weight:700;font-size:40px;padding:12px 30px;border-radius:999px;border:4px solid var(--or)}
</style>
</head>
<body>
<div id="scene"><img id="img"><svg id="key" viewBox="0 0 64 64"><g transform="rotate(-35 32 32)"><circle cx="18" cy="32" r="12" fill="#f3c74f" stroke="#5a3d08" stroke-width="4"/><circle cx="18" cy="32" r="4.5" fill="#5a3d08"/><rect x="28" y="28" width="30" height="8" rx="2" fill="#f3c74f" stroke="#5a3d08" stroke-width="3.5"/><rect x="46" y="34" width="5" height="10" fill="#f3c74f" stroke="#5a3d08" stroke-width="3"/><rect x="53" y="34" width="5" height="7" fill="#f3c74f" stroke="#5a3d08" stroke-width="3"/></g></svg></div>
<svg id="dim" viewBox="0 0 1080 1350"></svg>
<div id="ui"></div>
<div id="end"></div>
<script>
const $=id=>document.getElementById(id);
const KEYSVG=$('key').outerHTML.replace('id="key"','');
function show(c){
  $('img').src=c.img;
  const k=c.key; // key position in scene space (1080 x 1440)
  $('key').style.left=(k[0]-22)+'px'; $('key').style.top=(k[1]-22)+'px';
  const s=c.zoom||1, cx=c.cx??540, cy=c.cy??720;
  const tx=Math.min(0,Math.max(1080-1080*s,540-cx*s)), ty=Math.min(0,Math.max(1350-1440*s,675-cy*s));
  $('scene').style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  const kx=tx+k[0]*s, ky=ty+k[1]*s;
  let d='';
  if(c.hint) d=`<defs><mask id="h"><rect width="1080" height="1350" fill="#fff"/><circle cx="${c.hint[0]}" cy="${c.hint[1]}" r="${c.hint[2]}" fill="#000"/></mask></defs><rect width="1080" height="1350" fill="rgba(17,21,42,.62)" mask="url(#h)"/><circle cx="${c.hint[0]}" cy="${c.hint[1]}" r="${c.hint[2]}" fill="none" stroke="#f0c25e" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>`;
  if(c.ring) d+=`<circle cx="${kx}" cy="${ky}" r="${44*s*0.9}" fill="none" stroke="#f0c25e" stroke-width="10"/><circle cx="${kx}" cy="${ky}" r="${44*s*0.9+16}" fill="none" stroke="#b8505c" stroke-width="5"/>`;
  $('dim').innerHTML=d;
  $('ui').innerHTML=(c.ui||'').replaceAll('KEY',KEYSVG);
  if(c.end){$('end').style.display='flex';$('end').innerHTML=c.end}
}
</script>
</body>
</html>
