<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/* "Le jour où tu deviens chevalier" series (from 22 Oct 2026): every episode opens on a different real-looking
   image (a letter under the door, a castle cake, a medieval town from the sky), the hook is on screen from the
   first frame, and the end card announces the next episode. */
@font-face{font-family:"UnifrakturMaguntia";src:url(FONTS/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Italic.woff) format("woff");font-weight:400;font-style:italic}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(FONTS/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
:root{--navy:#11152a;--card:#1b2547;--ink:#fffaf0;--or:#f0c25e;--wax:#b8505c;--line:#323a5e;--brown:#3a2614}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Alegreya Sans",sans-serif}
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;opacity:0}
#path{position:absolute;inset:0;width:1080px;height:1920px;opacity:0}
.seal{opacity:0}
#letter{position:absolute;left:250px;top:880px;width:600px;color:var(--brown);opacity:0}
#letter .nm{font-family:"UnifrakturMaguntia",serif;font-size:118px;line-height:1;color:#8e1f24}
#letter p{font-style:italic;font-size:54px;line-height:1.18;margin-top:26px;clip-path:inset(0 100% 0 0)}
#letter .sig{font-family:"UnifrakturMaguntia",serif;font-style:normal;font-size:54px;text-align:right;margin-top:40px}
#flash{position:absolute;inset:0;background:#fffaf0;opacity:0}
#shade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(rgba(17,21,42,.55),rgba(17,21,42,0))}
#hook{position:absolute;top:150px;left:56px;right:56px;padding:30px 36px 34px;border-radius:32px;background:var(--card);border:3px solid var(--line);
  font-weight:700;font-size:72px;line-height:1.1;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}
#hook b{color:var(--or)}
#bar{position:absolute;left:90px;right:90px;bottom:14px;height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--or)}
#ep{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center}
#ep div{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:36px;letter-spacing:2px;padding:10px 28px;border-radius:999px;background:var(--wax);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#cap{position:absolute;left:60px;right:60px;top:1560px;display:flex;justify-content:center}
#cap div{max-width:960px;padding:18px 34px 22px;border-radius:26px;background:rgba(17,21,42,.86);font-weight:700;font-size:86px;line-height:1.06;text-align:center;opacity:0}
#cap span{color:rgba(255,250,240,.4)}#cap span.on{color:var(--ink)}#cap span.now{color:var(--or)}
#cap .name{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:140px;color:#ef93a0!important}
.lab{position:absolute;font-weight:700;font-size:40px;line-height:1;padding:12px 22px;border-radius:16px;background:rgba(255,250,240,.95);color:var(--navy);white-space:nowrap;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lab b{color:var(--wax)}
#end{position:absolute;inset:0;background:rgba(17,21,42,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;padding:0 70px;text-align:center;opacity:0}
#end .q{font-weight:700;font-size:70px;line-height:1.08}
#end .q b{color:var(--or)}
#end ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:16px;text-align:left;font-size:46px;line-height:1.2}
#end li{display:flex;gap:20px;align-items:baseline}
#end li i{flex:none;width:18px;height:18px;background:var(--or);transform:rotate(45deg) translateY(-4px)}
#end .link{display:flex;align-items:center;gap:22px;padding:20px 40px;border-radius:26px;background:#f3ead6;color:var(--navy);box-shadow:inset 0 0 0 5px #e0c98f}
#end .link b{display:block;font-size:70px;line-height:1}
#end .link small{display:block;font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:32px;letter-spacing:2px;color:var(--wax);margin-top:6px;text-align:left}
#end .deal{font-weight:700;font-size:40px;padding:12px 30px;border-radius:999px;background:var(--wax);color:#fff}
#end .next{margin-top:10px;border-top:3px solid var(--line);padding-top:34px;font-size:46px;line-height:1.15;color:rgba(255,250,240,.8)}
#end .next b{display:block;font-family:"Alegreya Sans SC",sans-serif;font-size:36px;letter-spacing:3px;color:var(--or);margin-bottom:10px}
#brand{font-family:"UnifrakturMaguntia",serif;font-size:58px;color:var(--or)}
</style>
</head>
<body>
<div id="scene">
  <img class="bg" id="imgA"><img class="bg" id="imgB">
  <svg id="path" viewBox="0 0 1080 1920">
    <defs><mask id="m"><path id="pm" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></mask></defs>
    <path id="pg" fill="none" stroke="rgba(17,21,42,.55)" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 34" mask="url(#m)"/>
    <path id="pd" fill="none" stroke="#f0c25e" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34" mask="url(#m)"/>
    <g id="seals"></g>
  </svg>
  <div id="labs"></div>
  <div id="letter"><div class="nm" id="lnm"></div><div id="lines"></div><p class="sig" id="lsig">Le Grand Maître</p></div>
</div>
<div id="flash"></div>
<div id="shade"></div>
<div id="hook"><div id="ep"><div id="eptext"></div></div><div id="hooktext" style="margin-top:34px"></div><div id="bar"><i></i></div></div>
<div id="cap"><div id="capbox"></div></div>
<div id="end"></div>
<script>
let C;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const ramp=(t,a,b)=>cl((t-a)/(b-a));
function setup(cfg){
  C=cfg;
  $('imgA').src=cfg.imgA; if(cfg.imgB) $('imgB').src=cfg.imgB;
  $('hooktext').innerHTML=cfg.hook; $('eptext').textContent=cfg.ep;
  $('end').innerHTML=cfg.end;
  if(cfg.points){
    const P=cfg.points, d='M'+P.map(p=>p[0]+' '+p[1]).join(' L');
    for(const id of ['pm','pg','pd']) $(id).setAttribute('d',d);
    C.L=$('pm').getTotalLength(); $('pm').style.strokeDasharray=C.L;
    // fraction of the path at each stop
    let acc=0; C.fr=[0];
    for(let i=1;i<P.length;i++){acc+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);C.fr.push(acc)}
    C.fr=C.fr.map(x=>x/acc);
    const g=$('seals');
    cfg.stops.forEach((s,k)=>{
      const [x,y]=P[s.i];
      g.insertAdjacentHTML('beforeend',`<g class="seal" id="s${k}" transform="translate(${x} ${y})"><circle r="34" fill="#b8505c" stroke="#fffaf0" stroke-width="5"/><text y="14" text-anchor="middle" font-family="Alegreya Sans" font-weight="700" font-size="40" fill="#fffaf0">${k+1}</text></g>`);
      $('labs').insertAdjacentHTML('beforeend',`<div class="lab" id="l${k}" style="${s.side=='l'?'right:'+(1080-x+50):'left:'+(x+50)}px;top:${y-28}px">${s.label}</div>`);
    });
  }
  if(cfg.letter){
    $('lnm').textContent=cfg.letter.name;
    $('lines').innerHTML=cfg.letter.lines.map(l=>`<p>${l[0]}</p>`).join('');
  }
  if(cfg.words){
    // one box per chunk, filled in frame()
  }
}
function view(t){
  // camera: list of keys [t, imgIndex, scale, cx, cy]; scale about the point (cx,cy) put at screen centre
  const K=C.cam; let a=K[0],b=K[K.length-1];
  for(let i=0;i<K.length-1;i++) if(t>=K[i][0]&&t<=K[i+1][0]){a=K[i];b=K[i+1];break}
  const u=b[0]>a[0]?ease(cl((t-a[0])/(b[0]-a[0]))):0;
  const s=a[1]+(b[1]-a[1])*u, cx=a[2]+(b[2]-a[2])*u, cy=a[3]+(b[3]-a[3])*u;
  const tx=Math.min(0,Math.max(1080-1080*s,540-cx*s)), ty=Math.min(0,Math.max(1920-1920*s,960-cy*s));
  $('scene').style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
}
function frame(t){
  view(t);
  const sw=C.switchAt||1e9;
  $('imgA').style.opacity=t<sw?1:0; $('imgB').style.opacity=t>=sw?1:0;
  $('flash').style.opacity=C.switchAt?Math.max(0,1-Math.abs(t-sw)/0.28):0;
  $('bar').firstElementChild.style.width=(100*cl(t/C.total))+'%';
  if(C.points){
    const p=ease(ramp(t,C.path[0],C.path[1]));
    $('path').style.opacity=t>=sw?1:0;
    $('pm').style.strokeDashoffset=C.L*(1-p);
    C.stops.forEach((s,k)=>{const on=p>=C.fr[s.i]-0.005; const q=on?cl((t-C.path[0]-(C.path[1]-C.path[0])*C.fr[s.i])/0.25):0;
      $('s'+k).style.opacity=on?1:0; $('s'+k).setAttribute('transform',$('s'+k).getAttribute('transform').replace(/ scale\([^)]*\)/,'')+` scale(${on?0.6+0.4*q+0.15*Math.sin(Math.PI*q):0})`);
      $('l'+k).style.opacity=q; });
  }
  if(C.letter){
    const L=C.letter; $('letter').style.opacity=cl((t-L.at)/0.4);
    [...$('lines').children].forEach((p,i)=>{const [_,a,b]=L.lines[i]; p.style.clipPath=`inset(0 ${100-100*cl((t-a)/(b-a))}% 0 0)`});
    $('lsig').style.opacity=cl((t-L.sig)/0.4);
  }
  if(C.words){
    const W=C.words; let k=-1;
    for(const w of W) if(t>=w.t0-0.05) k=w.chunk;
    const last=W[W.length-1];
    const box=$('capbox');
    if(k<0||t>last.t1+0.5||t>=C.endAt){box.style.opacity=0}
    else{
      box.style.opacity=1;
      box.innerHTML=W.filter(w=>w.chunk==k).map(w=>`<span class="${w.name?'name ':''}${t>=w.t1?'on':t>=w.t0?'now':''}">${w.w}</span>`).join(' ');
    }
  }
  const e=cl((t-C.endAt)/0.35); $('end').style.opacity=e;
  $('hook').style.opacity=1-e; $('cap').style.opacity=1-e;
}
</script>
</body>
</html>
