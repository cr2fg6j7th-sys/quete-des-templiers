<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/* Short viral formats (from 22 Oct 2026): 9-13 s, at most ~8 words on the first frame, a new visual every
   ~2 s, very little speech, one action at the end: type the child's first name on the site and hear the
   Grand Maître call it. Same art direction as the phone-on-the-table videos (navy, gold, wax, parchment). */
@font-face{font-family:"UnifrakturMaguntia";src:url(FONTS/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Italic.woff) format("woff");font-weight:400;font-style:italic}
@font-face{font-family:"Alegreya Sans";src:url(FONTS/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(FONTS/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
:root{--navy:#11152a;--card:#1b2547;--ink:#fffaf0;--or:#f0c25e;--wax:#b8505c;--line:#323a5e;--paper:#f3ead6;--brown:#3a2614;--rose:#ef93a0}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Alegreya Sans",sans-serif}
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#veil{position:absolute;inset:0;background:var(--navy);opacity:0}
#path{position:absolute;inset:0;width:1080px;height:1920px}
#flash{position:absolute;inset:0;background:#fffaf0;opacity:0}
.b{position:absolute;opacity:0;will-change:transform,opacity}
.hook{left:56px;right:56px;top:150px;padding:26px 34px 30px;border-radius:32px;background:var(--card);border:3px solid var(--line);font-weight:700;font-size:76px;line-height:1.08;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.hook b{color:var(--or)}
.eb{display:block;font-family:"Alegreya Sans SC",sans-serif;font-size:38px;letter-spacing:3px;color:var(--rose);margin-bottom:8px}
.pill{left:0;right:0;display:flex;justify-content:center}
.pill>div{font-weight:700;font-size:48px;line-height:1.1;padding:14px 32px;border-radius:999px;background:var(--wax);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
.parch{left:70px;right:70px;padding:44px 50px;border-radius:18px;background:var(--paper);color:var(--brown);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 6px #e0c98f,inset 0 0 60px rgba(150,110,40,.25)}
.parch .q{font-style:italic;font-size:66px;line-height:1.14}
.parch .q b{font-style:normal;color:#8e1f24}
.big{left:50px;right:50px;text-align:center;font-weight:700;font-size:118px;line-height:1.02;text-shadow:0 8px 30px rgba(0,0,0,.7)}
.big b{color:var(--or)}
.mid{left:60px;right:60px;text-align:center;font-weight:700;font-size:70px;line-height:1.1;text-shadow:0 6px 24px rgba(0,0,0,.8)}
.mid b{color:var(--or)}
.box{left:60px;right:60px;padding:24px 34px;border-radius:26px;background:rgba(17,21,42,.9);text-align:center;font-weight:700;font-size:64px;line-height:1.1}
.box b{color:var(--or)}
.seal{left:50%;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:#a33f4b;border:10px solid #fffaf0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:190px;color:#fffaf0;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.name{left:0;right:0;text-align:center;font-family:"UnifrakturMaguntia",serif;font-size:230px;line-height:1;color:var(--rose);text-shadow:0 10px 40px rgba(0,0,0,.75)}
.tag{font-weight:700;font-size:42px;line-height:1;padding:12px 22px;border-radius:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tag.plain{background:rgba(255,255,255,.92);color:#333}
.tag.gold{background:var(--paper);color:var(--navy);box-shadow:inset 0 0 0 4px var(--or),0 8px 24px rgba(0,0,0,.45)}
.tag.gold b{color:var(--wax)}
.rcpt{left:110px;right:110px;padding:40px 46px 46px;background:#fdfcf7;color:#222;font-family:"Alegreya Sans",sans-serif;box-shadow:0 22px 60px rgba(0,0,0,.45);border-radius:6px}
.rcpt h3{font-family:"Alegreya Sans SC",sans-serif;font-size:40px;letter-spacing:3px;text-align:center;color:#555;margin-bottom:18px}
.row{display:flex;justify-content:space-between;font-size:52px;line-height:1.25;padding:8px 0;border-bottom:3px dashed #ddd;position:relative}
.row i{position:absolute;left:-12px;right:-12px;top:50%;height:8px;margin-top:-4px;background:#c0392b;border-radius:4px;transform-origin:0 50%;transform:scaleX(0)}
.type{left:60px;right:60px;padding:26px 34px;border-radius:26px;background:var(--card);border:3px solid var(--line);font-weight:700;font-size:58px;line-height:1.12;display:flex;gap:26px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.type .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--wax);display:flex;align-items:center;justify-content:center;font-size:58px}
.type.win{background:var(--paper);color:var(--navy);border-color:var(--or)}
.type.win .n{background:var(--or);color:var(--navy)}
/* phone end card */
#end{position:absolute;inset:0;opacity:0;overflow:hidden}
#end .lin{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#phone{position:absolute;left:220px;top:520px;width:640px;height:1310px;border-radius:84px;background:#0d0f17;padding:22px;box-shadow:0 40px 90px rgba(0,0,0,.5);transform-origin:50% 30%}
#scr{position:relative;width:100%;height:100%;border-radius:64px;overflow:hidden;background:#eef0f6}
#scr img{width:100%;display:block}
#typed{position:absolute;left:56px;top:788px;width:480px;height:58px;padding:8px 6px;background:#eff1f6;font-family:"Alegreya Sans",sans-serif;font-size:38px;line-height:42px;color:#1b2547}
#typed u{text-decoration:none;border-right:3px solid #1b2547;margin-left:2px}
#listen{position:absolute;left:52px;right:52px;top:982px;height:74px;border-radius:22px;box-shadow:0 0 0 0 rgba(240,194,94,0)}
#endtop{position:absolute;left:40px;right:40px;top:120px;text-align:center;font-weight:700;font-size:62px;line-height:1.08;color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.6)}
#endtop b{color:#a33f4b}
#url{position:absolute;left:0;right:0;top:1820px;display:flex;justify-content:center}
#url div{font-weight:700;font-size:46px;padding:12px 30px;border-radius:999px;background:var(--navy);color:var(--ink)}
#url b{color:var(--or)}
#bar{position:absolute;left:90px;right:90px;bottom:16px;height:9px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--or)}
</style>
</head>
<body>
<div id="scene"><img id="bg">
  <svg id="path" viewBox="0 0 1080 1920" style="opacity:0">
    <defs><mask id="m"><path id="pm" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></mask></defs>
    <path id="pg" fill="none" stroke="rgba(17,21,42,.55)" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 34" mask="url(#m)"/>
    <path id="pd" fill="none" stroke="#f0c25e" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34" mask="url(#m)"/>
  </svg>
  <div id="sbeats"></div>
</div>
<div id="veil"></div>
<div id="flash"></div>
<div id="beats"></div>
<div id="end"><img class="lin" id="lin"><div id="endtop"></div>
  <div id="phone"><div id="scr"><img id="shot"><div id="typed"></div><div id="listen"></div></div></div>
  <div id="url"><div><b>maquetelegendaire.fr</b> · lien en bio</div></div>
</div>
<div id="bar"><i></i></div>
<script>
let C;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function setup(cfg){
  C=cfg;
  $('bg').src=cfg.bg; $('lin').src=cfg.lin; $('shot').src=cfg.shot;
  $('endtop').innerHTML=cfg.end.top;
  const mk=(b,i,host)=>{const d=document.createElement('div');d.className='b '+(b.cls||'');d.id=(host=='sbeats'?'s':'b')+i;d.style.cssText=b.style||'';d.innerHTML=b.html;$(host).append(d)};
  cfg.beats.forEach((b,i)=>mk(b,i,b.inScene?'sbeats':'beats'));
  if(cfg.path){
    const P=cfg.path.pts,d='M'+P.map(p=>p.join(' ')).join(' L');
    for(const id of ['pm','pg','pd']) $(id).setAttribute('d',d);
    C.L=$('pm').getTotalLength(); $('pm').style.strokeDasharray=C.L;
  }
}
function cam(t){
  const K=C.cam; let a=K[0],b=K[K.length-1];
  for(let i=0;i<K.length-1;i++) if(t>=K[i][0]&&t<=K[i+1][0]){a=K[i];b=K[i+1];break}
  const u=b[0]>a[0]?ease(cl((t-a[0])/(b[0]-a[0]))):0;
  const s=a[1]+(b[1]-a[1])*u,cx=a[2]+(b[2]-a[2])*u,cy=a[3]+(b[3]-a[3])*u;
  const tx=Math.min(0,Math.max(1080-1080*s,540-cx*s)),ty=Math.min(0,Math.max(1920-1920*s,960-cy*s));
  $('scene').style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
}
function frame(t){
  cam(t);
  $('bar').firstElementChild.style.width=(100*cl(t/C.total))+'%';
  let vo=C.dim||0; if(C.veilK){const K=C.veilK; vo=K[0][1]; for(let i=0;i<K.length-1;i++) if(t>=K[i][0]) vo=K[i][1]+(K[i+1][1]-K[i][1])*cl((t-K[i][0])/(K[i+1][0]-K[i][0]))} $('veil').style.opacity=vo;
  $('flash').style.opacity=(C.flashes||[]).reduce((m,f)=>Math.max(m,1-Math.abs(t-f)/0.22),0);
  $('bg').style.filter=C.grayUntil&&t<C.grayUntil?'grayscale(1) brightness(.9)':'none';
  if(C.path){const p=ease(cl((t-C.path.t0)/(C.path.t1-C.path.t0)));$('path').style.opacity=t>=C.path.t0?1:0;$('pm').style.strokeDashoffset=C.L*(1-p)}
  C.beats.forEach((b,i)=>{
    const e=$((b.inScene?'s':'b')+i), a=b.t0, z=b.t1??C.endAt;
    const inn=cl((t-a)/(b.din||0.25)), out=cl((z-t)/0.18);
    let o=Math.min(inn,out), tf='';
    if(t<a||t>z) o=0;
    if(b.anim=='pop') tf=`scale(${0.6+0.4*back(inn)})`;
    else if(b.anim=='up') tf=`translateY(${60*(1-ease(inn))}px)`;
    else if(b.anim=='slam') tf=`scale(${1+1.2*(1-ease(inn))})`;
    e.style.opacity=o; if(tf) e.style.transform=tf;
    if(b.strike) e.querySelectorAll('.row i').forEach((x,k)=>{x.style.transform=`scaleX(${ease(cl((t-b.strike[k])/0.3))})`});
  });
  const E=C.end, e=cl((t-C.endAt)/0.2);
  $('end').style.opacity=e;
  $('phone').style.transform=`scale(${1.25-0.25*ease(cl((t-C.endAt)/0.5))})`;
  const n=Math.floor(cl((t-C.endAt-0.15)/0.35)*E.name.length);
  $('typed').innerHTML=(t>C.endAt+0.1?E.name.slice(0,n):'')+(Math.floor(t*3)%2?'<u></u>':'');
  const g=cl((t-C.endAt-0.6)/0.25); $('listen').style.boxShadow=`0 0 0 ${10*g}px rgba(240,194,94,${0.9*g})`;
}
</script>
</body>
</html>
