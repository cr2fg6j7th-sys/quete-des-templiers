<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- One Pinterest pin (1000x1500). pins.py calls pin(cfg) then takes a screenshot. -->
<style>
@font-face{font-family:"UnifrakturMaguntia";src:url(../../fonts/UnifrakturMaguntia-Book.woff) format("woff")}
@font-face{font-family:"Alegreya Sans";src:url(../../fonts/AlegreyaSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../fonts/AlegreyaSans-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Alegreya Sans SC";src:url(../../fonts/AlegreyaSansSC-Bold.woff) format("woff");font-weight:700}
*{box-sizing:border-box;margin:0}
html,body{width:1000px;height:1500px;overflow:hidden}
body{font-family:"Alegreya Sans",sans-serif}
.pin{width:1000px;height:1500px;display:flex;flex-direction:column;padding:90px 80px 70px;gap:44px}
.navy{background:#11152a;color:#ebe9f4}.navy .accent{color:#e58b95}.navy .gold{color:#e0b55a}.navy .soft{color:#a3a8c3}
.stone{background:#eef0f5;color:#1b2547}.stone .accent{color:#b8505c}.stone .gold{color:#a87a1f}.stone .soft{color:#5b6482}
.rose{background:#f6e3e5;color:#1b2547}.rose .accent{color:#b8505c}.rose .gold{color:#a87a1f}.rose .soft{color:#5b6482}
.kicker{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:40px;letter-spacing:2px}
h1{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:108px;line-height:1.04}
h1.small{font-size:92px}
h1.sans{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:94px;line-height:1.08}
.items{font-size:52px}.items div{grid-template-columns:86px 1fr}.items svg{width:76px;height:88px}
.sub{font-size:48px;line-height:1.3}
.art{flex:1;display:flex;align-items:center;justify-content:center}
.items{display:flex;flex-direction:column;gap:30px;font-size:46px;line-height:1.25}
.items div{display:grid;grid-template-columns:76px 1fr;gap:22px;align-items:start}
.items svg{width:66px;height:76px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;border-top:3px solid currentColor;padding-top:30px;opacity:.95}
.brand{font-family:"UnifrakturMaguntia",serif;font-size:62px;line-height:1}
.cta{font-family:"Alegreya Sans SC",sans-serif;font-weight:700;font-size:36px;letter-spacing:1px;text-align:right}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SEAL=(fill)=>`<svg viewBox="-30 -30 60 60" width="300" height="300"><path d="M0-27c4 0 5 2 8 2s5-1 8 1 1 5 3 7 5 2 6 5-1 5-1 8 2 5 0 8-5 2-7 4-2 5-5 6-5-1-8 0-4 3-7 3-4-2-7-3-6 0-8-2-1-5-3-7-5-3-6-6 1-5 0-8-3-5-1-8 5-2 7-4 2-6 5-7 5 1 8 0 3-3 6-3z" fill="${fill}"/><circle r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/><path d="M-1.6-1.6-5-12H5L1.6-1.6 12-5V5L1.6 1.6 5 12H-5L-1.6 1.6-12 5V-5Z" fill="#fff" fill-opacity=".85"/></svg>`;
const SHIELD=(n,stroke,fill,txt)=>`<svg viewBox="0 0 40 46"><path d="M3 3h34v16c0 13-8 20-17 24C11 39 3 32 3 19z" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/><text x="20" y="28" text-anchor="middle" font-family="Alegreya Sans SC" font-weight="700" font-size="17" fill="${txt}">${n}</text></svg>`;
// A walk between shields: the route of a quest, drawn as stops on a dotted path.
const ROUTE=(c)=>{const pts=[[120,520],[300,330],[520,470],[700,250],[820,430]];
  return `<svg viewBox="0 0 900 640" width="840">${pts.slice(1).map((p,i)=>`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="${c.or}" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>`).join("")}
  ${pts.map((p,i)=>`<g transform="translate(${p[0]-45} ${p[1]-52}) scale(2.25)"><path d="M3 3h34v16c0 13-8 20-17 24C11 39 3 32 3 19z" fill="${i===pts.length-1?c.rose:c.card}" stroke="${c.or}" stroke-width="2.5"/><text x="20" y="28" text-anchor="middle" font-family="Alegreya Sans SC" font-weight="700" font-size="17" fill="${i===pts.length-1?"#fff":c.rose}">${i+1}</text></g>`).join("")}</svg>`;};
const PAL={navy:{or:"#e0b55a",rose:"#b8505c",card:"#1a2038",ink:"#ebe9f4"},stone:{or:"#a87a1f",rose:"#b8505c",card:"#ffffff",ink:"#1b2547"},rose:{or:"#a87a1f",rose:"#b8505c",card:"#ffffff",ink:"#1b2547"}};
function pin(cfg){
  const c=PAL[cfg.theme];
  let art="";
  if(cfg.art==="seal")art=SEAL(c.rose);
  else if(cfg.art==="route")art=ROUTE(c);
  else if(cfg.art==="items")art=`<div class="items">${cfg.items.map((t,i)=>`<div>${SHIELD(cfg.numbered?i+1:"",c.or,c.card,c.rose)}<span>${t}</span></div>`).join("")}</div>`;
  else if(cfg.art==="quote")art=`<p class="sub" style="font-style:italic;border-left:8px solid ${c.or};padding-left:34px">${cfg.quote}</p>`;
  document.getElementById("root").innerHTML=`<div class="pin ${cfg.theme}">
    <div class="kicker gold">${cfg.kicker}</div>
    <h1 class="${cfg.title.length>32?"sans":cfg.small?"small":""}">${cfg.title}</h1>
    ${cfg.sub?`<p class="sub soft">${cfg.sub}</p>`:""}
    <div class="art">${art}</div>
    <div class="foot"><div class="brand accent">Ma Quête de Chevalier</div><div class="cta">${cfg.cta||"Aperçu gratuit"}</div></div></div>`;
}
</script>
</body>
</html>
